[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ordivon-skills-bridge"
version = "0.1.0"
description = "Temporary standards-first Agent Skills compatibility bridge for Ordivon."
requires-python = "==3.14.7"
license = "Apache-2.0"
dependencies = [
  "mcp==2.0.0",
  "uvicorn==0.52.1",
  "PyYAML==6.0.3",
  "pyjwt[crypto]==2.13.0",
]

[dependency-groups]
dev = ["ruff==0.16.8"]
test = [
  "httpx==0.28.1",
  "jsonschema>=4.26,<5",
  "pytest==9.1.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "UP"]

[tool.uv.build-backend]
module-name = "ordivon_skills"
