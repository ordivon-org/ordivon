[tools]
# Nested agent-request-verifier and agent-admission packages consume this owner toolchain.
node = "26.12.1"
pnpm = "12.16.1"
python = "3.15.1"
uv = "0.13.5"
shellcheck = "0.11.0"
opa = "1.21.4"

[tasks.verify]
run = """
set -euo pipefail
uv sync --locked --python 3.15.1
uv run --frozen --python 3.15.1 ruff check .
uv run --frozen --python 3.15.1 python -m unittest discover -s tests -v
uv run --frozen --python 3.15.1 python scripts/validate_threat_model_binding.py threat-models/security-v2-r1.json --repo-root .
./scripts/validate_tmbom.sh threat-models/security-v2-r1.json
# Exactly one installed, owner-pinned OPA version. Never resolve via
# ambient /usr/bin/opa, duplicate provider snapshots or a Docker daemon.
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- opa test -v --fail-on-empty policies
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""
