[tools]
# Nested agent-request-verifier and agent-admission packages consume this owner toolchain.
node = "26.12.1"
pnpm = "12.16.1"
python = "3.15.2"
uv = "0.13.5"
shellcheck = "0.11.0"
opa = "1.22.4"

[tasks.verify]
run = """
set -euo pipefail
# The owner selects one interpreter; all uv consumers share its identity.
export UV_PYTHON="$(mise which python)"
uv sync --locked
uv run --frozen ruff check .
# Fail on a stale architecture binding before spending the full test budget.
uv run --frozen python scripts/validate_threat_model_binding.py threat-models/security-v2-r1.json --repo-root .
./scripts/validate_tmbom.sh threat-models/security-v2-r1.json
# Reuse the same Core execution and presence checks as impact diagnostics.
mise run verify-core
# Exactly one installed, owner-pinned OPA version. Never resolve via
# ambient /usr/bin/opa, duplicate provider snapshots or a Docker daemon.
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- opa test -v --fail-on-empty policies
# Security-owned AuthZEN PDP must qualify its actual OPA decision and
# adversarial HTTP consumers in the ordinary Security owner CI. This nested
# locked package does not add dependencies to the Security evidence core.
uv run --locked --project services/gateway-authzen --group dev ruff check services/gateway-authzen
uv run --locked --project services/gateway-authzen --group dev ruff format --check services/gateway-authzen
uv run --locked --project services/gateway-authzen --group dev python -m pytest -q services/gateway-authzen/tests
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- opa check --strict services/gateway-authzen/policies/gateway_artifact.rego
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""

# Shared Core execution; no test selection based on historical coverage.
[tasks.verify-core]
run = """
set -euo pipefail
coverage_dir="$(mktemp -d)"
trap 'rm -rf -- "$coverage_dir"' EXIT
export COVERAGE_FILE="$coverage_dir/core"
export COVERAGE_RCFILE="$PWD/pyproject.toml"
uv run --frozen coverage run -m unittest discover -s tests -v
uv run --frozen coverage combine
uv run --frozen coverage report --include='*/ordivon_security_v2/*'
# Actual CLI execution presence, not a semantic percentage threshold.
uv run --frozen coverage report --include='*/scripts/verify_remediation_delta.py' --fail-under=1
if [[ "${ORDIVON_SECURITY_COVERAGE_CONTEXT:-}" == "test_function" ]]; then
  # Both slices are diagnostic; lines can belong to both and neither is a
  # complete dependency graph. No context is promoted to a negative edge.
  echo 'IMPACT_DIAGNOSTIC_CONTEXT_ASSIGNED'
  uv run --frozen coverage report --include='*/ordivon_security_v2/*,*/scripts/verify_remediation_delta.py' --contexts='.+' --fail-under=0
  echo 'IMPACT_DIAGNOSTIC_CONTEXT_UNASSIGNED'
  uv run --frozen coverage report --include='*/ordivon_security_v2/*,*/scripts/verify_remediation_delta.py' --contexts='^$' --fail-under=0
fi
"""

# Developer diagnosis only. The full ordinary owner gate still executes all
# Core, OPA, AuthZEN and native checks; impact never decides what to skip.
[tasks.verify-test-impact]
run = """
set -euo pipefail
export UV_PYTHON="$(mise which python)"
uv sync --locked
export ORDIVON_SECURITY_COVERAGE_CONTEXT=test_function
mise run verify-core
"""

# Deliberately separate from the merge-critical test budget. Mutmut writes
# generated sources and reports only to a private scratch checkout subset.
[tasks.verify-mutation]
run = """
set -euo pipefail
export UV_PYTHON="$(mise which python)"
uv sync --locked --group mutation
bin="$(uv run --frozen --group mutation python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')"
mutation_dir="$(mktemp -d)"
trap 'rm -rf -- "$mutation_dir"' EXIT
mkdir -p "$mutation_dir/src" "$mutation_dir/tests"
cp -a src/ordivon_security_v2 "$mutation_dir/src/"
cp tests/test_evidence_properties.py "$mutation_dir/tests/"
cp pyproject.toml "$mutation_dir/"
(
  cd "$mutation_dir"
  export PATH="$bin:$PATH"
  export PYTHONPATH="$PWD/src"
  sha256sum src/ordivon_security_v2/browser_security_observation.py tests/test_evidence_properties.py
  python -c 'import importlib.metadata as m; print({x:m.version(x) for x in ("mutmut","pytest","hypothesis")})'
  python -m pytest -q tests/test_evidence_properties.py -k public_json_diff
  mutmut run --max-children 2 '*changed_json_paths*'
  mutmut export-cicd-stats
  cat mutants/mutmut-cicd-stats.json
  mutmut results
)
"""

# Reuse the existing pinned Lean provider in tools/formal. This is a scoped
# machine-checked model proof, separate from OPA test/code refinement and the
# real-world observation issuer. Kept opt-in because the heavyweight formal
# tool group is intentionally separate from ordinary repo:ci.
[tasks.verify-formal]
run = """
set -euo pipefail
cd ../../tools/formal
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- lean ../../platform/security/formal/ConsequenceEvidence.lean
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- lean ../../platform/security/formal/AgentApprovalBinding.lean
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- lean ../../platform/security/formal/EffectAuthorityBinding.lean
MISE_OFFLINE=1 MISE_AUTO_INSTALL=false mise exec -- lean ../../platform/security/formal/BuildEvidenceBinding.lean
"""
