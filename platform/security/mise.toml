[tools]
python = "3.14.7"
uv = "0.12.16"
shellcheck = "0.11.0"
opa = "1.20.2"

[tasks.verify]
run = """
set -euo pipefail
uv sync --frozen --python 3.14.7
uv run --frozen --python 3.14.7 ruff check .
uv run --frozen --python 3.14.7 python -m unittest discover -s tests -v
uv run --frozen --python 3.14.7 python scripts/validate_threat_model_binding.py threat-models/security-v2-r1.json --repo-root .
./scripts/validate_tmbom.sh threat-models/security-v2-r1.json
opa_executable=$(uv run --frozen --python 3.14.7 python - <<'PY'
import json
value = json.load(open("providers.lock.json", encoding="utf-8"))
opa = next(row for row in value["providers"] if row["name"] == "opa")
print(opa["executable"])
PY
)
opa_expected_sha256=$(uv run --frozen --python 3.14.7 python - <<'PY'
import json
value = json.load(open("providers.lock.json", encoding="utf-8"))
opa = next(row for row in value["providers"] if row["name"] == "opa")
print(opa["sha256"])
PY
)
opa_expected_version=$(uv run --frozen --python 3.14.7 python - <<'PY'
import json
value = json.load(open("providers.lock.json", encoding="utf-8"))
opa = next(row for row in value["providers"] if row["name"] == "opa")
print(opa["version"])
PY
)
test -x "$opa_executable"
opa_observed_sha256="sha256:$(sha256sum "$opa_executable" | awk '{print $1}')"
test "$opa_observed_sha256" = "$opa_expected_sha256"
opa_observed_version=$("$opa_executable" version | awk -F ': ' '/^Version:/{print $2; exit}')
test "$opa_observed_version" = "$opa_expected_version"
"$opa_executable" test -v policies
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""
