env:
  contexts:
  - name: local-authorized
    urls:
    - http://127.0.0.1:18080
  parameters:
    failOnError: true
    failOnWarning: true
    progressToStdout: true
jobs:
- type: spider
  parameters:
    context: local-authorized
- type: activeScan-policy
  parameters:
    name: bounded-xss
  policyDefinition:
    defaultStrength: "Low"
    defaultThreshold: "Off"
    rules:
    - id: 40012
      name: Cross Site Scripting Reflected
      strength: "Low"
      threshold: "Low"
- type: activeScan
  parameters:
    context: local-authorized
    policy: bounded-xss
- type: report
  parameters:
    template: traditional-json
    reportDir: /tmp/ordivon-security-v2-zap-r1/report
    reportFile: zap-report.json
    reportTitle: Security v2 local authorized ZAP acceptance
    displayReport: false
