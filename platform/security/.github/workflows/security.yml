name: security-v2-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-waist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
      - run: uv python install 3.14.7
      - run: uv sync --frozen --python 3.14.7
      - run: uv run --frozen --python 3.14.7 python -m unittest discover -s tests -v
      - name: Validate canonical threat model binding
        run: uv run --frozen --python 3.14.7 python scripts/validate_threat_model_binding.py threat-models/security-v2-r1.json --repo-root .
      - name: Validate TM-BOM schema
        run: ./scripts/validate_tmbom.sh threat-models/security-v2-r1.json
      - name: OPA policy tests
        run: |
          echo "OPA is an external runtime dependency; local Runtime acceptance pins and executes the installed binary."
