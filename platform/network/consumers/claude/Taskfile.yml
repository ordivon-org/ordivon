version: '3'

tasks:
  consumer:claude:validate:
    desc: Validate the Claude Code Anthropic-only HTTPS authority plus isolated client namespace
    cmds:
      - /usr/bin/sing-box check -c consumers/claude/config/sing-box.json
      - /usr/bin/systemd-analyze verify consumers/claude/systemd/network-v2-claude-proxy.service consumers/claude/systemd/network-v2-claude-relay.service consumers/claude/systemd/network-v2-claude.target consumers/claude/systemd/network-v2-claude-client-netns.service consumers/claude/systemd/network-v2-claude-client-bridge.service consumers/claude/systemd/network-v2-claude-client.target
      - /usr/bin/bash -n consumers/claude/ready.sh
      - jq -e '.schemaVersion==1 and .kind=="ordivon.network-v2.claude-egress" and .listen=={"host":"127.0.0.1","port":19481,"protocol":"http"} and .networkAuthority.namespace=="nv2-browserless-prod" and .networkAuthority.serviceUnit=="network-v2-shared-egress.target" and .directFallback==false' consumers/claude/config/authority.json >/dev/null
      - jq -e '.route=={"rules":[],"final":"provider-carrier"} and .outbounds==[{"type":"http","tag":"provider-carrier","server":"10.252.246.2","server_port":19680}] and (has("dns")|not)' consumers/claude/config/sing-box.json >/dev/null

  consumer:claude:classify:
    desc: Prove source/installed/loaded MATCH or DRIFT; UNKNOWN cannot authorize installation or restart
    cmds:
      - |
        python3 scripts/native-sourcecut.py \
          --file consumers/claude/config/authority.json /etc/network-v2/claude/authority.json \
          --file consumers/claude/config/sing-box.json /etc/network-v2/claude/sing-box.json \
          --file consumers/claude/systemd/network-v2-claude-proxy.service /etc/systemd/system/network-v2-claude-proxy.service \
          --file consumers/claude/systemd/network-v2-claude-relay.service /etc/systemd/system/network-v2-claude-relay.service \
          --file consumers/claude/systemd/network-v2-claude.target /etc/systemd/system/network-v2-claude.target \
          --file consumers/claude/systemd/network-v2-claude-client-netns.service /etc/systemd/system/network-v2-claude-client-netns.service \
          --file consumers/claude/systemd/network-v2-claude-client-bridge.service /etc/systemd/system/network-v2-claude-client-bridge.service \
          --file consumers/claude/systemd/network-v2-claude-client.target /etc/systemd/system/network-v2-claude-client.target \
          --file consumers/claude/ready.sh /usr/local/libexec/network-v2/claude-ready \
          --mode /usr/local/libexec/network-v2/claude-ready 0755 \
          --unit-enabled network-v2-claude.target enabled \
          --unit-enabled network-v2-claude-client.target enabled \
          --unit-loaded network-v2-claude-proxy.service \
          --unit-loaded network-v2-claude-relay.service \
          --unit-loaded network-v2-claude.target \
          --unit-loaded network-v2-claude-client-netns.service \
          --unit-loaded network-v2-claude-client-bridge.service \
          --unit-loaded network-v2-claude-client.target

  consumer:claude:sourcecut:
    desc: Require exact local SourceCut MATCH independently of external network health
    cmds:
      - |
        verdict="$(task --silent consumer:claude:classify)" || exit 2
        test "$verdict" = MATCH

  consumer:claude:materialize:
    desc: Materialize the Claude scoped egress and no-direct-route client namespace without restarting the shared physical Gluetun VPN
    deps: [consumer:claude:validate]
    # A Boolean Go Task status is a skip hint; the first effect command
    # independently reclassifies UNKNOWN versus a witnessed DRIFT.
    status:
      - task consumer:claude:sourcecut
    cmds:
      - |
        verdict="$(task --silent consumer:claude:classify)" || {
          echo 'claude SourceCut UNKNOWN: refusing materialization' >&2
          exit 2
        }
        test "$verdict" = DRIFT || {
          echo 'claude SourceCut not provably DRIFT: refusing materialization' >&2
          exit 2
        }
      - install -d -m 0755 /etc/network-v2/claude
      - install -m 0644 consumers/claude/config/authority.json /etc/network-v2/claude/authority.json
      - install -m 0644 consumers/claude/config/sing-box.json /etc/network-v2/claude/sing-box.json
      - install -m 0644 consumers/claude/systemd/network-v2-claude-proxy.service /etc/systemd/system/network-v2-claude-proxy.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-relay.service /etc/systemd/system/network-v2-claude-relay.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude.target /etc/systemd/system/network-v2-claude.target
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client-netns.service /etc/systemd/system/network-v2-claude-client-netns.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client-bridge.service /etc/systemd/system/network-v2-claude-client-bridge.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client.target /etc/systemd/system/network-v2-claude-client.target
      - install -m 0755 consumers/claude/ready.sh /usr/local/libexec/network-v2/claude-ready
      - systemctl daemon-reload
      - systemctl enable network-v2-claude.target network-v2-claude-client.target

  consumer:claude:start:
    desc: Start the isolated Claude client path without changing host default routing
    deps: [consumer:claude:materialize]
    cmds:
      - systemctl start network-v2-claude-client.target

  consumer:claude:ready:
    desc: Prove client transport and no direct route; policy no-forward is independently qualified by consumer:claude:verify
    cmds:
      - /usr/local/libexec/network-v2/claude-ready

  consumer:claude:process-fresh:
    desc: Observe native running process/config creation order independently of installed SourceCut
    cmds:
      - python3 scripts/native-sourcecut.py --unit-process-file network-v2-claude-proxy.service /etc/network-v2/claude/sing-box.json /usr/bin/sing-box '["run","-c"]'

  consumer:claude:converge:
    desc: Separate installed SourceCut from active sing-box process generation; recover an interrupted restart
    cmds:
      - |
        if flock -n -E 75 /run/lock/ordivon-network-v2-converge.lock /bin/sh -s <<'NETWORK_V2_CONVERGE'; then
        set -eu
        task --silent consumer:claude:validate
        source_state="$(task --silent consumer:claude:classify)" || {
          echo 'claude SourceCut UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        process_state="$(task --silent consumer:claude:process-fresh)" || {
          echo 'claude running generation UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        case "$source_state/$process_state" in
          MATCH/MATCH)
            systemctl start network-v2-claude.target
            systemctl start network-v2-claude-client.target
            ;;
          MATCH/DRIFT)
            # Already-installed source was not consumed after an interrupted
            # previous release: restart only this owner's units, never VPN.
            systemctl restart network-v2-claude.target
            systemctl restart network-v2-claude-client.target
            ;;
          DRIFT/MATCH|DRIFT/DRIFT)
            task --silent consumer:claude:materialize
            task --silent consumer:claude:sourcecut
            systemctl restart network-v2-claude.target
            systemctl restart network-v2-claude-client.target
            ;;
          *)
            echo 'claude SourceCut/process admission unknown: refusing converge effects' >&2
            exit 2
            ;;
        esac
        systemctl is-active --quiet network-v2-claude-proxy.service
        task --silent consumer:claude:sourcecut
        test "$(task --silent consumer:claude:process-fresh)" = MATCH
        task --silent consumer:claude:verify
        NETWORK_V2_CONVERGE
          :
        else
          result=$?
          if test "$result" -eq 75; then
            echo 'UNKNOWN: a Network converge is already in progress; refusing overlapping effects' >&2
          fi
          exit "$result"
        fi

  consumer:claude:verify:
    desc: Verify exact deployed Claude authority/client bytes and live consequence readiness
    cmds:
      - test "$(systemctl show --value -p PartOf network-v2-claude-proxy.service)" = network-v2-claude.target
      - test "$(systemctl show --value -p NeedDaemonReload network-v2-claude-proxy.service)" = no
      - test "$(systemctl show --value -p PartOf network-v2-claude-relay.service)" = network-v2-claude.target
      - test "$(systemctl show --value -p NeedDaemonReload network-v2-claude-relay.service)" = no
      - cmp -s consumers/claude/config/authority.json /etc/network-v2/claude/authority.json
      - cmp -s consumers/claude/config/sing-box.json /etc/network-v2/claude/sing-box.json
      - cmp -s consumers/claude/systemd/network-v2-claude-proxy.service /etc/systemd/system/network-v2-claude-proxy.service
      - cmp -s consumers/claude/systemd/network-v2-claude-relay.service /etc/systemd/system/network-v2-claude-relay.service
      - cmp -s consumers/claude/systemd/network-v2-claude.target /etc/systemd/system/network-v2-claude.target
      - cmp -s consumers/claude/systemd/network-v2-claude-client-netns.service /etc/systemd/system/network-v2-claude-client-netns.service
      - cmp -s consumers/claude/systemd/network-v2-claude-client-bridge.service /etc/systemd/system/network-v2-claude-client-bridge.service
      - cmp -s consumers/claude/systemd/network-v2-claude-client.target /etc/systemd/system/network-v2-claude-client.target
      - systemctl is-enabled --quiet network-v2-claude.target
      - systemctl is-enabled --quiet network-v2-claude-client.target
      - /usr/local/libexec/network-v2/claude-ready
      - python3 acceptance/egress/live-carrier-witness.py --consumers claude

  consumer:claude:stop:
    desc: Stop only Claude-owned network units; the shared physical Gluetun VPN remains untouched
    cmds:
      - systemctl stop network-v2-claude-client.target network-v2-claude.target
