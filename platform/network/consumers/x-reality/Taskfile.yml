version: '3'

tasks:
  consumer:x-reality:validate:
    desc: Validate exact X API transport authority without reading or materializing authentication credentials
    deps: [provider:gluetun:validate]
    cmds:
      - /usr/bin/sing-box check -c consumers/x-reality/config/egress.json
      - jq -e '.schemaVersion==1 and .kind=="ordivon.network-v2.x-reality-egress" and .listen=={"host":"127.0.0.1","port":19681,"protocol":"http"} and .allowedHttpsDomains==["api.x.com"] and .directFallback==false and .authenticationAuthority.separate==true and .authenticationAuthority.transportConsumerOwnsCredential==false and .authenticationAuthority.userContextProven==false' consumers/x-reality/config/authority.json >/dev/null
      - jq -e '.inbounds==[{"type":"http","tag":"x-reality-api","listen":"127.0.0.1","listen_port":19681}] and .outbounds==[{"type":"http","tag":"provider-carrier","server":"10.252.246.2","server_port":19680}] and .route=={"rules":[],"final":"provider-carrier"}' consumers/x-reality/config/egress.json >/dev/null
      - /usr/bin/systemd-analyze verify consumers/x-reality/systemd/network-v2-x-reality-egress.service consumers/x-reality/systemd/network-v2-x-reality.target
      - /usr/bin/bash -n consumers/x-reality/ready.sh

  consumer:x-reality:classify:
    desc: Prove source/installed/loaded MATCH or DRIFT; UNKNOWN cannot authorize installation or restart
    cmds:
      - |
        python3 scripts/native-sourcecut.py \
          --file consumers/x-reality/config/authority.json /etc/network-v2/x-reality/authority.json \
          --file consumers/x-reality/config/egress.json /etc/network-v2/x-reality/egress.json \
          --file consumers/x-reality/systemd/network-v2-x-reality-egress.service /etc/systemd/system/network-v2-x-reality-egress.service \
          --file consumers/x-reality/systemd/network-v2-x-reality.target /etc/systemd/system/network-v2-x-reality.target \
          --file consumers/x-reality/ready.sh /usr/local/libexec/network-v2/x-reality-ready \
          --mode /usr/local/libexec/network-v2/x-reality-ready 0755 \
          --absent /usr/local/libexec/network-v2/x-reality-fault-smoke \
          --unit-enabled network-v2-x-reality.target enabled \
          --unit-loaded network-v2-x-reality-egress.service \
          --unit-loaded network-v2-x-reality.target

  consumer:x-reality:sourcecut:
    desc: Require exact local SourceCut MATCH independently of external network health
    cmds:
      - |
        verdict="$(task --silent consumer:x-reality:classify)" || exit 2
        test "$verdict" = MATCH

  consumer:x-reality:materialize:
    desc: Materialize bounded X API transport without credential effects
    deps: [consumer:x-reality:validate]
    # A Boolean Go Task status is a skip hint; the first effect command
    # independently reclassifies UNKNOWN versus a witnessed DRIFT.
    status:
      - task consumer:x-reality:sourcecut
    cmds:
      - |
        verdict="$(task --silent consumer:x-reality:classify)" || {
          echo 'x-reality SourceCut UNKNOWN: refusing materialization' >&2
          exit 2
        }
        test "$verdict" = DRIFT || {
          echo 'x-reality SourceCut not provably DRIFT: refusing materialization' >&2
          exit 2
        }
      - install -d -m 0755 /etc/network-v2/x-reality /usr/local/libexec/network-v2
      - install -m 0644 consumers/x-reality/config/authority.json /etc/network-v2/x-reality/authority.json
      - install -m 0644 consumers/x-reality/config/egress.json /etc/network-v2/x-reality/egress.json
      - install -m 0644 consumers/x-reality/systemd/network-v2-x-reality-egress.service /etc/systemd/system/network-v2-x-reality-egress.service
      - install -m 0644 consumers/x-reality/systemd/network-v2-x-reality.target /etc/systemd/system/network-v2-x-reality.target
      - install -m 0755 consumers/x-reality/ready.sh /usr/local/libexec/network-v2/x-reality-ready
      - rm -f /usr/local/libexec/network-v2/x-reality-fault-smoke
      - systemctl daemon-reload
      - systemctl enable network-v2-x-reality.target

  consumer:x-reality:start:
    desc: Start only the bounded X transport authority
    deps: [consumer:x-reality:materialize]
    cmds:
      - systemctl start network-v2-x-reality.target

  consumer:x-reality:ready:
    desc: Prove X destination transport by expected unauthenticated HTTP 401 and unknown-domain rejection
    cmds:
      - /usr/local/libexec/network-v2/x-reality-ready

  consumer:x-reality:process-fresh:
    desc: Observe native running process/config creation order independently of installed SourceCut
    cmds:
      - python3 scripts/native-sourcecut.py --unit-process-file network-v2-x-reality-egress.service /etc/network-v2/x-reality/egress.json /usr/bin/sing-box '["run","-c"]'

  consumer:x-reality:converge:
    desc: Separate installed SourceCut from active sing-box process generation; recover an interrupted restart
    cmds:
      - |
        if flock -n -E 75 /run/lock/ordivon-network-v2-converge.lock /bin/sh -s <<'NETWORK_V2_CONVERGE'; then
        set -eu
        task --silent consumer:x-reality:validate
        source_state="$(task --silent consumer:x-reality:classify)" || {
          echo 'x-reality SourceCut UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        process_state="$(task --silent consumer:x-reality:process-fresh)" || {
          echo 'x-reality running generation UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        case "$source_state/$process_state" in
          MATCH/MATCH)
            systemctl start network-v2-x-reality.target
            ;;
          MATCH/DRIFT)
            # Already-installed source was not consumed after an interrupted
            # previous release: restart only this owner's units, never VPN.
            systemctl restart network-v2-x-reality.target
            ;;
          DRIFT/MATCH|DRIFT/DRIFT)
            task --silent consumer:x-reality:materialize
            task --silent consumer:x-reality:sourcecut
            systemctl restart network-v2-x-reality.target
            ;;
          *)
            echo 'x-reality SourceCut/process admission unknown: refusing converge effects' >&2
            exit 2
            ;;
        esac
        systemctl is-active --quiet network-v2-x-reality-egress.service
        task --silent consumer:x-reality:sourcecut
        test "$(task --silent consumer:x-reality:process-fresh)" = MATCH
        task --silent consumer:x-reality:ready
        NETWORK_V2_CONVERGE
          :
        else
          result=$?
          if test "$result" -eq 75; then
            echo 'UNKNOWN: a Network converge is already in progress; refusing overlapping effects' >&2
          fi
          exit "$result"
        fi

  consumer:x-reality:verify:
    desc: Verify deployed X authority bytes, live transport consequence and carrier fail-closed semantics
    cmds:
      - cmp -s consumers/x-reality/config/authority.json /etc/network-v2/x-reality/authority.json
      - cmp -s consumers/x-reality/config/egress.json /etc/network-v2/x-reality/egress.json
      - cmp -s consumers/x-reality/systemd/network-v2-x-reality-egress.service /etc/systemd/system/network-v2-x-reality-egress.service
      - cmp -s consumers/x-reality/systemd/network-v2-x-reality.target /etc/systemd/system/network-v2-x-reality.target
      - /usr/local/libexec/network-v2/x-reality-ready
      - test ! -e /usr/local/libexec/network-v2/x-reality-fault-smoke
      - test -e /etc/network-v2/gluetun/m4-owned-mode.selected
      - systemctl is-active --quiet network-v2-gluetun-owned-adapter.service

  consumer:x-reality:stop:
    desc: Stop only X semantic transport; leave the shared physical carrier untouched
    cmds:
      - systemctl stop network-v2-x-reality.target
