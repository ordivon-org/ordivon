version: '3'

tasks:
  consumer:finance:validate:
    desc: Validate nine scoped Finance authorities over the shared provider carrier plus explicit direct macro lanes
    cmds:
      - /usr/bin/sing-box check -c consumers/finance/config/egress.json
      - jq -e '.inbounds|length==9' consumers/finance/config/egress.json >/dev/null
      - jq -e 'any(.inbounds[]; .tag=="finance-binance-wallet" and .listen=="127.0.0.1" and .listen_port==19290) and .route.final=="provider-carrier" and (.route.rules|length)==2' consumers/finance/config/egress.json >/dev/null
      - jq -e '([.route.rules[]|select(.action=="route" and .outbound=="public-direct" and ((.inbound|length)==1))|.inbound[0]]|sort)==["finance-fred-public-csv","finance-us-treasury-public"] and all(.route.rules[]; (keys|sort)==["action","inbound","outbound"])' consumers/finance/config/egress.json >/dev/null
      - jq -e '.outbounds==[{"type":"http","tag":"provider-carrier","server":"10.252.246.2","server_port":19680},{"type":"direct","tag":"public-direct"}] and (has("dns")|not) and (has("services")|not)' consumers/finance/config/egress.json >/dev/null
      - jq -e 'all(.route.rules[]; ((.outbound? // "") != "provider-auto"))' consumers/finance/config/egress.json >/dev/null
      - /usr/bin/systemd-analyze verify consumers/finance/systemd/network-v2-finance-egress.service consumers/finance/systemd/network-v2-finance.target
      - /usr/bin/bash -n consumers/finance/ready.sh
      - jq -e '.kind=="ordivon.network-v2.scoped-egress-authority" and .directFallback==false and (.proxy|startswith("http://127.0.0.1:"))' consumers/finance/config/*-authority.json >/dev/null
      - '! grep -R -F "provider-auto" consumers/finance/config'

  consumer:finance:classify:
    desc: Prove source/installed/loaded MATCH or DRIFT; UNKNOWN cannot authorize installation or restart
    cmds:
      - |
        python3 scripts/native-sourcecut.py \
          --file consumers/finance/config/egress.json /etc/network-v2/finance/egress.json \
          --file consumers/finance/systemd/network-v2-finance-egress.service /etc/systemd/system/network-v2-finance-egress.service \
          --file consumers/finance/systemd/network-v2-finance.target /etc/systemd/system/network-v2-finance.target \
          --file consumers/finance/ready.sh /usr/local/libexec/network-v2/finance-ready \
          --mode /usr/local/libexec/network-v2/finance-ready 0755 \
          --glob "consumers/finance/config/*-authority.json" /etc/network-v2/finance/ \
          --absent /etc/network-v2/finance/provider-endpoints.json \
          --unit-enabled network-v2-finance.target enabled \
          --unit-loaded network-v2-finance-egress.service \
          --unit-loaded network-v2-finance.target

  consumer:finance:sourcecut:
    desc: Require exact local SourceCut MATCH independently of external network health
    cmds:
      - |
        verdict="$(task --silent consumer:finance:classify)" || exit 2
        test "$verdict" = MATCH

  consumer:finance:materialize:
    desc: Materialize nine Finance authorities over the shared provider carrier without creating another WireGuard session
    deps: [consumer:finance:validate]
    # A Boolean Go Task status is a skip hint; the first effect command
    # independently reclassifies UNKNOWN versus a witnessed DRIFT.
    status:
      - task consumer:finance:sourcecut
    cmds:
      - |
        verdict="$(task --silent consumer:finance:classify)" || {
          echo 'finance SourceCut UNKNOWN: refusing materialization' >&2
          exit 2
        }
        test "$verdict" = DRIFT || {
          echo 'finance SourceCut not provably DRIFT: refusing materialization' >&2
          exit 2
        }
      - install -d -m 0755 /etc/network-v2/finance /usr/local/libexec/network-v2
      - install -m 0644 consumers/finance/config/egress.json /etc/network-v2/finance/egress.json
      - install -m 0644 consumers/finance/config/*-authority.json /etc/network-v2/finance/
      - rm -f /etc/network-v2/finance/provider-endpoints.json
      - for: { var: FINANCE_SYSTEMD_UNITS }
        cmd: install -m 0644 {{.ITEM}} /etc/systemd/system/{{base .ITEM}}
      - install -m 0755 consumers/finance/ready.sh /usr/local/libexec/network-v2/finance-ready
      - systemctl daemon-reload
      - systemctl enable network-v2-finance.target

  consumer:finance:start:
    desc: Start the materialized Finance authorities over the one shared provider carrier
    cmds:
      - systemctl start network-v2-finance.target

  consumer:finance:ready:
    desc: Wait for bounded public read-only consequence readiness through the admitted Finance authorities
    cmds:
      - /usr/local/libexec/network-v2/finance-ready public 90

  consumer:finance:process-fresh:
    desc: Observe native running process/config creation order independently of installed SourceCut
    cmds:
      - python3 scripts/native-sourcecut.py --unit-process-file network-v2-finance-egress.service /etc/network-v2/finance/egress.json /usr/bin/sing-box '["run","-c"]'

  consumer:finance:converge:
    desc: Separate installed SourceCut from active sing-box process generation; recover an interrupted restart
    cmds:
      - |
        if flock -n -E 75 /run/lock/ordivon-network-v2-converge.lock /bin/sh -s <<'NETWORK_V2_CONVERGE'; then
        set -eu
        task --silent consumer:finance:validate
        source_state="$(task --silent consumer:finance:classify)" || {
          echo 'finance SourceCut UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        process_state="$(task --silent consumer:finance:process-fresh)" || {
          echo 'finance running generation UNKNOWN: refusing converge effects' >&2
          exit 2
        }
        case "$source_state/$process_state" in
          MATCH/MATCH)
            systemctl start network-v2-finance.target
            ;;
          MATCH/DRIFT)
            # Already-installed source was not consumed after an interrupted
            # previous release: restart only this owner's units, never VPN.
            systemctl restart network-v2-finance.target
            ;;
          DRIFT/MATCH|DRIFT/DRIFT)
            task --silent consumer:finance:materialize
            task --silent consumer:finance:sourcecut
            systemctl restart network-v2-finance.target
            ;;
          *)
            echo 'finance SourceCut/process admission unknown: refusing converge effects' >&2
            exit 2
            ;;
        esac
        systemctl is-active --quiet network-v2-finance-egress.service
        task --silent consumer:finance:sourcecut
        test "$(task --silent consumer:finance:process-fresh)" = MATCH
        task --silent consumer:finance:ready
        NETWORK_V2_CONVERGE
          :
        else
          result=$?
          if test "$result" -eq 75; then
            echo 'UNKNOWN: a Network converge is already in progress; refusing overlapping effects' >&2
          fi
          exit "$result"
        fi

  consumer:finance:verify:
    desc: Prove deployed nine-lane policy and real read-only Finance consequences without restarting shared Provider
    deps: [consumer:finance:validate]
    cmds:
      - cmp -s consumers/finance/config/egress.json /etc/network-v2/finance/egress.json
      - for: { var: FINANCE_SYSTEMD_UNITS }
        cmd: cmp -s {{.ITEM}} /etc/systemd/system/{{base .ITEM}}
      - |
        for source in consumers/finance/config/*-authority.json; do
          cmp -s "$source" "/etc/network-v2/finance/$(basename "$source")"
        done
      - test ! -e /etc/network-v2/finance/provider-endpoints.json
      - test -e /etc/network-v2/gluetun/m4-owned-mode.selected
      - systemctl is-active --quiet network-v2-gluetun-owned-adapter.service
      - /usr/local/libexec/network-v2/finance-ready all 90
      - python3 acceptance/egress/finance-lane-witness.py

  consumer:finance:stop:
    desc: Stop only Finance northbound authorities; do not stop the shared provider carrier
    cmds:
      - systemctl stop network-v2-finance.target
