version: '3'

tasks:
  provider:gluetun:validate:
    desc: Validate existing Quadlet-owned single-session provider and recovery lifecycle without effects
    cmds:
      - bash -n providers/gluetun/identity-exclusive.sh
      - python3 -c 'import ast; ast.parse(open("providers/gluetun/native_profile.py").read())'
      - python3 -c 'import importlib.util; s=importlib.util.spec_from_file_location("native", "providers/gluetun/native_profile.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.read_selector_policy()'
      - grep -q '^Environment=WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/surfshark-wgkey$' providers/gluetun/quadlet/network-v2-gluetun-owned.container
      - sing-box check -c providers/gluetun/config/carrier-adapter.json
      - systemd-analyze verify providers/gluetun/systemd/network-v2-gluetun-owned-reconcile.service providers/gluetun/systemd/network-v2-gluetun-owned-reconcile.timer
      - grep -q '^EnvironmentFile=/etc/network-v2/gluetun/serialized-native.env$' providers/gluetun/quadlet/network-v2-gluetun-owned.container
      # Current provider-owned disposable netns is safer than an unqualified
      # persistent Pod with public default route before native VPN kill switch.
      # A stable Pod requires a separately proved pre-WG fail-closed path.
      - grep -qx '^Network=network-v2-gluetun-owned.network$' providers/gluetun/quadlet/network-v2-gluetun-owned.container
      - '! grep -Eq "^[[:space:]]*Pod=" providers/gluetun/quadlet/network-v2-gluetun-owned.container'
      - grep -q '^Secret=network-v2-gluetun-surfshark-wgkey,type=mount,target=surfshark-wgkey$' providers/gluetun/quadlet/network-v2-gluetun-owned.container

  provider:gluetun:native:prepare:
    desc: Materialize Surfshark native inputs using Podman Secret without restarting the VPN
    cmds:
      - python3 providers/gluetun/native_profile.py --apply

  provider:gluetun:dns-consumer:
    desc: Query Gluetun local DNS A/AAAA from its real running VPN network namespace; cacheable consumer evidence, NOT proof that each DoT upstream is healthy
    cmds:
      - |
        set -euo pipefail
        pid=$(/usr/bin/podman inspect network-v2-gluetun-owned-r1 | /usr/bin/jq -er '.[0] | select(.State.Running == true) | .State.Pid | select(type == "number" and . > 1)')
        test -r "/proc/$pid/ns/net"
        for rr in A AAAA; do
          answer=$(/usr/bin/nsenter --target "$pid" --net /usr/bin/dig +time=2 +tries=1 +short @127.0.0.1 example.com "$rr")
          test -n "$answer"
          case "$rr" in
            A) printf '%s\n' "$answer" | /usr/bin/grep -Eq '^[0-9]+(\.[0-9]+){3}$' ;;
            AAAA) printf '%s\n' "$answer" | /usr/bin/grep -Eq '^[[:xdigit:]:]+$' ;;
          esac
        done
        echo 'standing=VPN_NAMESPACE_GLUETUN_LOCAL_DNS_A_AAAA_READY'
        echo 'scope=consumer_answer_not_independent_DoT_upstream_or_device_origin'

  provider:gluetun:dns-dot-upstreams:
    desc: Probe the running VPN namespace DoT upstreams using validated TLS names, not host UDP probes or cached local DNS
    cmds:
      - |
        set -euo pipefail
        # Observe the running provider's actual declared DNS sources, not a
        # separately invented monitor policy or a secret-bearing env dump.
        metadata=$(/usr/bin/podman inspect network-v2-gluetun-owned-r1)
        pid=$(printf '%s' "$metadata" | /usr/bin/jq -er '.[0] | select(.State.Running == true) | .State.Pid | select(type == "number" and . > 1)')
        test -r "/proc/$pid/ns/net"
        dns_type=$(printf '%s' "$metadata" | /usr/bin/jq -er '[.[0].Config.Env[] | select(startswith("DNS_UPSTREAM_RESOLVER_TYPE=")) | ltrimstr("DNS_UPSTREAM_RESOLVER_TYPE=")] | if length == 1 then .[0] else error("ambiguous live DNS type") end')
        configured=$(printf '%s' "$metadata" | /usr/bin/jq -er '[.[0].Config.Env[] | select(startswith("DNS_UPSTREAM_RESOLVERS=")) | ltrimstr("DNS_UPSTREAM_RESOLVERS=")] | if length == 1 then .[0] else error("ambiguous live DNS resolvers") end')
        if test "$dns_type" != dot || test -z "$configured"; then
          echo 'standing=UNKNOWN live provider DNS is not an inspectable DoT profile'
          exit 1
        fi
        IFS=, read -r -a resolvers <<< "$configured"
        healthy=0
        for resolver in "${resolvers[@]}"; do
          case "$resolver" in
            cloudflare) address=1.1.1.1; hostname=cloudflare-dns.com ;;
            google) address=8.8.8.8; hostname=dns.google ;;
            *) echo "standing=UNKNOWN unqualified DoT resolver=$resolver"; exit 1 ;;
          esac
          # dig's exit code alone can be 0 for a TLS certificate failure.
          # A usable A answer is required after CA and hostname validation.
          response=$(/usr/bin/timeout 8 /usr/bin/nsenter --target "$pid" --net /usr/bin/dig +tls +tls-ca +tls-hostname="$hostname" +timeout=3 +tries=1 +short @"$address" example.org A 2>&1) || response=''
          if printf '%s\n' "$response" | /usr/bin/grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "resolver=$resolver standing=TLS_DNS_HEALTHY"
            healthy=$((healthy + 1))
          else
            echo "resolver=$resolver standing=TLS_DNS_UNAVAILABLE_OR_UNKNOWN"
          fi
        done
        if test "$healthy" -eq 0; then
          echo 'standing=VPN_NAMESPACE_DOT_UPSTREAMS_UNAVAILABLE_OR_UNKNOWN'
          exit 1
        elif test "$healthy" -lt "${#resolvers[@]}"; then
          echo 'standing=VPN_NAMESPACE_DOT_UPSTREAM_DEGRADED'
        else
          echo 'standing=VPN_NAMESPACE_DOT_UPSTREAMS_HEALTHY'
        fi
        echo 'scope=provider_current_certificate_validated_DoT_A_not_gluetun_internal_selection_or_iOS_origin'

  provider:gluetun:verify:
    desc: Verify deployed Gluetun SourceCut and real shared-provider HTTPS/DNS paths
    deps: [provider:gluetun:validate]
    cmds:
      - python3 providers/gluetun/native_profile.py --verify
      - task provider:gluetun:dns-dot-upstreams
      - task provider:gluetun:dns-consumer
      - cmp -s providers/gluetun/identity-exclusive.sh /usr/local/libexec/network-v2/provider-identity-exclusive
      - cmp -s providers/gluetun/config/carrier-adapter.json /etc/network-v2/browserless/provider-carrier-gluetun-candidate.json
      - cmp -s providers/gluetun/systemd/network-v2-gluetun-owned.target /etc/systemd/system/network-v2-gluetun-owned.target
      - cmp -s providers/gluetun/systemd/network-v2-gluetun-owned-adapter.service /etc/systemd/system/network-v2-gluetun-owned-adapter.service
      - cmp -s providers/gluetun/quadlet/network-v2-gluetun-owned.container /etc/containers/systemd/network-v2-gluetun-owned.container
      - cmp -s providers/gluetun/quadlet/network-v2-gluetun-owned.network /etc/containers/systemd/network-v2-gluetun-owned.network
      - cmp -s providers/gluetun/systemd/network-v2-gluetun-owned-reconcile.service /etc/systemd/system/network-v2-gluetun-owned-reconcile.service
      - cmp -s providers/gluetun/systemd/network-v2-gluetun-owned-reconcile.timer /etc/systemd/system/network-v2-gluetun-owned-reconcile.timer
      - systemctl is-active --quiet network-v2-gluetun-owned.target
      - systemctl is-active --quiet network-v2-gluetun-owned-reconcile.timer
      - /usr/local/libexec/network-v2/browserless-provider-carrier-ready

  provider:gluetun:observe-exit:
    desc: Optional one-shot IPinfo public egress observation through selected Gluetun proxy; not health or provider selection
    cmds:
      - |
        test -e /etc/network-v2/gluetun/m4-owned-mode.selected
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        receipt=$(curl -q -4 --noproxy '' -fsS           -x http://10.252.246.2:19680           --connect-timeout 6 --max-time 15 -o "$tmp"           -w '%{http_code} %{http_connect}' https://ipinfo.io/json)
        read -r code tunnel extra <<< "$receipt"
        test "$code" = 200 && test "$tunnel" = 200 && test -z "$extra"
        jq -ce '(.ip|type=="string") and (.country|type=="string")' "$tmp" >/dev/null
        jq -c '{kind:"ordivon.network-v2.provider-egress-observation",standing:"OBSERVED_NOT_READINESS",source:"ipinfo.io",ip,country,org}' "$tmp"


  provider:gluetun:eligible-exits:
    desc: Read native Surfshark WireGuard catalog, source-selected countries and excluded inventory without claiming live health
    cmds:
      - |
        set -euo pipefail
        /usr/bin/podman exec network-v2-gluetun-owned-r1 cat /gluetun/servers.json |
          /usr/bin/jq --slurpfile allow providers/gluetun/config/exit-allowlist.json --slurpfile selection providers/gluetun/config/exit-selector.json -er '
            $allow[0] as $policy
            | $selection[0] as $choice
            | (if $choice.selectedCountries == "allAllowed"
                then $policy.allowedCountries else $choice.selectedCountries end) as $pool
            | .surfshark as $provider
            | ($provider.servers | map(select(.vpn == "wireguard"))) as $catalog
            | ($catalog | map(select(.country as $c |
                $policy.excludedCountries | index($c) | not))) as $permitted
            | ($permitted | map(select(
                (.country as $c | $pool | index($c) != null) and
                (.region as $r | (($choice.regions | length) == 0 or
                  ($choice.regions | index($r) != null)))))) as $selected
            | if ($provider.timestamp | type) != "number"
                  or ($permitted | length) == 0
                  or ($selected | length) == 0
                  or (([$permitted[].country] | unique | sort) != ($policy.allowedCountries | sort))
                  or ([$selected[].country] | unique | length) != ($pool | length)
                  or (($pool | map(. as $c | ($policy.allowedCountries | index($c)) == null)) | any)
              then error("native catalog/allowed/candidate set mismatch")
              else
                "standing=CATALOG_ONLY_NOT_HEALTH",
                "catalog_timestamp_utc=\($provider.timestamp | todateiso8601)",
                "catalog_age_days=\(((now-$provider.timestamp)/86400)|floor)",
                "wireguard_allowed_records=\($permitted|length)",
                "wireguard_allowed_ips=\([$permitted[].ips[]]|unique|length)",
                "selected_records=\($selected|length)",
                "selected_ips=\([$selected[].ips[]]|unique|length)",
                "allowed_countries=\([$permitted[].country]|unique|length)",
                "candidate_countries=\($pool|length)",
                ($selected|group_by(.country)[]|"\(.[0].country)\t\(length)")
              end
          '
