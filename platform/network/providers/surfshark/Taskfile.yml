version: '3'

tasks:
  provider:surfshark:validate:
    desc: Validate only the Surfshark provider profile layer
    cmds:
      - sing-box check -c providers/surfshark/config/carrier.json
  provider:surfshark:carrier:
    desc: Prove sing-box can consume one already-existing WireGuard provider namespace without admitting ownership of that provider substrate
    cmds:
      - ./providers/surfshark/acceptance/carrier-smoke.sh

  provider:surfshark:catalog:
    desc: Materialize the pinned Gluetun Surfshark server catalog used as provider endpoint/public-key authority
    cmds:
      - rm -rf /tmp/network-v2-gluetun-servers
      - git init -q /tmp/network-v2-gluetun-servers
      - git -C /tmp/network-v2-gluetun-servers remote add origin {{.GLUETUN_SERVERS_REPO}}
      - git -C /tmp/network-v2-gluetun-servers fetch --quiet --depth 1 origin {{.GLUETUN_SERVERS_REVISION}}
      - git -C /tmp/network-v2-gluetun-servers checkout --quiet --detach FETCH_HEAD
      - test "$(git -C /tmp/network-v2-gluetun-servers rev-parse HEAD)" = "{{.GLUETUN_SERVERS_REVISION}}"
      - test "$(sha256sum /tmp/network-v2-gluetun-servers/{{.GLUETUN_SERVERS_FILE}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"
      - install -d -m 0755 "$(dirname {{.GLUETUN_SERVERS_INSTALL}})"
      - install -m 0644 /tmp/network-v2-gluetun-servers/{{.GLUETUN_SERVERS_FILE}} {{.GLUETUN_SERVERS_INSTALL}}
      - test "$(sha256sum {{.GLUETUN_SERVERS_INSTALL}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"

  provider:surfshark:profiles:
    desc: Convert v2-owned standard Surfshark WireGuard configs into static numeric-endpoint wg-quick profiles using yq and the pinned Gluetun catalog
    deps: [provider:surfshark:catalog]
    cmds:
      - |
        set -eu
        src=/etc/network-v2/providers
        catalog={{.GLUETUN_SERVERS_INSTALL}}
        out="$src/catalog-profiles"
        test -f "$src/kr-seo.conf"
        test -f "$src/th-bkk.conf"
        rm -rf "$out"
        mkdir -p "$out"
        chmod 0700 "$out"
        : >"$out/MANIFEST.tsv"
        chmod 0600 "$out/MANIFEST.tsv"
        for spec in "kr-seo nv2r6a kr" "th-bkk nv2r6b th"; do
          set -- $spec
          node=$1
          iface=$2
          prefix=$3
          host="$node.prod.surfshark.com"
          i=0
          jq -r --arg h "$host" '.servers[] | select(.vpn=="wireguard" and .hostname==$h) | .ips[]' "$catalog" | while IFS= read -r ip; do
            i=$((i + 1))
            dir="$out/$prefix-$i"
            mkdir -p "$dir"
            chmod 0700 "$dir"
            dst="$dir/$iface.conf"
            EP="$ip:51820" yq -p=ini -o=ini 'del(.Interface.DNS) | .Interface.Table="off" | .Interface.MTU="1280" | .Peer.Endpoint=strenv(EP)' "$src/$node.conf" >"$dst"
            chmod 0600 "$dst"
            WG_QUICK_USERSPACE_IMPLEMENTATION=/usr/local/libexec/network-v2/wireguard-go wg-quick strip "$dst" >/dev/null
            digest=$(sha256sum "$dst" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\tsha256:%s\n' "$node" "$ip" "$iface" "$dst" "$digest" >>"$out/MANIFEST.tsv"
          done
        done
        test "$(find "$out" -mindepth 2 -maxdepth 2 -type f -name '*.conf' | wc -l)" -eq 6

  provider:surfshark:verify-local:
    desc: Verify the already-graduated local R6 provider inputs without re-fetching external sources
    deps: [provider:surfshark:validate]
    cmds:
      - /usr/local/libexec/network-v2/wireguard-go --version 2>&1 | grep -F "{{.WIREGUARD_GO_VERSION}}"
      - test "$(sha256sum {{.GLUETUN_SERVERS_INSTALL}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"
      - |
        set -eu
        manifest=/etc/network-v2/providers/catalog-profiles/MANIFEST.tsv
        test -f "$manifest"
        test "$(awk 'NF{c++}END{print c+0}' "$manifest")" -eq 6
        tab=$(printf '\t')
        while IFS="$tab" read -r node endpoint iface profile digest; do
          test -n "$node"; test -n "$endpoint"; test -n "$iface"; test -f "$profile"
          case "$(stat -c %a "$profile")" in 600|400) ;; *) exit 21;; esac
          test "sha256:$(sha256sum "$profile" | awk '{print $1}')" = "$digest"
          WG_QUICK_USERSPACE_IMPLEMENTATION=/usr/local/libexec/network-v2/wireguard-go wg-quick strip "$profile" >/dev/null
          test "$(yq -p=ini -o=json -r '.Peer.Endpoint' "$profile")" = "$endpoint:51820"
          test "$(yq -p=ini -o=json -r '.Interface.Table' "$profile")" = off
          test "$(yq -p=ini -o=json -r '.Interface.MTU' "$profile")" = 1280
          test "$(yq -p=ini -o=json -r '.Interface.DNS // ""' "$profile")" = ''
        done <"$manifest"
