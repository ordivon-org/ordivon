# Native Prometheus scrape definitions for the claude consumer.
scrape_configs:
  - job_name: blackbox-scoped-claude-api
    scrape_interval: 1m
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module:
        - claude_anon_api
    static_configs:
      - targets:
          - https://api.anthropic.com/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
