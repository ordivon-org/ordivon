groups:
  - name: network-v2-vpn-consumer
    rules:
      # An active HTTP listener is not proof of a usable Gluetun VPN.
      # Report only a sampled application failure; missing evidence is a separate alert.
      - alert: NetworkVPNPyPIUnavailable
        expr: probe_success{job="blackbox-vpn-pypi"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Shared VPN proxy cannot complete the PyPI HTTPS consumer
      # A ready package-index carrier does not prove model APIs are reachable.
      - alert: NetworkVPNModelProviderUnavailable
        expr: probe_success{job="blackbox-vpn-model-provider"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scoped production model-provider proxy cannot reach the public API
      # One venue can fail even while PyPI, models and other venues are healthy.
      - alert: NetworkVPNFinancePublicUnavailable
        expr: probe_success{job=~"blackbox-vpn-finance-(okx|binance-usdm)"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scoped Finance public-data API consumer is unavailable
      # DNS NOERROR is not sufficient: Blackbox validates a real A/AAAA
      # answer. Missing observations are UNKNOWN, never DNS failure.
      - alert: NetworkDNSAddressUnavailable
        expr: probe_success{job=~"blackbox-dns-a|blackbox-dns-aaaa"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Local DNS A/AAAA address resolution is unavailable
      # These blackbox targets are HOST-DIRECT UDP/53, not Gluetun VPN DoT/853.
      # Do not use them as evidence to restart the VPN or fail over its carrier.
      # Preserve legacy alertnames for existing external consumers, but label
      # the actual observation plane explicitly to prevent attribution errors.
      # UNKNOWN != FALSE: an absent application probe is a telemetry gap,
      # not evidence that its VPN, DNS or destination actually failed.
      # All jobs below are native single-target source-declared scrape jobs.
      # This alerts on missing evidence without changing physical carrier state.
      - alert: NetworkConsumerEvidenceMissing
        expr: >-
          absent(probe_success{job="blackbox-vpn-pypi"})
          or absent(probe_success{job="blackbox-vpn-model-provider"})
          or absent(probe_success{job="blackbox-vpn-finance-okx"})
          or absent(probe_success{job="blackbox-vpn-finance-binance-usdm"})
          or absent(probe_success{job="blackbox-dns-a"})
          or absent(probe_success{job="blackbox-dns-aaaa"})
          or absent(probe_success{job="blackbox-scoped-codex-mcp"})
          or absent(probe_success{job="blackbox-scoped-codex-access"})
          or absent(probe_success{job="blackbox-scoped-claude-api"})
          or absent(probe_success{job="blackbox-scoped-supply-chain"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Consumer probe evidence is missing; service health UNKNOWN, not failed
      # A failed Cloudflare probe with Google healthy is a degraded *replica*,
      # not an unavailable DNS service. Alert only when both actual upstream
      # observations are fresh and neither can resolve an address.
      - alert: NetworkDNSUpstreamUnavailable
        expr: >-
          (sum(probe_success{job=~"blackbox-dns-upstream-(cloudflare|google)"}) == 0)
          and on()
          (count((time() - timestamp(probe_success{job=~"blackbox-dns-upstream-(cloudflare|google)"})) < 90) == 2)
        for: 2m
        labels:
          severity: warning
          observation_plane: host_direct_udp53
        annotations:
          summary: Both host-direct UDP/53 DNS upstream probes failed; VPN DoT state is unknown
      - alert: NetworkDNSUpstreamDegraded
        expr: >-
          (sum(probe_success{job=~"blackbox-dns-upstream-(cloudflare|google)"}) == 1)
          and on()
          (count((time() - timestamp(probe_success{job=~"blackbox-dns-upstream-(cloudflare|google)"})) < 90) == 2)
        for: 5m
        labels:
          severity: info
          observation_plane: host_direct_udp53
        annotations:
          summary: One host-direct UDP/53 DNS upstream failed; not evidence of VPN DoT failure
      # Missing or stale samples are UNKNOWN, never proof that both endpoints
      # failed or proof that the surviving resolver is healthy.
      - alert: NetworkDNSUpstreamEvidenceMissing
        expr: >-
          (count((time() - timestamp(probe_success{job=~"blackbox-dns-upstream-(cloudflare|google)"})) < 90) or vector(0)) < 2
        for: 2m
        labels:
          severity: warning
          observation_plane: host_direct_udp53
        annotations:
          summary: One or both host-direct UDP/53 DNS observations are missing

      # A measured end-to-end consumer failure is distinct from missing telemetry.
      - alert: NetworkScopedConsumerUnavailable
        expr: probe_success{job=~"blackbox-scoped-(codex-mcp|codex-access|claude-api|supply-chain)"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scoped consumer proxy cannot complete expected origin HTTPS
      # Root-cause triage, not a claim that Gluetun itself failed: three
      # differently scoped end-to-end HTTPS probes failing concurrently is
      # stronger evidence of a shared path incident than any one alone.
      # All three one-minute scrapes must have age <90s; missing scrapes remain UNKNOWN here and are
      # reported separately by NetworkConsumerEvidenceMissing (not an outage).
      - alert: NetworkCorrelatedConsumerOutage
        expr: >-
          (sum(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"}) == 0)
          and (count(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"}) == 3)
          and (count((time() - timestamp(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"})) < 90) == 3)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: PyPI, Codex and Claude independent HTTPS probes are simultaneously failing; inspect shared egress before individual applications
      # Triage the actual failure domain at the consumer boundary. Both
      # host-direct targets must be independently observed: a single origin
      # can fail without losing the physical WAN. All five series require
      # fresh original scrape timestamps; missing evidence is UNKNOWN.
      # This is a *correlated symptom*, not causal proof of the modem or ISP.
      # In particular, a shared outage must never authorize a Gluetun PUT.
      - alert: NetworkSharedUnderlaySuspected
        expr: >-
          (sum(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api|blackbox-http-ipv4|blackbox-http-ipv4-alternate"}) == 0)
          and (count(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api|blackbox-http-ipv4|blackbox-http-ipv4-alternate"}) == 5)
          and (count((time() - timestamp(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api|blackbox-http-ipv4|blackbox-http-ipv4-alternate"})) < 90) == 5)
        for: 2m
        labels:
          severity: warning
          observation_plane: correlated_direct_and_vpn
        annotations:
          summary: Two independent direct origins and three VPN consumers failed together; shared upstream failure suspected, physical cause unknown
      # The inverse only narrows the investigation to a VPN-dependent path.
      # Healthy direct HTTPS does not prove that DNS, the Gluetun endpoint,
      # a scoped proxy, or a destination service is specifically responsible.
      - alert: NetworkVPNPathFailureWithDirectHealthy
        expr: >-
          (sum(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"}) == 0)
          and (count(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"}) == 3)
          and (count((time() - timestamp(probe_success{job=~"blackbox-vpn-pypi|blackbox-scoped-codex-mcp|blackbox-scoped-claude-api"})) < 90) == 3)
          and (sum(probe_success{job=~"blackbox-http-ipv4|blackbox-http-ipv4-alternate"}) == 2)
          and (count(probe_success{job=~"blackbox-http-ipv4|blackbox-http-ipv4-alternate"}) == 2)
          and (count((time() - timestamp(probe_success{job=~"blackbox-http-ipv4|blackbox-http-ipv4-alternate"})) < 90) == 2)
        for: 2m
        labels:
          severity: warning
          observation_plane: direct_healthy_vpn_consumers_failed
        annotations:
          summary: Two direct HTTPS origins succeeded while three VPN consumers failed; investigate the VPN-dependent path without assuming provider cause
      # Prevent certificate-expiry class before the next production TLS outage.
      - alert: NetworkConsumerTLSExpirySoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"blackbox-(vpn|scoped)-.*"} - time()) < 1209600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Consumer origin TLS certificate expires within fourteen days
      # Hard-failure rules miss a carrier that still succeeds but spends
      # most of its ten-second consumer deadline on every request.  Reuse
      # exporter timings; no polling daemon, new labels, or private payloads.
      - alert: NetworkConsumerLatencyHigh
        expr: (probe_duration_seconds{job=~"blackbox-(vpn|scoped)-.*"} > 8) and on(job, instance) (probe_success == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scoped consumer HTTPS probe is nearing its timeout
      # A running proxy process and healthy HTTPS blackbox can hide an
      # enabled but inactive systemd Target. Join only the source-bound three
      # affected consumer pairs; if the Target metric disappears, service-active
      # still detects the split. A deliberately stopped Target also stops its
      # PartOf service, so there is no positive source for this rule.
      - alert: NetworkConsumerTargetDesynchronized
        expr: >-
          label_replace(
            node_systemd_unit_state{job="network-node-systemd",state="active",name=~"network-v2-(model-provider|supply-chain|x-reality)-egress[.]service"} == 1,
            "consumer","$1","name","network-v2-(.*)-egress[.]service"
          )
          unless on(consumer)
          label_replace(
            node_systemd_unit_state{job="network-node-systemd",state="active",name=~"network-v2-(model-provider|supply-chain|x-reality)[.]target"} == 1,
            "consumer","$1","name","network-v2-(.*)[.]target"
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Consumer proxy service is active but its enabled systemd Target is not
      # The detector itself is not a receipt: missing node_exporter samples
      # must not silently make all other Target alerts look green.
      - alert: NetworkSystemdCollectorUnavailable
        expr: (up{job="network-node-systemd"} == 0) or absent(up{job="network-node-systemd"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Native systemd unit-state collector is unavailable; Target readiness is unobserved
