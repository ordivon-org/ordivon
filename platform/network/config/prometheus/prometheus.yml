global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - consumer.rules.yml
scrape_configs:
  - job_name: blackbox-http-ipv4
    scrape_interval: 15s
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module: [http_2xx_ipv4]
    static_configs:
      - targets: [https://example.com/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
  # Real PyPA package-index consumer through the active shared VPN carrier.
  # Probe failure is distinct from a running sing-box process or host egress.
  - job_name: blackbox-vpn-pypi
    scrape_interval: 1m
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module: [http_vpn_2xx_ipv4]
    static_configs:
      - targets: [https://pypi.org/simple/pip-audit/]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
  # Distinct production consumer: scoped model-provider egress with allowlist.
  - job_name: blackbox-vpn-model-provider
    scrape_interval: 1m
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module: [http_model_provider_reachable]
    static_configs:
      - targets: [https://api.deepseek.com/v1/models]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
