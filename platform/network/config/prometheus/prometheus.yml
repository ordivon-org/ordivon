      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
  - job_name: blackbox-vpn-finance-binance-usdm
    scrape_interval: 1m
    scrape_timeout: 12s
    metrics_path: /probe
    params:
