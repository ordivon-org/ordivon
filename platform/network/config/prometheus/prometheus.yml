# Generic Network probes only. Consumer scrape definitions live in native Prometheus fragments.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - consumer.rules.yml
scrape_configs:
  - job_name: blackbox-http-ipv4
    scrape_interval: 15s
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module:
        - http_2xx_ipv4
    static_configs:
      - targets:
          - https://example.com/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
  - job_name: blackbox-http-ipv6
    scrape_interval: 15s
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module:
        - http_2xx_ipv6
    static_configs:
      - targets:
          - https://example.com/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:29115
  - job_name: blackbox-dns-a
