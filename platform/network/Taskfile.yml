version: '3'

tasks:
  core:validate:
    desc: Validate only the generic Network v2 R0 platform, independent of consumer-specific profiles
    cmds:
      - sing-box check -c config/sing-box/direct.json
      - prometheus-blackbox-exporter --config.file=config/blackbox/blackbox.yml --config.check
      - promtool check config config/prometheus/prometheus.yml
      - /usr/bin/systemd-analyze verify systemd/network-v2-r0.target systemd/network-v2-dnsproxy.service systemd/network-v2-singbox.service systemd/network-v2-blackbox.service systemd/network-v2-prometheus.service

  provider:surfshark:validate:
    desc: Validate only the Surfshark provider profile layer
    cmds:
      - sing-box check -c providers/surfshark/config/carrier.json

  consumer:browserless:provider-carrier:validate:
    desc: Validate the one-identity shared provider carrier without changing live state
    cmds:
      - /usr/bin/sing-box check -c consumers/browserless/config/provider-carrier.json
      - /usr/bin/systemd-analyze verify consumers/browserless/systemd/network-v2-browserless-netns.service consumers/browserless/systemd/network-v2-browserless-forward.service consumers/browserless/systemd/network-v2-browserless-wireguard.service consumers/browserless/systemd/network-v2-browserless-dns.service consumers/browserless/systemd/network-v2-browserless-provider-carrier.service consumers/browserless/systemd/network-v2-browserless.target
      - /usr/bin/bash -n consumers/browserless/provider-carrier-ready.sh consumers/browserless/provider-switch.sh consumers/browserless/production-cutover.sh
      - grep -F 'PROVIDER_SITE=${PROVIDER_SITE:-th-bkk}' consumers/browserless/production-cutover.sh >/dev/null

  consumer:finance:validate:
    desc: Validate nine scoped Finance authorities over the shared provider carrier plus explicit direct macro lanes
    cmds:
      - /usr/bin/sing-box check -c consumers/finance/config/egress.json
      - jq -e '.inbounds|length==9' consumers/finance/config/egress.json >/dev/null
      - jq -e 'any(.inbounds[]; .tag=="finance-binance-wallet" and .listen=="127.0.0.1" and .listen_port==19290) and any(.route.rules[]; (.inbound? // [])==["finance-binance-wallet"] and .domain=="api.binance.com" and .port==443 and .action=="route" and .outbound=="provider-carrier")' consumers/finance/config/egress.json >/dev/null
      - jq -e 'any(.route.rules[]; (.inbound? // [])==["finance-us-treasury-public"] and .domain=="home.treasury.gov" and .outbound=="public-direct") and any(.route.rules[]; (.inbound? // [])==["finance-fred-public-csv"] and .domain=="fred.stlouisfed.org" and .outbound=="public-direct")' consumers/finance/config/egress.json >/dev/null
      - jq -e '.outbounds==[{"type":"http","tag":"provider-carrier","server":"10.252.246.2","server_port":19680},{"type":"direct","tag":"public-direct"}] and (has("dns")|not) and (has("services")|not)' consumers/finance/config/egress.json >/dev/null
      - jq -e 'all(.route.rules[]; ((.outbound? // "") != "provider-auto"))' consumers/finance/config/egress.json >/dev/null
      - /usr/bin/systemd-analyze verify consumers/browserless/systemd/network-v2-browserless-provider-carrier.service consumers/finance/systemd/network-v2-finance-egress.service consumers/finance/systemd/network-v2-finance.target
      - /usr/bin/bash -n consumers/finance/ready.sh consumers/finance/acceptance/production-smoke.sh
      - jq -e '.kind=="ordivon.network-v2.scoped-egress-authority" and .directFallback==false and (.proxy|startswith("http://127.0.0.1:"))' consumers/finance/config/*-authority.json >/dev/null
      - '! grep -R -F "provider-auto" consumers/finance/config'

  consumer:supply-chain:validate:
    desc: Validate the scoped OCI authority over the shared provider carrier without changing Docker
    deps: [consumer:browserless:provider-carrier:validate]
    cmds:
      - /usr/bin/sing-box check -c consumers/supply-chain/config/egress.json
      - jq -e '.schemaVersion==1 and .kind=="ordivon.network-v2.supply-chain-egress" and .listen=={"host":"127.0.0.1","port":19581,"protocol":"http"} and .networkAuthority.carrierService=="network-v2-browserless-provider-carrier.service" and .networkAuthority.providerSite=="th-bkk" and .directFallback==false' consumers/supply-chain/config/authority.json >/dev/null
      - jq -e '.inbounds==[{"type":"http","tag":"supply-chain-oci","listen":"127.0.0.1","listen_port":19581}] and .outbounds==[{"type":"http","tag":"provider-carrier","server":"10.252.246.2","server_port":19680}] and .route.rules[-1].action=="reject" and (has("dns")|not) and (has("services")|not)' consumers/supply-chain/config/egress.json >/dev/null
      - /usr/bin/systemd-analyze verify consumers/browserless/systemd/network-v2-browserless-provider-carrier.service consumers/supply-chain/systemd/network-v2-supply-chain-egress.service consumers/supply-chain/systemd/network-v2-supply-chain.target
      - /usr/bin/bash -n consumers/supply-chain/ready.sh consumers/supply-chain/acceptance/docker-rebind-smoke.sh
      - grep -F '127.0.0.1:19581' consumers/supply-chain/systemd/docker.service.d/ordivon-network-v2-supply-chain-proxy.conf >/dev/null
      - '! grep -R -F "10.254.177.2:19381" consumers/supply-chain'
      - '! grep -R -F "provider-auto" consumers/supply-chain/config'

  all:validate:
    desc: Validate core plus optional provider and consumer profiles without changing live state
    deps: [core:validate, provider:surfshark:validate, consumer:browserless:provider-carrier:validate, consumer:finance:validate, consumer:supply-chain:validate]

  core:install:
    desc: Materialize the exact validated R0 source generation into the live host under one systemd composition root
    cmds:
      - task: core:validate
      - install -d -m 0755 /etc/network-v2/sing-box /etc/network-v2/blackbox /etc/network-v2/prometheus
      - install -m 0644 config/sing-box/direct.json /etc/network-v2/sing-box/direct.json
      - install -m 0644 config/blackbox/blackbox.yml /etc/network-v2/blackbox/blackbox.yml
      - install -m 0644 config/prometheus/prometheus.yml /etc/network-v2/prometheus/prometheus.yml
      - install -d -m 0755 /etc/sysctl.d
      - install -m 0644 config/sysctl/90-network-v2-forwarding.conf /etc/sysctl.d/90-network-v2-forwarding.conf
      - /usr/bin/sysctl --system >/dev/null
      - for: { var: R0_SYSTEMD_UNITS }
        cmd: install -m 0644 {{.ITEM}} /etc/systemd/system/{{base .ITEM}}
      - systemctl daemon-reload
      - systemctl disable network-v2-dnsproxy.service network-v2-singbox.service network-v2-blackbox.service network-v2-prometheus.service >/dev/null 2>&1 || true
      - systemctl enable network-v2-r0.target
      - systemctl restart network-v2-r0.target
      - systemctl disable --now network-v2-toxiproxy.service || true

  core:verify:
    desc: Fail closed unless live R0 bytes, systemd composition root, dual-stack data plane, probe plane, and evidence plane match source
    cmds:
      - cmp -s systemd/network-v2-r0.target /etc/systemd/system/network-v2-r0.target
      - cmp -s systemd/network-v2-dnsproxy.service /etc/systemd/system/network-v2-dnsproxy.service
      - cmp -s systemd/network-v2-singbox.service /etc/systemd/system/network-v2-singbox.service
      - cmp -s systemd/network-v2-blackbox.service /etc/systemd/system/network-v2-blackbox.service
      - cmp -s systemd/network-v2-prometheus.service /etc/systemd/system/network-v2-prometheus.service
      - cmp -s systemd/network-v2-toxiproxy.service /etc/systemd/system/network-v2-toxiproxy.service
      - cmp -s config/sing-box/direct.json /etc/network-v2/sing-box/direct.json
      - cmp -s config/blackbox/blackbox.yml /etc/network-v2/blackbox/blackbox.yml
      - cmp -s config/prometheus/prometheus.yml /etc/network-v2/prometheus/prometheus.yml
      - cmp -s config/sysctl/90-network-v2-forwarding.conf /etc/sysctl.d/90-network-v2-forwarding.conf
      - test "$(sysctl -n net.ipv4.ip_forward)" = 1
      - systemctl is-active --quiet network-v2-r0.target
      - systemctl is-enabled --quiet network-v2-r0.target
      - test "$(systemctl is-enabled network-v2-dnsproxy.service 2>/dev/null || true)" = disabled
      - test "$(systemctl is-enabled network-v2-singbox.service 2>/dev/null || true)" = disabled
      - test "$(systemctl is-enabled network-v2-blackbox.service 2>/dev/null || true)" = disabled
      - test "$(systemctl is-enabled network-v2-prometheus.service 2>/dev/null || true)" = disabled
      - systemctl is-active --quiet network-v2-dnsproxy.service
      - systemctl is-active --quiet network-v2-singbox.service
      - systemctl is-active --quiet network-v2-blackbox.service
      - systemctl is-active --quiet network-v2-prometheus.service
      - test -n "$(dig +time=2 +tries=1 @127.0.0.1 -p 25353 example.com A +short)"
      - test -n "$(dig +time=2 +tries=1 @127.0.0.1 -p 25353 example.com AAAA +short)"
      - curl --fail --silent --show-error --proxy http://127.0.0.1:28080 --connect-timeout 5 --max-time 15 -o /dev/null https://example.com/
      - test "$(curl -fsS 'http://127.0.0.1:29115/probe?module=http_2xx_ipv4&target=https://example.com/' | awk '/^probe_success / {print $2}')" = "1"
      - test "$(curl -fsS 'http://127.0.0.1:29115/probe?module=http_2xx_ipv6&target=https://example.com/' | awk '/^probe_success / {print $2}')" = "1"
      - test "$(curl -fsS 'http://127.0.0.1:29115/probe?module=dns_a&target=127.0.0.1:25353' | awk '/^probe_success / {print $2}')" = "1"
      - test "$(curl -fsS 'http://127.0.0.1:29115/probe?module=dns_aaaa&target=127.0.0.1:25353' | awk '/^probe_success / {print $2}')" = "1"
      - test "$(curl -fsS 'http://127.0.0.1:29115/probe?module=tcp_connect&target=127.0.0.1:28080' | awk '/^probe_success / {print $2}')" = "1"
      - ./acceptance/observability/live-prometheus-ready.sh

  core:converge:
    desc: Validate, materialize, and prove one exact live R0 generation
    cmds:
      - task: core:install
      - task: core:verify

  capability:wireguard:materialize:
    desc: Build the pinned official wireguard-go source and install it only inside Network v2 libexec
    cmds:
      - rm -rf /tmp/network-v2-wireguard-go-build
      - git init -q /tmp/network-v2-wireguard-go-build
      - git -C /tmp/network-v2-wireguard-go-build remote add origin {{.WIREGUARD_GO_REPO}}
      - git -C /tmp/network-v2-wireguard-go-build fetch --quiet --depth 1 origin {{.WIREGUARD_GO_REVISION}}
      - git -C /tmp/network-v2-wireguard-go-build checkout --quiet --detach FETCH_HEAD
      - test "$(git -C /tmp/network-v2-wireguard-go-build rev-parse HEAD)" = "{{.WIREGUARD_GO_REVISION}}"
      - make -C /tmp/network-v2-wireguard-go-build
      - install -d -m 0755 /usr/local/libexec/network-v2
      - install -m 0755 /tmp/network-v2-wireguard-go-build/wireguard-go /usr/local/libexec/network-v2/wireguard-go
      - /usr/local/libexec/network-v2/wireguard-go --version 2>&1 | grep -F "{{.WIREGUARD_GO_VERSION}}"

  accept:connectivity:
    cmds:
      - ./acceptance/connectivity/direct-chain.sh

  accept:observability:
    cmds:
      - ./acceptance/observability/blackbox-prometheus.sh

  accept:fault-l4:
    cmds:
      - ./acceptance/fault/l4-toxiproxy.sh

  accept:topology:
    cmds:
      - ./acceptance/topology/netns.sh

  provider:surfshark:carrier:
    desc: Prove sing-box can consume one already-existing WireGuard provider namespace without admitting ownership of that provider substrate
    cmds:
      - ./providers/surfshark/acceptance/carrier-smoke.sh

  capability:wireguard:accept:
    desc: Prove wg-quick + pinned official wireguard-go can create, fail, and recover a v2-owned userspace WireGuard lifecycle
    cmds:
      - task: capability:wireguard:materialize
      - ./capabilities/wireguard/acceptance/userspace-lifecycle.sh

  accept:process-recovery:
    desc: Kill the live R0 sing-box process and prove functional plus observed automatic recovery
    cmds:
      - ./acceptance/lifecycle/process-recovery.sh

  capability:failover:accept:
    desc: Prove HAProxy TCP primary/backup failover across mature sing-box provider/direct carriers without mutating the provider tunnel
    cmds:
      - ./capabilities/failover/acceptance/priority-failover-smoke.sh

  test:r4:
    internal: true
    desc: Prove the external-provider carrier and deterministic mature primary/backup failover/failback mechanism
    deps: [provider:surfshark:validate, provider:surfshark:carrier, capability:failover:accept]

  provider:surfshark:catalog:
    desc: Materialize the pinned Gluetun Surfshark server catalog used as provider endpoint/public-key authority
    cmds:
      - rm -rf /tmp/network-v2-gluetun-servers
      - git init -q /tmp/network-v2-gluetun-servers
      - git -C /tmp/network-v2-gluetun-servers remote add origin {{.GLUETUN_SERVERS_REPO}}
      - git -C /tmp/network-v2-gluetun-servers fetch --quiet --depth 1 origin {{.GLUETUN_SERVERS_REVISION}}
      - git -C /tmp/network-v2-gluetun-servers checkout --quiet --detach FETCH_HEAD
      - test "$(git -C /tmp/network-v2-gluetun-servers rev-parse HEAD)" = "{{.GLUETUN_SERVERS_REVISION}}"
      - test "$(sha256sum /tmp/network-v2-gluetun-servers/{{.GLUETUN_SERVERS_FILE}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"
      - install -d -m 0755 "$(dirname {{.GLUETUN_SERVERS_INSTALL}})"
      - install -m 0644 /tmp/network-v2-gluetun-servers/{{.GLUETUN_SERVERS_FILE}} {{.GLUETUN_SERVERS_INSTALL}}
      - test "$(sha256sum {{.GLUETUN_SERVERS_INSTALL}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"

  provider:surfshark:profiles:
    desc: Convert v2-owned standard Surfshark WireGuard configs into static numeric-endpoint wg-quick profiles using yq and the pinned Gluetun catalog
    deps: [provider:surfshark:catalog]
    cmds:
      - |
        set -eu
        src=/etc/network-v2/providers
        catalog={{.GLUETUN_SERVERS_INSTALL}}
        out="$src/catalog-profiles"
        test -f "$src/kr-seo.conf"
        test -f "$src/th-bkk.conf"
        rm -rf "$out"
        mkdir -p "$out"
        chmod 0700 "$out"
        : >"$out/MANIFEST.tsv"
        chmod 0600 "$out/MANIFEST.tsv"
        for spec in "kr-seo nv2r6a kr" "th-bkk nv2r6b th"; do
          set -- $spec
          node=$1
          iface=$2
          prefix=$3
          host="$node.prod.surfshark.com"
          i=0
          jq -r --arg h "$host" '.servers[] | select(.vpn=="wireguard" and .hostname==$h) | .ips[]' "$catalog" | while IFS= read -r ip; do
            i=$((i + 1))
            dir="$out/$prefix-$i"
            mkdir -p "$dir"
            chmod 0700 "$dir"
            dst="$dir/$iface.conf"
            EP="$ip:51820" yq -p=ini -o=ini 'del(.Interface.DNS) | .Interface.Table="off" | .Interface.MTU="1280" | .Peer.Endpoint=strenv(EP)' "$src/$node.conf" >"$dst"
            chmod 0600 "$dst"
            WG_QUICK_USERSPACE_IMPLEMENTATION=/usr/local/libexec/network-v2/wireguard-go wg-quick strip "$dst" >/dev/null
            digest=$(sha256sum "$dst" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\tsha256:%s\n' "$node" "$ip" "$iface" "$dst" "$digest" >>"$out/MANIFEST.tsv"
          done
        done
        test "$(find "$out" -mindepth 2 -maxdepth 2 -type f -name '*.conf' | wc -l)" -eq 6

  provider:surfshark:verify-local:
    desc: Verify the already-graduated local R6 provider inputs without re-fetching external sources
    deps: [provider:surfshark:validate]
    cmds:
      - /usr/local/libexec/network-v2/wireguard-go --version 2>&1 | grep -F "{{.WIREGUARD_GO_VERSION}}"
      - test "$(sha256sum {{.GLUETUN_SERVERS_INSTALL}} | awk '{print $1}')" = "{{.GLUETUN_SERVERS_SHA256}}"
      - |
        set -eu
        manifest=/etc/network-v2/providers/catalog-profiles/MANIFEST.tsv
        test -f "$manifest"
        test "$(awk 'NF{c++}END{print c+0}' "$manifest")" -eq 6
        tab=$(printf '\t')
        while IFS="$tab" read -r node endpoint iface profile digest; do
          test -n "$node"; test -n "$endpoint"; test -n "$iface"; test -f "$profile"
          case "$(stat -c %a "$profile")" in 600|400) ;; *) exit 21;; esac
          test "sha256:$(sha256sum "$profile" | awk '{print $1}')" = "$digest"
          WG_QUICK_USERSPACE_IMPLEMENTATION=/usr/local/libexec/network-v2/wireguard-go wg-quick strip "$profile" >/dev/null
          test "$(yq -p=ini -o=json -r '.Peer.Endpoint' "$profile")" = "$endpoint:51820"
          test "$(yq -p=ini -o=json -r '.Interface.Table' "$profile")" = off
          test "$(yq -p=ini -o=json -r '.Interface.MTU' "$profile")" = 1280
          test "$(yq -p=ini -o=json -r '.Interface.DNS // ""' "$profile")" = ''
        done <"$manifest"

  consumer:browserless:provider-carrier:materialize:
    desc: Materialize the internal shared carrier bytes without changing the current WireGuard endpoint
    deps: [consumer:browserless:provider-carrier:validate]
    cmds:
      - install -d -m 0755 /etc/network-v2/browserless /usr/local/libexec/network-v2
      - install -m 0644 consumers/browserless/config/provider-carrier.json /etc/network-v2/browserless/provider-carrier.json
      - install -m 0644 consumers/browserless/systemd/network-v2-browserless-provider-carrier.service /etc/systemd/system/network-v2-browserless-provider-carrier.service
      - install -m 0644 consumers/browserless/systemd/network-v2-browserless.target /etc/systemd/system/network-v2-browserless.target
      - install -m 0755 consumers/browserless/provider-carrier-ready.sh /usr/local/libexec/network-v2/browserless-provider-carrier-ready
      - install -m 0755 consumers/browserless/provider-switch.sh /usr/local/libexec/network-v2/browserless-provider-switch
      - systemctl daemon-reload
      - systemctl enable network-v2-browserless.target

  consumer:browserless:provider-carrier:ready:
    desc: Prove the selected one-identity provider carrier across OpenAI, OKX, OCI and Anthropic consequences
    cmds:
      - /usr/local/libexec/network-v2/browserless-provider-carrier-ready

  consumer:browserless:provider-carrier:converge:
    desc: Materialize and restart only the internal carrier over the already-selected Browserless WireGuard session
    cmds:
      - task: consumer:browserless:provider-carrier:materialize
      - systemctl restart network-v2-browserless-provider-carrier.service
      - task: consumer:browserless:provider-carrier:ready

  consumer:browserless:provider-carrier:select:
    desc: Switch the sole shared WireGuard identity to one catalog provider without recreating the Browserless namespace
    deps: [consumer:browserless:provider-carrier:materialize, provider:surfshark:verify-local]
    cmds:
      - /usr/local/libexec/network-v2/browserless-provider-switch th-bkk

  consumer:browserless:provider-carrier:verify:
    desc: Verify exact shared-carrier deployed bytes and live cross-consumer consequence readiness
    cmds:
      - cmp -s consumers/browserless/config/provider-carrier.json /etc/network-v2/browserless/provider-carrier.json
      - cmp -s consumers/browserless/systemd/network-v2-browserless-provider-carrier.service /etc/systemd/system/network-v2-browserless-provider-carrier.service
      - cmp -s consumers/browserless/systemd/network-v2-browserless.target /etc/systemd/system/network-v2-browserless.target
      - cmp -s consumers/browserless/provider-carrier-ready.sh /usr/local/libexec/network-v2/browserless-provider-carrier-ready
      - cmp -s consumers/browserless/provider-switch.sh /usr/local/libexec/network-v2/browserless-provider-switch
      - /usr/local/libexec/network-v2/browserless-provider-carrier-ready

  consumer:finance:materialize:
    desc: Materialize nine Finance authorities over the shared provider carrier without creating another WireGuard session
    deps: [consumer:browserless:provider-carrier:materialize, consumer:finance:validate]
    cmds:
      - install -d -m 0755 /etc/network-v2/finance /usr/local/libexec/network-v2
      - install -m 0644 consumers/finance/config/egress.json /etc/network-v2/finance/egress.json
      - install -m 0644 consumers/finance/config/*-authority.json /etc/network-v2/finance/
      - rm -f /etc/network-v2/finance/provider-endpoints.json
      - for: { var: FINANCE_SYSTEMD_UNITS }
        cmd: install -m 0644 {{.ITEM}} /etc/systemd/system/{{base .ITEM}}
      - install -m 0755 consumers/finance/ready.sh /usr/local/libexec/network-v2/finance-ready
      - systemctl daemon-reload
      - systemctl enable network-v2-finance.target

  consumer:finance:start:
    desc: Start the materialized Finance authorities over the one shared provider carrier
    cmds:
      - systemctl start network-v2-finance.target

  consumer:finance:ready:
    desc: Wait for bounded public read-only consequence readiness through the admitted Finance authorities
    cmds:
      - /usr/local/libexec/network-v2/finance-ready public 90

  consumer:finance:converge:
    desc: Materialize, restart and prove Finance consequences without external financial writes or provider identity mutation
    cmds:
      - task: consumer:finance:materialize
      - systemctl restart network-v2-finance.target
      - task: consumer:finance:ready

  consumer:finance:verify:
    desc: Prove exact authority fencing, shared-carrier fail-closed behavior, direct macro independence and recovery
    cmds:
      - cmp -s consumers/finance/config/egress.json /etc/network-v2/finance/egress.json
      - test ! -e /etc/network-v2/finance/provider-endpoints.json
      - ./consumers/finance/acceptance/production-smoke.sh

  consumer:finance:stop:
    desc: Stop only Finance northbound authorities; do not stop the shared provider carrier
    cmds:
      - systemctl stop network-v2-finance.target

  consumer:supply-chain:materialize:
    desc: Materialize OCI authority and Docker proxy binding over the shared provider carrier without restarting Docker
    deps: [consumer:browserless:provider-carrier:materialize, consumer:supply-chain:validate]
    cmds:
      - install -d -m 0755 /etc/network-v2/supply-chain /etc/systemd/system/docker.service.d /usr/local/libexec/network-v2
      - install -m 0644 consumers/supply-chain/config/authority.json /etc/network-v2/supply-chain/authority.json
      - install -m 0644 consumers/supply-chain/config/egress.json /etc/network-v2/supply-chain/egress.json
      - rm -f /etc/network-v2/supply-chain/provider-endpoints.json
      - install -m 0644 consumers/supply-chain/systemd/network-v2-supply-chain-egress.service /etc/systemd/system/network-v2-supply-chain-egress.service
      - install -m 0644 consumers/supply-chain/systemd/network-v2-supply-chain.target /etc/systemd/system/network-v2-supply-chain.target
      - install -m 0755 consumers/supply-chain/ready.sh /usr/local/libexec/network-v2/supply-chain-ready
      - install -m 0644 consumers/supply-chain/systemd/docker.service.d/ordivon-network-v2-supply-chain-proxy.conf /etc/systemd/system/docker.service.d/ordivon-network-v2-supply-chain-proxy.conf
      - rm -f /etc/systemd/system/docker.service.d/ordivon-preservation-vpn-proxy.conf
      - systemctl daemon-reload
      - systemctl enable network-v2-supply-chain.target

  consumer:supply-chain:start:
    desc: Start only the scoped Supply-Chain proxy; Docker remains untouched
    deps: [consumer:supply-chain:materialize]
    cmds:
      - systemctl start network-v2-supply-chain.target

  consumer:supply-chain:ready:
    desc: Prove admitted OCI registry families and unknown-domain rejection without changing Docker
    cmds:
      - /usr/local/libexec/network-v2/supply-chain-ready

  consumer:supply-chain:converge:
    desc: Converge exact Supply-Chain proxy bytes without restarting Docker
    cmds:
      - task: consumer:supply-chain:materialize
      - systemctl restart network-v2-supply-chain.target
      - task: consumer:supply-chain:ready

  consumer:supply-chain:docker-rebind:
    desc: Rebind Docker from the retired Public-Web proxy, prove container recovery, and replay the pinned OPA pull
    cmds:
      - task: consumer:supply-chain:converge
      - ./consumers/supply-chain/acceptance/docker-rebind-smoke.sh

  consumer:supply-chain:verify:
    desc: Verify deployed bytes, retired proxy absence, live scoped consequence, Docker binding, and pinned OPA availability
    cmds:
      - cmp -s consumers/supply-chain/config/authority.json /etc/network-v2/supply-chain/authority.json
      - cmp -s consumers/supply-chain/config/egress.json /etc/network-v2/supply-chain/egress.json
      - cmp -s consumers/supply-chain/systemd/network-v2-supply-chain-egress.service /etc/systemd/system/network-v2-supply-chain-egress.service
      - cmp -s consumers/supply-chain/systemd/network-v2-supply-chain.target /etc/systemd/system/network-v2-supply-chain.target
      - cmp -s consumers/supply-chain/systemd/docker.service.d/ordivon-network-v2-supply-chain-proxy.conf /etc/systemd/system/docker.service.d/ordivon-network-v2-supply-chain-proxy.conf
      - test ! -e /etc/systemd/system/docker.service.d/ordivon-preservation-vpn-proxy.conf
      - test ! -e /etc/network-v2/supply-chain/provider-endpoints.json
      - systemctl is-enabled --quiet network-v2-supply-chain.target
      - /usr/local/libexec/network-v2/supply-chain-ready
      - |
        docker info 2>/dev/null | grep -F 'HTTP Proxy: http://127.0.0.1:19581' >/dev/null
        docker info 2>/dev/null | grep -F 'HTTPS Proxy: http://127.0.0.1:19581' >/dev/null
      - docker image inspect 'openpolicyagent/opa@sha256:9c5770a0023d56a11224b0514fec2e4e0247357db4392b955c1270fd49cb1f0f' >/dev/null

  consumer:supply-chain:stop:
    desc: Stop the Supply-Chain proxy only; callers must not stop it while Docker remains proxy-bound
    cmds:
      - systemctl stop network-v2-supply-chain.target

  accept:cold-start:
    desc: Stop and cold-start the whole generic R0 target while proving control-plane independence and dual-stack readiness
    cmds:
      - ./acceptance/lifecycle/cold-start.sh

  test:r0:
    internal: true
    deps: [core:validate, accept:connectivity, accept:observability, accept:fault-l4, accept:topology]

  test:r9:
    internal: true
    desc: "Graduate the generic Network v2 platform: isolated dual-stack/long-flow tests, live convergence, cold-start recovery, and process recovery"
    cmds:
      - task: test:r0
      - task: core:converge
      - task: accept:cold-start
      - task: accept:process-recovery
      - task: core:verify

  accept:protocol:
    desc: Prove HTTP/1.1 and HTTP/2 parity, UDP/TCP DNS parity, and observable external egress without treating public throughput or IP stability as generic correctness
    cmds:
      - ./acceptance/protocol/divergence.sh

  accept:full-ip:
    desc: Prove TCP and UDP/QUIC through a sing-box TUN confined to an isolated Linux network namespace
    cmds:
      - ./acceptance/full-ip/tun-quic.sh

  test:r11:
    internal: true
    desc: "Harden generic Network v2 protocol coverage without changing the live host routing model"
    cmds:
      - task: core:verify
      - task: accept:protocol
      - task: accept:full-ip
      - task: core:verify

  accept:family-fallback:
    desc: Prove bidirectional address-family fallback under deterministic local single-family failure
    cmds:
      - ./acceptance/connectivity/family-fallback.sh

  accept:dns-resilience:
    desc: Prove partial-upstream survival, all-upstream fail-closed semantics, cache expiry, and recovery without dnsproxy restart
    cmds:
      - ./acceptance/dns/upstream-resilience.sh

  test:r12:
    internal: true
    desc: "Harden generic Network v2 resilience without changing live R0 configuration"
    cmds:
      - task: core:verify
      - task: accept:family-fallback
      - task: accept:dns-resilience
      - task: core:verify

  accept:source:
    desc: Run generic isolated acceptance without converging or mutating live R0
    deps: [core:validate, accept:connectivity, accept:observability, accept:fault-l4, accept:topology]

  accept:live:
    desc: Revalidate the current live R0 across lifecycle, protocol, full-IP, and resilience capabilities
    cmds:
      - task: core:verify
      - task: accept:cold-start
      - task: accept:process-recovery
      - task: accept:protocol
      - task: accept:full-ip
      - task: accept:family-fallback
      - task: accept:dns-resilience
      - task: core:verify

  accept:local:
    desc: Full local WSL graduation; refresh current capability evidence only after every acceptance gate passes
    cmds:
      - task: accept:source
      - task: core:converge
      - task: accept:live
      - python3 scripts/capability-report.py write-local

  evidence:verify-local:
    desc: Fail if the checked-in local capability report no longer matches the generic source or current platform fingerprint
    cmds:
      - python3 scripts/capability-report.py verify-local

  evidence:refresh-local:
    desc: Re-run full local graduation and regenerate the current capability report
    cmds:
      - task: accept:local
      - task: evidence:verify-local

  reference:linux:preflight:
    desc: Require a non-WSL Linux runner with netem, Docker, containerlab, and kernel WireGuard
    cmds:
      - ./reference/linux/preflight.sh

  reference:linux:netem:
    desc: Prove deterministic packet loss plus delay/reorder on the reference Linux kernel
    cmds:
      - ./reference/linux/netem-smoke.sh

  reference:linux:containerlab:
    desc: Prove a real two-node Linux containerlab data topology
    cmds:
      - ./reference/linux/containerlab-smoke.sh

  reference:linux:wireguard-kernel:
    desc: Prove kernel-WireGuard creation, failure, and recovery
    cmds:
      - ./reference/linux/wireguard-kernel-smoke.sh

  reference:linux:wireguard-userspace:
    desc: Prove the pinned wireguard-go implementation directly as userspace TUN/UAPI, including failure and recovery
    cmds:
      - ./reference/linux/wireguard-userspace-smoke.sh

  reference:linux:wireguard-differential:
    desc: Prove kernel WireGuard and pinned wireguard-go as distinct implementations on one standard-Linux runner
    cmds:
      - task: capability:wireguard:materialize
      - task: reference:linux:wireguard-kernel
      - task: reference:linux:wireguard-userspace

  reference:linux:accept:
    desc: Close the external-fidelity gates on an explicitly provisioned standard-Linux reference runner
    cmds:
      - task: reference:linux:preflight
      - task: reference:linux:netem
      - task: reference:linux:containerlab
      - task: reference:linux:wireguard-differential

  consumer:browserless:validate:
    desc: Validate the serialized Browserless migration gate without changing production
    deps: [provider:surfshark:validate, consumer:browserless:provider-carrier:validate]
    cmds:
      - /usr/bin/bash -n consumers/browserless/acceptance/serial-browserless.sh
      - test -x consumers/browserless/acceptance/serial-browserless.sh

  consumer:browserless:serial-accept:
    desc: Serialize the shared provider identity, prove real Browserless over Network v2, then restore legacy production
    deps: [consumer:browserless:validate, provider:surfshark:verify-local]
    cmds:
      - ./consumers/browserless/acceptance/serial-browserless.sh


  consumer:chat-ingress:validate:
    desc: Validate the scoped ChatIngress proxy over the existing Browserless Network v2 authority
    cmds:
      - jq -e '.schemaVersion==1 and .kind=="ordivon.network-v2.chat-ingress-egress" and .listen.host=="127.0.0.1" and .listen.port==19081 and .networkAuthority.namespace=="nv2-browserless-prod" and .networkAuthority.serviceUnit=="network-v2-browserless.target" and .directFallback==false' consumers/chat-ingress/config/egress.json >/dev/null
      - /usr/bin/sing-box check -c consumers/chat-ingress/config/sing-box.json
      - /usr/bin/systemd-analyze verify consumers/chat-ingress/systemd/network-v2-chat-ingress-proxy.service consumers/chat-ingress/systemd/network-v2-chat-ingress-relay.service consumers/chat-ingress/systemd/network-v2-chat-ingress.target
      - /usr/bin/bash -n consumers/chat-ingress/ready.sh

  consumer:chat-ingress:materialize:
    desc: Materialize ChatIngress source into /etc without changing host routing or starting the target
    deps: [consumer:chat-ingress:validate]
    cmds:
      - install -d -m 0755 /etc/network-v2/chat-ingress
      - install -m 0644 consumers/chat-ingress/config/egress.json /etc/network-v2/chat-ingress/egress.json
      - install -m 0644 consumers/chat-ingress/config/sing-box.json /etc/network-v2/chat-ingress/sing-box.json
      - install -m 0644 consumers/chat-ingress/systemd/network-v2-chat-ingress-proxy.service /etc/systemd/system/network-v2-chat-ingress-proxy.service
      - install -m 0644 consumers/chat-ingress/systemd/network-v2-chat-ingress-relay.service /etc/systemd/system/network-v2-chat-ingress-relay.service
      - install -m 0644 consumers/chat-ingress/systemd/network-v2-chat-ingress.target /etc/systemd/system/network-v2-chat-ingress.target
      - install -m 0755 consumers/chat-ingress/ready.sh /usr/local/libexec/network-v2/chat-ingress-ready
      - systemctl daemon-reload
      - systemctl enable network-v2-chat-ingress.target

  consumer:chat-ingress:start:
    desc: Start the scoped ChatIngress proxy
    deps: [consumer:chat-ingress:materialize]
    cmds:
      - systemctl start network-v2-chat-ingress.target

  consumer:chat-ingress:ready:
    desc: Prove ChatIngress loopback relay and provider reachability without provider SEND
    cmds:
      - /usr/local/libexec/network-v2/chat-ingress-ready

  consumer:chat-ingress:stop:
    desc: Stop the scoped ChatIngress proxy without touching the shared Browserless Network v2 authority
    cmds:
      - systemctl stop network-v2-chat-ingress.target

  consumer:claude:validate:
    desc: Validate the Claude Code Anthropic-only HTTPS authority plus isolated client namespace
    cmds:
      - /usr/bin/sing-box check -c consumers/claude/config/sing-box.json
      - /usr/bin/systemd-analyze verify consumers/claude/systemd/network-v2-claude-proxy.service consumers/claude/systemd/network-v2-claude-relay.service consumers/claude/systemd/network-v2-claude.target consumers/claude/systemd/network-v2-claude-client-netns.service consumers/claude/systemd/network-v2-claude-client-bridge.service consumers/claude/systemd/network-v2-claude-client.target
      - /usr/bin/bash -n consumers/claude/ready.sh
      - jq -e '.schemaVersion==1 and .kind=="ordivon.network-v2.claude-egress" and .listen=={"host":"127.0.0.1","port":19481,"protocol":"http"} and .networkAuthority.namespace=="nv2-browserless-prod" and .networkAuthority.serviceUnit=="network-v2-browserless.target" and .directFallback==false' consumers/claude/config/authority.json >/dev/null
      - |
        set -eu
        declared=$(jq -cS '.allowedHttpsDomains|sort' consumers/claude/config/authority.json)
        enforced=$(jq -cS '.route.rules[] | select(.action=="route") | .domain|sort' consumers/claude/config/sing-box.json)
        test "$declared" = "$enforced"
        jq -e '.route.rules[-1].action=="reject" and (.route.rules[] | select(.action=="route") | .port)==[443] and (.route.rules[] | select(.action=="route") | .network)==["tcp"]' consumers/claude/config/sing-box.json >/dev/null

  consumer:claude:materialize:
    desc: Materialize the Claude scoped egress and no-direct-route client namespace without restarting the shared Browserless VPN carrier
    deps: [consumer:claude:validate]
    cmds:
      - install -d -m 0755 /etc/network-v2/claude
      - install -m 0644 consumers/claude/config/authority.json /etc/network-v2/claude/authority.json
      - install -m 0644 consumers/claude/config/sing-box.json /etc/network-v2/claude/sing-box.json
      - install -m 0644 consumers/claude/systemd/network-v2-claude-proxy.service /etc/systemd/system/network-v2-claude-proxy.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-relay.service /etc/systemd/system/network-v2-claude-relay.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude.target /etc/systemd/system/network-v2-claude.target
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client-netns.service /etc/systemd/system/network-v2-claude-client-netns.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client-bridge.service /etc/systemd/system/network-v2-claude-client-bridge.service
      - install -m 0644 consumers/claude/systemd/network-v2-claude-client.target /etc/systemd/system/network-v2-claude-client.target
      - install -m 0755 consumers/claude/ready.sh /usr/local/libexec/network-v2/claude-ready
      - systemctl daemon-reload
      - systemctl enable network-v2-claude.target network-v2-claude-client.target

  consumer:claude:start:
    desc: Start the isolated Claude client path without changing host default routing
    deps: [consumer:claude:materialize]
    cmds:
      - systemctl start network-v2-claude-client.target

  consumer:claude:ready:
    desc: Prove no direct client route, admitted Anthropic HTTPS, unknown-domain rejection and no IPv6 escape
    cmds:
      - /usr/local/libexec/network-v2/claude-ready

  consumer:claude:converge:
    desc: Materialize, restart only Claude-owned network units and prove fail-closed readiness
    cmds:
      - task: consumer:claude:materialize
      - systemctl restart network-v2-claude.target
      - systemctl restart network-v2-claude-client.target
      - task: consumer:claude:ready

  consumer:claude:verify:
    desc: Verify exact deployed Claude authority/client bytes and live consequence readiness
    cmds:
      - cmp -s consumers/claude/config/authority.json /etc/network-v2/claude/authority.json
      - cmp -s consumers/claude/config/sing-box.json /etc/network-v2/claude/sing-box.json
      - cmp -s consumers/claude/systemd/network-v2-claude-proxy.service /etc/systemd/system/network-v2-claude-proxy.service
      - cmp -s consumers/claude/systemd/network-v2-claude-relay.service /etc/systemd/system/network-v2-claude-relay.service
      - cmp -s consumers/claude/systemd/network-v2-claude.target /etc/systemd/system/network-v2-claude.target
      - cmp -s consumers/claude/systemd/network-v2-claude-client-netns.service /etc/systemd/system/network-v2-claude-client-netns.service
      - cmp -s consumers/claude/systemd/network-v2-claude-client-bridge.service /etc/systemd/system/network-v2-claude-client-bridge.service
      - cmp -s consumers/claude/systemd/network-v2-claude-client.target /etc/systemd/system/network-v2-claude-client.target
      - systemctl is-enabled --quiet network-v2-claude.target
      - systemctl is-enabled --quiet network-v2-claude-client.target
      - /usr/local/libexec/network-v2/claude-ready

  consumer:claude:stop:
    desc: Stop only Claude-owned network units; the shared Browserless VPN carrier remains untouched
    cmds:
      - systemctl stop network-v2-claude-client.target network-v2-claude.target

vars:
  SYSTEMD_UNITS:
    sh: printf '%s ' systemd/network-v2-*.service
  R0_SYSTEMD_UNITS:
    sh: printf '%s ' systemd/network-v2-r0.target systemd/network-v2-dnsproxy.service systemd/network-v2-singbox.service systemd/network-v2-blackbox.service systemd/network-v2-prometheus.service
  FINANCE_SYSTEMD_UNITS:
    sh: printf '%s ' consumers/finance/systemd/network-v2-finance-egress.service consumers/finance/systemd/network-v2-finance.target
  WIREGUARD_GO_REPO:
    sh: awk -F= '$1=="repository"{print $2}' capabilities/wireguard/external/wireguard-go.lock
  WIREGUARD_GO_REVISION:
    sh: awk -F= '$1=="revision"{print $2}' capabilities/wireguard/external/wireguard-go.lock
  WIREGUARD_GO_VERSION:
    sh: awk -F= '$1=="version"{print $2}' capabilities/wireguard/external/wireguard-go.lock
  GLUETUN_SERVERS_REPO:
    sh: awk -F= '$1=="repository"{print $2}' providers/surfshark/external/gluetun-servers.lock
  GLUETUN_SERVERS_REVISION:
    sh: awk -F= '$1=="revision"{print $2}' providers/surfshark/external/gluetun-servers.lock
  GLUETUN_SERVERS_FILE:
    sh: awk -F= '$1=="file"{print $2}' providers/surfshark/external/gluetun-servers.lock
  GLUETUN_SERVERS_SHA256:
    sh: awk -F= '$1=="sha256"{print $2}' providers/surfshark/external/gluetun-servers.lock
  GLUETUN_SERVERS_INSTALL:
    sh: awk -F= '$1=="install"{print $2}' providers/surfshark/external/gluetun-servers.lock
