[tools]
shellcheck = "0.11.0"
python = "3.14.7"
uv = "0.12.16"

[tasks.ci]
run = """
set -euo pipefail
test -n "$(git ls-files -- '*.sh' | head -1)"
git ls-files -z -- '*.sh' | xargs -0 shellcheck
# Real, owner-native Python test collection, excluding explicit effectful
# systemd sandbox acceptance (those tests remain skipped unless opted in).
PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.14.7 --with pytest==9.1.1 \
  python -m pytest -q -p no:cacheprovider tests
"""
