[tools]
shellcheck = "0.11.0"
python = "3.15.0"
uv = "0.13.1"

[tasks.ci]
run = """
set -euo pipefail
test -n "$(git ls-files -- '*.sh' | head -1)"
git ls-files -z -- '*.sh' | xargs -0 shellcheck
PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.0 --with pytest==9.1.1 \
  python -m pytest -q -p no:cacheprovider tests
"""
