[tools]
shellcheck = "0.11.0"
python = "3.15.1"
uv = "0.13.5"

[tasks.ci]
depends = ["formal", "formal-dns", "formal-control-plane", "formal-core-convergence", "formal-shared-egress-alias"]
run = """
set -euo pipefail
test -n "$(git ls-files -- '*.sh' | head -1)"
git ls-files -z -- '*.sh' | xargs -0 shellcheck
PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with pytest==9.1.1 \
  python -m pytest -q -p no:cacheprovider tests
"""


# Explicit fail-closed semantic consumer probe; unlike optional local CI discovery,
# this task cannot pass when the native sing-box executable is unavailable.
[tasks.behavior]
run = '''
set -euo pipefail
command -v sing-box >/dev/null || { echo 'sing-box is required for network behavior verification' >&2; exit 2; }
PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with pytest==9.1.1   python -m pytest -q -p no:cacheprovider tests/test_egress_routing_behavior.py
'''

# Opt-in installed SourceCut: rerun the SAME native sing-box independent
# upstream spy against installed bytes, requiring exact source/install equality.
# No production proxy, VPN or endpoint restart occurs.
[tasks.behavior-installed]
run = '''
set -euo pipefail
command -v sing-box >/dev/null || { echo 'sing-box is required' >&2; exit 2; }
ORDIVON_NETWORK_POLICY_SOURCE=installed PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with pytest==9.1.1 python -m pytest -q -p no:cacheprovider tests/test_egress_routing_behavior.py
'''

# Opt-in live consumer-effect witness. Requires local tcpdump/netns access.
# No packet files, VPN mutations, Docker restarts or credential exposure.
[tasks.behavior-live]
run = 'python acceptance/egress/live-carrier-witness.py'

# Z3 proof over source-declared TCP HTTP CONNECT authorities and actual
# first-match sing-box source routing. Complements native consumer verification.
[tasks.formal]
description = "Prove 8 scoped HTTP/mixed-TCP policies and reject rogue-origin/direct-escape mutations with Z3"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with z3-solver==5.3.3.0 python formal/egress_policy_refinement.py"


# Source-bound systemd/Quadlet control-plane separation; complements native
# installed-unit and consumer verification, never claims physical isolation.
[tasks.formal-control-plane]
description = "Prove Runtime/Host/Gateway have no source-graph dependency path to Network v2"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with z3-solver==5.3.3.0 python formal/control_plane_independence.py"

# Independent DNS TTL/failover state-machine proof, source-admitted against
# dnsproxy native Unit and the real fault-injection acceptance fixture.
[tasks.formal-dns]
description = "Prove upstream DNS TTL, outage and recovery in Z3 state abstraction"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with z3-solver==5.3.3.0 python formal/dns_cache_state.py"


[tasks.formal-core-convergence]
description = "Source-bound Z3 proof: external network outage cannot trigger core reinstallation"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 --with z3-solver==5.3.3.0 python formal/core_convergence_refinement.py"


[tasks.formal-shared-egress-alias]
description = "Finite graph/source refinement proof of legacy Browserless target versus Shared Egress alias for four consumers"
run = "PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.15.1 python formal/shared_egress_alias_refinement.py"
