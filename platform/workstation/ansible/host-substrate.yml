---
- name: Workstation Linux host and WSL distribution desired state
  hosts: operations_local
  become: true
  gather_facts: false
  vars:
    workstation_wsl_distro_settings:
      - { section: boot, option: systemd, value: "true" }
      - { section: user, option: default, value: root }
      - { section: network, option: generateResolvConf, value: "true" }
      - { section: interop, option: enabled, value: "true" }
      - { section: interop, option: appendWindowsPath, value: "false" }
    workstation_disabled_system_units:
      - systemd-homed.service
      - systemd-homed-activate.service
  tasks:
    - name: Ensure system manager drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure user manager drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/user.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure coredump drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Own system manager file-descriptor limit desired state
      ansible.builtin.copy:
        src: ../host/system.conf.d-20-ordivon-agent-limits.conf
        dest: /etc/systemd/system.conf.d/20-ordivon-agent-limits.conf
        owner: root
        group: root
        mode: "0644"

    - name: Own user manager file-descriptor limit desired state
      ansible.builtin.copy:
        src: ../host/user.conf.d-20-ordivon-agent-limits.conf
        dest: /etc/systemd/user.conf.d/20-ordivon-agent-limits.conf
        owner: root
        group: root
        mode: "0644"

    - name: Own coredump suppression desired state
      ansible.builtin.copy:
        src: ../host/coredump.conf.d-20-ordivon-agent-node.conf
        dest: /etc/systemd/coredump.conf.d/20-ordivon-agent-node.conf
        owner: root
        group: root
        mode: "0644"

    - name: Keep unneeded systemd-homed units disabled on this non-homed node
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ workstation_disabled_system_units }}"

    - name: Converge WSL distribution settings without replacing unrelated sections
      community.general.ini_file:
        path: /etc/wsl.conf
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        create: false
        no_extra_spaces: true
        modify_inactive_option: false
      loop: "{{ workstation_wsl_distro_settings }}"

    - name: Record that WSL activation is an explicit external restart boundary
      ansible.builtin.debug:
        msg: >-
          Linux /etc/wsl.conf keys are converged only. Windows-user global WSL settings
          are outside this playbook. Activation and WSL restart are separate effects.
