---
- name: Workstation v2 Windows Jev fast-path provider management surface
  hosts: operations_local
  become: true
  gather_facts: false
  tasks:
    - name: Create Workstation v2 libexec directory
      ansible.builtin.file:
        path: /usr/local/libexec/ordivon/workstation-v2
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Windows Jev provider implementation
      ansible.builtin.copy:
        src: ../workstation/windows/jev_fastpath_provider.py
        dest: /usr/local/libexec/ordivon/workstation-v2/jev_fastpath_provider.py
        owner: root
        group: root
        mode: "0755"

    - name: Install Windows Jev provider contract
      ansible.builtin.copy:
        src: ../workstation/windows/jev-fastpath-provider.toml
        dest: /usr/local/libexec/ordivon/workstation-v2/jev-fastpath-provider.toml
        owner: root
        group: root
        mode: "0644"

    - name: Install Jev consumer secret materializer wrapper
      ansible.builtin.copy:
        src: ../workstation/windows/materialize_jev_consumer_secrets.py
        dest: /usr/local/libexec/ordivon/workstation-v2/materialize_jev_consumer_secrets.py
        owner: root
        group: root
        mode: "0700"

    - name: Install Jev Windows DPAPI materializer
      ansible.builtin.copy:
        src: ../workstation/windows/materialize-jev-consumer-secrets.ps1
        dest: /usr/local/libexec/ordivon/workstation-v2/materialize-jev-consumer-secrets.ps1
        owner: root
        group: root
        mode: "0600"

    - name: Install stable Windows Jev provider launcher
      ansible.builtin.copy:
        dest: /root/tools/bin/workstation-windows-jev-provider
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          exec /usr/bin/python3 /usr/local/libexec/ordivon/workstation-v2/jev_fastpath_provider.py "$@"
