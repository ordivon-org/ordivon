apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: operations-prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://127.0.0.1:29091
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true

  - name: Loki
    uid: operations-loki
    type: loki
    access: proxy
    orgId: 1
    url: http://127.0.0.1:3100
    isDefault: false
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000

  - name: Tempo
    uid: operations-tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://127.0.0.1:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
