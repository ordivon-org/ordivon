global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: operations-v2-prometheus
    static_configs:
      - targets: ["127.0.0.1:29091"]
        labels:
          ordivon_owner: operations-v2
          ordivon_scope: shared-observability

  - job_name: operations-v2-node
    static_configs:
      - targets: ["127.0.0.1:29100"]
        labels:
          ordivon_owner: operations-v2
          ordivon_scope: generic-node-facts
  - job_name: operations-v2-cloudflared-production
    static_configs:
      - targets: ["127.0.0.1:20243"]
        labels:
          ordivon_owner: operations-v2
          ordivon_scope: cloudflare-connector-metrics
          connector_profile: A
      - targets: ["127.0.0.1:20244"]
        labels:
          ordivon_owner: operations-v2
          ordivon_scope: cloudflare-connector-metrics
          connector_profile: B
