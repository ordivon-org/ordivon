[Unit]
Wants=loki.service
After=loki.service

[Service]
# Packaged ExecStartPre performs live sink healthchecks and can create a boot-time
# dependency loop when Loki is still inside its readiness window. Keep static
# configuration validation, but let Vector's durable disk buffer absorb a
# temporarily unavailable downstream.
ExecStartPre=
ExecStartPre=/usr/bin/vector validate --no-environment
ExecStart=
ExecStart=/usr/bin/vector --require-healthy false
