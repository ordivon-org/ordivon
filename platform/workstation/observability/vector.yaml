data_dir: /var/lib/vector

sources:
  journald:
    type: journald
    current_boot_only: true
    since_now: true
    batch_size: 32

sinks:
  loki:
    type: loki
    inputs: [journald]
    endpoint: http://127.0.0.1:3100
    labels:
      ordivon_owner: operations-v2
      source: journald
    encoding:
      codec: json
    healthcheck:
      enabled: true
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
