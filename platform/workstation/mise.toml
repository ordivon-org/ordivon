[tools]
python = "3.14.7"
uv = "0.12.16"
node = "26.9.0"
pnpm = "10.33.2"
shellcheck = "0.11.0"

[tasks.ci]
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run python -m pytest --ignore=tests/test_workstation_consequences.py
(
  cd providers/cloudflare
  pnpm install --frozen-lockfile
  pnpm run ci
)
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""

[tasks.verify]
depends = ["ci"]
run = """
set -euo pipefail
uv run python -m pytest -q tests/test_workstation_consequences.py
"""
