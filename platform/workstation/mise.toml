[tools]
powershell = "7.6.8"
python = "3.15.1"
uv = "latest"
node = "26.12.1"
pnpm = "12.16.1"
shellcheck = "0.11.0"

[tasks.ci]
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run python -m pytest --ignore=tests/test_workstation_consequences.py
(
  cd providers/cloudflare
  pnpm install --frozen-lockfile
  pnpm run ci
)
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""

[tasks.verify]
depends = ["ci"]
run = """
set -euo pipefail
uv run python -m pytest -q tests/test_workstation_consequences.py
"""

[tasks."codex:materialize"]
run = """
set -euo pipefail
source_dir=workstation/nix/codex-cli
version=$(node -p 'require("./workstation/nix/codex-cli/package.json").dependencies["@openai/codex"]')
prefix_root=${ORDIVON_CODEX_PREFIX_ROOT:-/root/tools/share}
prefix="$prefix_root/codex-pnpm-$version"
mkdir -p "$prefix"
cp "$source_dir/package.json" "$source_dir/pnpm-lock.yaml" "$source_dir/pnpm-workspace.yaml" "$prefix/"
(cd "$prefix" && pnpm install --frozen-lockfile --ignore-scripts)
actual=$(node "$prefix/node_modules/@openai/codex/bin/codex.js" --version)
test "$actual" = "codex-cli $version" || {
  echo "Codex consumer identity mismatch: $actual != codex-cli $version" >&2
  exit 1
}
printf 'codex_pnpm_consumer_ready=%s\n' "$prefix"
"""

# Explicit platform qualification: ordinary CI is intentionally portable.
[tasks."backup:native-verify"]
run = """
set -euo pipefail
unset PYTEST_ADDOPTS PYTEST_PLUGINS
export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
export ORDIVON_TEST_NATIVE_BACKUP_CHAIN=1
export ORDIVON_TEST_NATIVE_BACKUP_RETENTION=1
report_args=()
if [[ -n "${ORDIVON_NATIVE_BACKUP_JUNIT:-}" ]]; then
  if [[ -e "$ORDIVON_NATIVE_BACKUP_JUNIT" || -L "$ORDIVON_NATIVE_BACKUP_JUNIT" ]]; then
    echo "BACKUP_QUALIFICATION_REPORT_EXISTS" >&2
    exit 2
  fi
  report_args+=(--junitxml="$ORDIVON_NATIVE_BACKUP_JUNIT")
fi
uv run --locked python -m pytest -o addopts= -p workstation.backup_test_qualification "${report_args[@]}" \
  tests/test_pgbackrest_native_recovery_contract.py \
  tests/test_pgbackrest_native_retention_contract.py
"""
