[tools]
powershell = "7.6.7"
python = "3.15.1"
uv = "0.13.5"
node = "26.12.1"
pnpm = "12.15.0"
shellcheck = "0.11.0"

[tasks.ci]
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run python -m pytest --ignore=tests/test_workstation_consequences.py
(
  cd providers/cloudflare
  pnpm install --frozen-lockfile
  pnpm run ci
)
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""

[tasks.verify]
depends = ["ci"]
run = """
set -euo pipefail
uv run python -m pytest -q tests/test_workstation_consequences.py
"""
