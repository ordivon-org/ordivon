# enable-template
# Single-node green Temporal cluster for local productionization acceptance.
# Old dogfood/dev cluster remains on 127.0.0.1:7233 until explicit cutover.
log:
  stdout: true
  level: info

persistence:
  numHistoryShards: 4
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal"
        connectAddr: "127.0.0.1:55434"
        connectProtocol: "tcp"
        user: "temporal"
        password: {{ env "TEMPORAL_POSTGRES_PASSWORD" | quote }}
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"
    visibility:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal_visibility"
        connectAddr: "127.0.0.1:55434"
        connectProtocol: "tcp"
        user: "temporal"
        password: {{ env "TEMPORAL_POSTGRES_PASSWORD" | quote }}
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  pprof:
    port: 17936
  metrics:
    prometheus:
      framework: "tally"
      timerType: "histogram"
      listenAddress: "127.0.0.1:29092"

services:
  frontend:
    rpc:
      grpcPort: 17233
      membershipPort: 16933
      bindOnIP: "127.0.0.1"
      httpPort: 17243
  history:
    rpc:
      grpcPort: 17234
      membershipPort: 16934
      bindOnIP: "127.0.0.1"
  matching:
    rpc:
      grpcPort: 17235
      membershipPort: 16935
      bindOnIP: "127.0.0.1"
  worker:
    rpc:
      grpcPort: 17239
      membershipPort: 16939
      bindOnIP: "127.0.0.1"

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "127.0.0.1:17233"

dcRedirectionPolicy:
  policy: "noop"
