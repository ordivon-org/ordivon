[tasks.verify]
run = """
set -euo pipefail
python3 -m unittest discover -s tests -p 'test_*.py' -v
mise run test:properties
python3 scripts/inspect_federation.py --verify-local >/dev/null
# Real Research consumer acceptance, including source corruption counterexamples.
python3 -m unittest discover -s ../../studies/experimental-episodes/experiments/evidence-consumer-pilot-r1 -p 'test_*.py' -v
"""

[tasks."test:properties"]
# The required lane owns selection and plugin identity. Local ad-hoc pytest
# remains available for focused development; caller options cannot narrow this task.
run = """
env -u PYTEST_ADDOPTS -u PYTEST_PLUGINS -u PYTEST_DISABLE_PLUGIN_AUTOLOAD uv run --no-project --with pytest --with hypothesis python -m pytest --disable-plugin-autoload -p hypothesispytest -o addopts= -v --hypothesis-show-statistics ../../studies/data-lifecycle/tests tests/properties
"""

[tasks."verify:formal"]
run = """
set -euo pipefail
# Use the pinned shared Ordivon formal toolchain; no second Lean installation.
(cd ../../tools/formal && mise exec -- lean ../../packages/data/formal/DataProduct.lean)
(cd ../../tools/formal && mise exec -- lean ../../packages/data/formal/DataPublication.lean)
(cd ../../tools/formal && mise exec -- lean ../../packages/data/formal/DataMultiVersion.lean)
# Symbolic Python implementation check; bounded search is not a kernel proof.
# Float the auxiliary verifier; the shared Lean kernel remains pinned.
uvx --from crosshair-tool crosshair check src/ordivon_data/verification.py --analysis_kind PEP316 --per_condition_timeout 12 --per_path_timeout 3
"""
