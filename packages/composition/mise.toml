[tools]
python = "3.15.1"
uv = "0.13.5"

[tasks.verify]
run = """
set -euo pipefail
# Native mise selects the version; uv must not infer an older interpreter
# from a previously materialized Workspace .venv.
export UV_PYTHON="$(mise which python)"
uv lock --check
uv sync --locked
uv run ruff check src tests
uv run ruff format --check src tests
uv run python -m pytest -q
mise run formal:verify
"""

# Composition owns the model; Runtime exposes only pinned upstream TLA+ tools.
[tasks."formal:verify"]
description = "Check all four LEGO 2.1 Owner boundary modes with pinned upstream TLC"
run = """
set -euo pipefail
runtime_root="$(realpath ../../services/runtime)"
cached_jar="$(python3 - "$runtime_root" <<'PY_RUNTIME_JAR'
import json
import pathlib
import sys
root = pathlib.Path(sys.argv[1])
lock = json.loads((root / "formal/toolchain.lock.json").read_text(encoding="utf-8"))
print((root / lock["cacheRelativePath"]).resolve())
PY_RUNTIME_JAR
)"
if ! printenv ORDIVON_TLA_TOOLS_JAR >/dev/null; then
  if [[ ! -f "$cached_jar" ]]; then
    "$runtime_root/scripts/tla-formal" bootstrap
  fi
  export ORDIVON_TLA_TOOLS_JAR="$cached_jar"
fi
"$runtime_root/scripts/tla-formal" verify
(
  cd formal
  java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tla2sany.SANY Lego21OwnerBoundary.tla
  for cfg in Lego21OwnerBoundary.cfg Lego21OwnerBoundary.direct-local.cfg Lego21OwnerBoundary.direct-egress.cfg Lego21OwnerBoundary.harness-local.cfg; do
    java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config "$cfg" Lego21OwnerBoundary.tla
  done
  # Non-vacuity: require a reachable post-admission Network degradation.
  # This intentionally false invariant must be falsified by native TLC.
  probe_output="$(mktemp)"
  trap 'rm -f "$probe_output"' EXIT
  if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.readiness-probe.cfg Lego21OwnerBoundary.tla >"$probe_output" 2>&1; then
    echo "TLC freshness non-vacuity probe unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant NetworkNeverDegradesAfterAdmission is violated." "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC did not confirm the expected reachable readiness change" >&2
    exit 1
  fi
  echo "TLC post-admission Network degradation non-vacuity: PASS"
  # Fail closed if the model no longer exposes the rejected foreign-witness
  # state: a vacuous safety PASS would otherwise hide a missing adversarial path.
  if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.foreign-evidence-probe.cfg Lego21OwnerBoundary.tla >"$probe_output" 2>&1; then
    echo "TLC foreign consumer evidence non-vacuity probe unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant ForeignEvidenceIsUnreachable is violated." "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC did not confirm foreign consumer evidence is reachable" >&2
    exit 1
  fi
  echo "TLC foreign consumer evidence non-vacuity: PASS"
  if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.sourcecut-probe.cfg Lego21OwnerBoundary.tla >"$probe_output" 2>&1; then
    echo "TLC wrong-source evidence non-vacuity probe unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant WrongSourceEvidenceIsUnreachable is violated." "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC did not expose wrong-source evidence" >&2
    exit 1
  fi
  echo "TLC wrong-source evidence non-vacuity: PASS"
  # Distinguish a terminal state from a durable, committed Runtime receipt.
  # An actual matching Consumer witness can arrive before that commit; the
  # Host safety invariant must block acceptance in this reachable state.
  if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.receipt-probe.cfg Lego21OwnerBoundary.tla >"$probe_output" 2>&1; then
    echo "TLC pending terminal receipt non-vacuity probe unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant PendingMatchedTerminalReceiptIsUnreachable is violated." "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC did not confirm pending receipt with matching consumer is reachable" >&2
    exit 1
  fi
  if ! grep -Fq 'terminalReceipt = "pending"' "$probe_output" || ! grep -Fq 'consumerEvidence = "matching"' "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC pending-receipt witness did not contain matching consumer and pending receipt" >&2
    exit 1
  fi
  if ! grep -Fq 'sourceEvidenceBinding = "admission-bound"' "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC pending-receipt witness did not bind the admission SourceCut" >&2
    exit 1
  fi
  echo "TLC pending terminal receipt non-vacuity: PASS"
  # Separate a committed receipt from a foreign Attempt's presented receipt.
  # Require the model to reach foreign receipt + matching Work/SourceCut,
  # then let the existing committed-receipt invariant guard Host acceptance.
  if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.foreign-receipt-probe.cfg Lego21OwnerBoundary.tla >"$probe_output" 2>&1; then
    echo "TLC foreign terminal receipt reachability probe unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant ForeignTerminalReceiptIsUnreachable is violated." "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC did not confirm the reachable foreign terminal receipt" >&2
    exit 1
  fi
  if ! grep -Fq 'terminalReceipt = "foreign"' "$probe_output" ||
     ! grep -Fq 'consumerEvidence = "matching"' "$probe_output" ||
     ! grep -Fq 'sourceEvidenceBinding = "admission-bound"' "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC foreign-receipt witness lacks matching Work, SourceCut or receipt" >&2
    exit 1
  fi
  echo "TLC foreign terminal receipt non-vacuity: PASS"
  # Deliberately relax exactly one Host guard in an ephemeral model copy.
  # The checked counterexample must identify the committed-receipt invariant
  # and the foreign receipt, not merely a parser failure or another invariant.
  red_dir="$(mktemp -d)"
  trap 'rm -f "$probe_output"; rm -rf "$red_dir"' EXIT
  cp Lego21OwnerBoundary.tla Lego21OwnerBoundary.direct-local.cfg "$red_dir/"
  python3 - "$red_dir/Lego21OwnerBoundary.tla" <<'PY_FOREIGN_RECEIPT_RED'
import pathlib
import sys
path = pathlib.Path(sys.argv[1])
source = path.read_text(encoding="utf-8")
old = '    /' + chr(92) + ' terminalReceipt = "committed"'
new = '    /' + chr(92) + ' terminalReceipt ' + chr(92) + 'in {"committed", "foreign"}'
if source.count(old) != 1:
    raise SystemExit("Host receipt mutation target missing or ambiguous")
path.write_text(source.replace(old, new, 1), encoding="utf-8")
PY_FOREIGN_RECEIPT_RED
  if (
    cd "$red_dir"
    java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config Lego21OwnerBoundary.direct-local.cfg Lego21OwnerBoundary.tla
  ) >"$probe_output" 2>&1; then
    echo "TLC Host receipt guard mutation unexpectedly passed" >&2
    exit 1
  fi
  if ! grep -Fq "Error: Invariant NoHostAcceptanceWithoutCommittedTerminalReceipt is violated." "$probe_output" ||
     ! grep -Fq 'terminalReceipt = "foreign"' "$probe_output"; then
    cat "$probe_output" >&2
    echo "TLC guard mutation did not produce a named foreign-receipt counterexample" >&2
    exit 1
  fi
  echo "TLC foreign receipt Host-guard mutation negative control: PASS"
  rm -rf "$red_dir"
  rm -f "$probe_output"
  trap - EXIT
)
"""
