[tools]
python = "3.15.1"
uv = "0.13.5"

[tasks.verify]
run = """
set -euo pipefail
# Native mise selects the version; uv must not infer an older interpreter
# from a previously materialized Workspace .venv.
export UV_PYTHON="$(mise which python)"
uv lock --check
uv sync --locked
uv run ruff check src tests
uv run ruff format --check src tests
uv run python -m pytest -q
mise run formal:verify
"""

# Composition owns the model; Runtime exposes only pinned upstream TLA+ tools.
[tasks."formal:verify"]
description = "Check all four LEGO 2.1 Owner boundary modes with pinned upstream TLC"
run = """
set -euo pipefail
runtime_root="$(realpath ../../services/runtime)"
cached_jar="$(python3 - "$runtime_root" <<'PY_RUNTIME_JAR'
import json
import pathlib
import sys
root = pathlib.Path(sys.argv[1])
lock = json.loads((root / "formal/toolchain.lock.json").read_text(encoding="utf-8"))
print((root / lock["cacheRelativePath"]).resolve())
PY_RUNTIME_JAR
)"
if ! printenv ORDIVON_TLA_TOOLS_JAR >/dev/null; then
  if [[ ! -f "$cached_jar" ]]; then
    "$runtime_root/scripts/tla-formal" bootstrap
  fi
  export ORDIVON_TLA_TOOLS_JAR="$cached_jar"
fi
"$runtime_root/scripts/tla-formal" verify
(
  cd formal
  java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tla2sany.SANY Lego21OwnerBoundary.tla
  for cfg in Lego21OwnerBoundary.cfg Lego21OwnerBoundary.direct-local.cfg Lego21OwnerBoundary.direct-egress.cfg Lego21OwnerBoundary.harness-local.cfg; do
    java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config "$cfg" Lego21OwnerBoundary.tla
  done
)
"""
