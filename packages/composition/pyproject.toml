[project]
name = "ordivon-composition"
version = "0.1.0"
description = "Task-local non-authoritative composition contracts and mechanical evaluators for Ordivon."
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[project.scripts]
ordivon-circuit = "ordivon_composition.cognitive_circuit_r1:main"
ordivon-interface-contract = "ordivon_composition.interface_contract_r2:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
