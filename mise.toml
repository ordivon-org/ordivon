# Host owns the model; repo root composes Runtime-owned pinned TLC toolchain.
[tasks."host:formal:attention-reentry"]
description = "TLC: coherent re-entry, exact cursor receipts and negative controls"
run = """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel)"
jar="${ORDIVON_TLA_TOOLS_JAR:-$repo_root/services/runtime/target/formal-tools/tla2tools-v1.7.4.jar}"
if [[ "$jar" != /* || ! -f "$jar" || -L "$jar" ]]; then
  echo "Host Attention TLC requires the existing pinned absolute TLA+ JAR" >&2
  exit 2
fi
expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$repo_root/services/runtime/formal/toolchain.lock.json")"
observed="$(sha256sum -- "$jar" | cut -d' ' -f1)"
test "$observed" = "$expected" || { echo "Host Attention TLA+ toolchain digest mismatch" >&2; exit 2; }
scratch="$(mktemp -d)"
trap 'rm -rf "$scratch"' EXIT
cp "$repo_root/services/host/formal/"HostAttentionReentryR1.* "$scratch/"
cp "$repo_root/services/host/formal/"HostCursorReceiptR1.* "$scratch/"
cd "$scratch"
for model in HostAttentionReentryR1 HostCursorReceiptR1; do
  java -cp "$jar" tla2sany.SANY "$model.tla" >/dev/null
  positive="$(java -Xmx512m -cp "$jar" tlc2.TLC -workers 1 -config "$model.cfg" "$model.tla")"
  printf '%s\\n' "$positive" | grep -F 'Model checking completed. No error has been found.'
  printf '%s\\n' "$positive" | grep -F 'distinct states found'
done
for case in 'HostAttentionReentryR1:unsafe:ReturnedCursorFromSameCut' 'HostAttentionReentryR1:unsafe-page:NoSkippedEligiblePageEvent' 'HostCursorReceiptR1:unsafe-predecessor:ReceiptChain' 'HostCursorReceiptR1:unsafe-replay:ReplayExact'; do
  IFS=: read -r model variant invariant <<< "$case"
  set +e
  negative="$(java -Xmx512m -cp "$jar" tlc2.TLC -workers 1 -config "$model.$variant.cfg" "$model.tla" 2>&1)"
  status=$?
  set -e
  if [[ "$status" -ne 12 ]]; then
    printf '%s\\n' "$negative" | tail -30
    exit 1
  fi
  printf '%s\\n' "$negative" | grep -Fx "Error: Invariant $invariant is violated."
done
"""

# Source-scoped response protocol proof. Reuses the pinned Runtime TLC JAR;
# no separate toolchain or unconditional gate on machines without it.
[tasks."web:formal:effect-response"]
run = """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel)"
jar="${ORDIVON_TLA_TOOLS_JAR:-$repo_root/services/runtime/target/formal-tools/tla2tools-v1.7.4.jar}"
if [[ "$jar" != /* || ! -f "$jar" || -L "$jar" ]]; then
  echo "Web effect response TLC requires the existing pinned absolute TLA+ JAR" >&2
  exit 2
fi
expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$repo_root/services/runtime/formal/toolchain.lock.json")"
observed="$(sha256sum -- "$jar" | cut -d' ' -f1)"
test "$observed" = "$expected" || { echo "TLA+ toolchain digest mismatch" >&2; exit 2; }
cd "$repo_root/apps/web/formal"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
java -cp "$jar" tla2sany.SANY AgentEffectResponseR1.tla
java -cp "$jar" tlc2.TLC -workers 1 -metadir "$tmp/safe" -config AgentEffectResponseR1.cfg AgentEffectResponseR1.tla > "$tmp/safe.log"
grep -F 'Model checking completed. No error has been found.' "$tmp/safe.log"
grep -F 'distinct states found' "$tmp/safe.log"
for pair in legacy-revoke:NoStaleApproval legacy-replay:ExactCommitWins legacy-ambiguity:NoAmbiguousCommit reach-step-up:NeverStepUp reach-replay:NeverReplay; do
  name="${pair%:*}"
  invariant="${pair#*:}"
  set +e
  java -cp "$jar" tlc2.TLC -workers 1 -metadir "$tmp/$name" -config "AgentEffectResponseR1.$name.cfg" AgentEffectResponseR1.tla > "$tmp/$name.log" 2>&1
  status=$?
  set -e
  test "$status" = 12 || { cat "$tmp/$name.log"; exit 1; }
  grep -F "Invariant $invariant is violated" "$tmp/$name.log"
done
java -cp "$jar" tla2sany.SANY EffectApprovalRecordR1.tla
java -cp "$jar" tlc2.TLC -workers 1 -metadir "$tmp/approval-safe" -config EffectApprovalRecordR1.cfg EffectApprovalRecordR1.tla > "$tmp/approval-safe.log"
grep -F 'Model checking completed. No error has been found.' "$tmp/approval-safe.log"
grep -F 'distinct states found' "$tmp/approval-safe.log"
for pair in legacy-terminal:TerminalConsumed legacy-binding:BindingImmutable legacy-pending:NoPendingAfterCommit reach-commit:NeverCommitted reach-renew:NeverRenewed; do
  name="${pair%:*}"
  invariant="${pair#*:}"
  set +e
  java -cp "$jar" tlc2.TLC -workers 1 -metadir "$tmp/approval-$name" -config "EffectApprovalRecordR1.$name.cfg" EffectApprovalRecordR1.tla > "$tmp/approval-$name.log" 2>&1
  status=$?
  set -e
  test "$status" = 12 || { cat "$tmp/approval-$name.log"; exit 1; }
  grep -F "Invariant $invariant is violated" "$tmp/approval-$name.log"
done
"""
