monorepo_root = true

[monorepo]
config_roots = [
  "meta/next",
  "services/runtime",
  "services/host",
  "services/harness",
  "platform/skills",
  "platform/security",
  "platform/workstation",
  "platform/network",
  "capabilities/artifact",
  "capabilities/distribution",
  "capabilities/media",
  "domains/game",
  "domains/capital",
]
lockfile = false

[tools]
python = "3.14.7"
uv = "0.12.16"
actionlint = "1.7.12"

[tasks."repo:retirement:verify"]
run = """
set -euo pipefail
python3 tools/repo/check_archived_source_boundary.py \
  --policy docs/migration/retirement/workstation-lab-policy.json
tools/repo/test-check-archived-source-boundary.sh
"""

[tasks."repo:ci"]
run = """
set -euo pipefail
python3 tools/repo/test_affected_owners.py
uv run --with pyyaml==6.0.3 python tools/repo/check_github_governance.py
actionlint .github/workflows/*.yml
git diff --check
"""

[tasks."next:verify"]
run = """
set -euo pipefail
cd meta/next
mise install
mise run verify
"""

[tasks."runtime:verify"]
run = """
set -euo pipefail
cd services/runtime
