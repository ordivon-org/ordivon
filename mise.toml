monorepo_root = true

[monorepo]
config_roots = [
  "platform/security",
]
lockfile = false

[tasks."next:verify"]
dir = "meta/next"
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run --locked python -m pytest
uv run --locked --group authority python scripts/check_authority_catalog_r1.py
uv run --locked --group authority python scripts/check_standard_native_enterprise_r2.py
uv run --locked --group reasoning python scripts/check_reasoning_waist_r1.py
"""


[tasks."security:verify"]
dir = "platform/security"
run = """
set -euo pipefail
uv sync --frozen --python 3.14.7
uv run --frozen --python 3.14.7 ruff check .
uv run --frozen --python 3.14.7 python -m unittest discover -s tests -v
"""


[tasks."network:verify"]
dir = "platform/network"
run = "task all:validate"


[tasks."host:verify"]
dir = "services/host"
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run python -m pytest
"""


[tasks."harness:verify"]
dir = "services/harness"
run = """
set -euo pipefail
test -x /bin/bash
test -x /usr/bin/awk
test -x /usr/bin/rg
uv sync --locked
uv run python scripts/check_runtime_search_profile.py
uv lock --check
uv run python -m compileall -q src tests scripts evals
uvx ruff==0.15.17 check src tests scripts
uv run python -W error::ResourceWarning -m pytest -q tests
uv run python scripts/check_dependencies.py
uv run python scripts/check_docs.py
uv run python scripts/check_evidence.py
uv run python scripts/demo_deterministic_run.py
tmp=$(mktemp -d -t ordivon-harness-wheel-XXXXXX)
trap 'rm -rf "$tmp"' EXIT
uv build --wheel --out-dir "$tmp"
wheel=$(find "$tmp" -maxdepth 1 -type f -name '*.whl' -print -quit)
test -n "$wheel"
uv run python scripts/check_wheel.py "$wheel"
"""


[tasks."workstation:verify"]
dir = "platform/workstation"
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run python -m pytest
(
  cd providers/cloudflare
  pnpm install --frozen-lockfile
  pnpm run ci
)
"""
