monorepo_root = true

[task_config]
cascade = true
shell = "bash -c"

[monorepo]
config_roots = [
  "meta/next",
  "studies/experimental-episode/postgres-projection-r1",
  "packages/composition",
  "services/runtime",
  "services/host",
  "services/harness",
  "extensions/chatgpt-skills-mcp",
  "platform/security",
  "platform/workstation",
  "platform/network",
  "capabilities/artifact",
  "capabilities/distribution",
  "capabilities/media",
  "domains/game",
  "domains/capital",
  "apps/agent",
  "apps/web",
]
lockfile = false

[tools]
python = "3.14.7"
uv = "0.12.16"
actionlint = "1.7.12"
gitleaks = "8.30.1"

[tasks."repo:secrets:verify"]
run = """
set -euo pipefail
gitleaks git --no-banner --redact=100 --timeout 120 .
if [[ "${GITHUB_ACTIONS:-}" == "true" ]]; then
  echo "GitHub Actions scans durable Git candidate/history only; workspace build artifacts are out of scope."
else
  gitleaks dir --no-banner --redact=100 --timeout 120 .
fi
"""

[tasks."repo:retirement:verify"]
run = """
set -euo pipefail
for policy in docs/migration/retirement/*-policy.json; do
  python3 tools/repo/check_archived_source_boundary.py --policy "$policy"
done
tools/repo/test-check-archived-source-boundary.sh
"""

[tasks."repo:ci"]
run = """
set -euo pipefail
python3 tools/repo/test_affected_owners.py
python3 tools/repo/test_convergence_plan.py
python3 tools/repo/test_owner_boundaries.py
python3 tools/repo/check_owner_boundaries.py
python3 tools/repo/check_composition_architecture.py
python3 tools/repo/check_structure_r2.py
python3 tools/repo/check_architecture_docs.py
uv run --with pytest==9.1.1 python -m pytest -q tools/repo/test_composition_architecture.py tools/repo/test_structure_r2.py tools/repo/test_architecture_docs.py
uv run --with pytest==9.1.1 python -m pytest -q tests/catalogs/test_authority_catalog.py tests/skills/test_web_provider_routing.py tests/extensions/test_materialize_agent_plugin.py
mise run experimental-episode-store:verify
mise run research-study:verify
tools/repo/migration/test-integrate-main.sh
uv run --with pyyaml==6.0.3 python tools/repo/check_github_governance.py
actionlint .github/workflows/*.yml
git diff --check
"""

[tasks."repo:integration:test"]
run = """
set -euo pipefail
tools/repo/migration/test-integrate-main.sh
"""

[tasks."repo:primary:verify"]
run = """
set -euo pipefail
tools/repo/migration/check-primary-main.sh /root/projects/ordivon
"""

[tasks."next:verify"]
run = """
set -euo pipefail
cd meta/next
mise install
mise run verify
"""

[tasks."experimental-episode-store:verify"]
run = """
set -euo pipefail
cd studies/experimental-episode/postgres-projection-r1
mise install
mise run verify
"""

[tasks."research-study:verify"]
run = """
set -euo pipefail
base=studies/research/scholarly-intelligence-r1/scripts
uv run --with ruff==0.16.8 ruff check studies/research/scholarly-intelligence-r1/scripts
uv run --with 'jsonschema>=4.26,<5' python "$base/check_scholarly_intelligence_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_scholarly_live_profiles_r3.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_scholarly_pressure_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_scholarly_data_plane_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_aries_semantic_content_core_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_aries_response_revision_annotation_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_aries_response_revision_gold_gate_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_aries_review_response_core_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_review_lifecycle_schema_r3.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_context24_asset_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_context24_evidence_content_core_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_claim_evidence_schema_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_claim_evidence_schema_r2.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_claim_permission_context24_pressure_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_claim_permission_maturity_pressure_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_peersum_asset_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_review_lifecycle_schema_r1.py"
uv run --with 'jsonschema>=4.26,<5' python "$base/check_review_lifecycle_schema_r2.py"
"""

[tasks."composition:verify"]
run = """
set -euo pipefail
cd packages/composition
mise install
mise run verify
"""

[tasks."control-plugin:verify"]
run = """
set -euo pipefail
uv run --with pytest==9.1.1 python -m pytest -q tests/extensions/test_materialize_agent_plugin.py
python3 - <<'PY'
import json
from pathlib import Path
root = Path('extensions/ordivon-control-plane')
names = {p.name for p in root.iterdir()}
assert names == {'plugin.json', 'mcp.json'}, names
plugin = json.loads((root / 'plugin.json').read_text())
mcp = json.loads((root / 'mcp.json').read_text())
assert plugin['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json'
assert plugin['name'] == 'ordivon-control-plane'
assert mcp['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json'
assert set(mcp['mcpServers']) == {'ordivon-gateway'}
server = mcp['mcpServers']['ordivon-gateway']
assert server == {'type': 'streamable-http', 'url': 'https://gateway-mcp.ordivon.com/mcp'}
PY
"""

