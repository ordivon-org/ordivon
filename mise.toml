[tasks."gateway:verify"]
dir = "services/gateway"
run = """
set -euo pipefail
uv lock --check
uv sync --locked
uv run ruff check .
uv run ruff format --check .
uv run python -m pytest -q
"""


[tasks."web:verify"]
run = """
set -euo pipefail
cd apps/web
mise install
mise run verify
"""

[tasks."preservation:verify"]
run = """
set -euo pipefail
uv run --with pyyaml==6.0.3 python capabilities/preservation/scripts/verify_source.py
"""
