[project]
name = "ordivon-capital"
version = "0.1.0"
description = "Standards-first Ordivon Capital composition across Markets, Trading, Portfolio, Risk, Research, Governance, and Accounting"
requires-python = "==3.14.7"
dependencies = [
    "websockets==17.1",
]

[dependency-groups]
research = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pyarrow==25.0.1",
]
test = [
    { include-group = "research" },
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "UP"]
