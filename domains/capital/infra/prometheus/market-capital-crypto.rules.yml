groups:
  - name: market-capital-crypto-safety
    interval: 15s
    rules:
      - alert: MarketCapitalCryptoPublicStreamingQualificationLost
        expr: ordivon_market_capital_crypto_public_stream_r2_qualified != 1
        for: 2m
        labels:
          severity: warning
          ordivon_owner: market-capital
          ordivon_scope: public-data
        annotations:
          summary: Market Capital crypto public streaming qualification is not healthy
          description: R2 repeated persistent public-stream qualification is not currently asserted by the canonical Market Capital evidence projection.

      - alert: MarketCapitalCryptoExternalFinancialWriteObserved
        expr: ordivon_market_capital_crypto_external_financial_writes_attempted > 0
        for: 0m
        labels:
          severity: critical
          ordivon_owner: market-capital
          ordivon_scope: safety
        annotations:
          summary: Unexpected Market Capital external financial write attempt observed
          description: Current Market Capital qualification is required to remain public-only/non-live; any external financial write attempt requires immediate investigation.

      - alert: MarketCapitalCryptoClockGateExceeded
        expr: ordivon_market_capital_crypto_clock_offset_abs_ms > 1000
        for: 5m
        labels:
          severity: warning
          ordivon_owner: market-capital
          ordivon_scope: clock-quality
        annotations:
          summary: Market Capital host clock exceeds private-execution gate
          description: Absolute observed host clock offset exceeds the frozen 1000 ms private-execution limit. Private/demo/live execution must remain blocked.
