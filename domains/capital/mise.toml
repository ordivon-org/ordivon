[tools]
python = "3.15.1"
uv = "0.13.5"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[tasks.verify]
run = """
set -euo pipefail
uv lock --check
uv sync --locked --group test
uv run --group test ruff check .
# Reuse the existing pinned upstream Z3 owner under tools/formal.
# Install it only when the native pinned binary is absent.
if ! (cd ../../tools/formal && mise which z3 >/dev/null 2>&1); then
  (cd ../../tools/formal && mise install github:Z3Prover/z3)
fi
mise run verify:formal
uv run --group test python -m pytest -m "not provider_qualification"
"""

[tasks."verify:formal"]
description = "Prove Paper Accounting cash, payable, receivable and NAV equations with pinned upstream Z3"
run = "python3 -I scripts/verify-paper-cash-formal.py"

[tasks."verify:provider"]
description = "Run node-local external-provider and credential-bound qualification tests"
run = """
set -euo pipefail
uv lock --check
uv sync --locked --group test
uv run --group test python -m pytest -m provider_qualification
"""
