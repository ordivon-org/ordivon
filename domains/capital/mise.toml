[tools]
python = "3.15.1"
uv = "0.13.5"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[tasks.verify]
run = """
set -euo pipefail
mise run verify:formal:risk-exposure
mise run verify:formal:passive-general
mise run verify:formal:unit-r-margin
mise run verify:formal:algebraic-capital
uv lock --check
uv sync --locked --group test
uv run --group test ruff check .
uv run --group test python -m pytest -m "not provider_qualification"
mise run formal:paper
"""

[tasks."formal:paper"]
description = "Prove Paper cash/settlement Presburger invariants using pinned upstream Z3 PyPI wheel"
run = """
set -euo pipefail
# Reuse the existing pinned uv tool rather than the older GitHub mise
# backend, which cannot resolve this upstream Z3 Release tag.
uvx --python 3.15 --from z3-solver==5.3.3.0 python - <<'PYZ3'
from pathlib import Path

import z3

raw = Path("formal/paper_cash_settlement_r1.smt2").read_bytes()
observed = z3.z3core.Z3_eval_smtlib2_string(z3.main_ctx().ref(), raw).splitlines()
expected = ["unsat", "unsat", "unsat", "sat", "sat"]
if observed != expected:
    raise SystemExit(f"Paper formal proof mismatch: {observed!r} != {expected!r}")
print("paper_cash_settlement_r1: 3 universal QF_LIA checks UNSAT; 2 wrong-model witnesses SAT")
PYZ3
"""

[tasks."verify:formal:unit-r-margin"]
description = "Z3 static real-valued margin headroom identity and counterexample (not broker refinement)"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/UnitRMarginBoundR1.smt2)"
expected="$(printf 'unsat\\nunsat\\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Unexpected Z3 margin proof result: %s\\n' "$observed" >&2
  exit 1
fi
printf '%s\\n' "$observed"
"""

[tasks."verify:formal:algebraic-capital"]
description = "Prove 1r algebraic self-financing, unitization, Merton derivative and unbounded-ruin case (not Python or broker refinement)"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/AlgebraicCapitalR1.smt2)"
expected="$(printf 'unsat\\nunsat\\nunsat\\nunsat\\nunsat\\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Unexpected Z3 algebraic capital proof result: %s\\n' "$observed" >&2
  exit 1
fi
printf '%s\\n' "$observed"
"""

[tasks."verify:provider"]
description = "Run node-local external-provider and credential-bound qualification tests"
run = """
set -euo pipefail
uv lock --check
uv sync --locked --group test
uv run --group test python -m pytest -m provider_qualification
"""

[tasks."verify:formal:risk-exposure"]
description = "Lean kernel proof of all-position Risk exposure bounds and composition"
run = """
set -euo pipefail
cd ../../tools/formal
mise exec -- lean ../../domains/capital/formal/RiskExposureBound.lean
"""

[tasks."verify:paper-amounts"]
description = "Check the Paper Accounting receipt amount model with pinned Lean"
run = '''
set -eu
model="$PWD/formal/PaperCloseAmounts.lean"
lean="$(mise -C ../../tools/formal which lean)"
"$lean" "$model"
'''

[tasks."verify:formal:contribution"]
description = "Check the three-asset Portfolio allocation model with existing pinned Z3"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/PortfolioContributionR1.smt2)"
expected="$(printf 'unsat\nunsat\nunsat\nunsat\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Formal check did not return its precise UNSAT/SAT obligations: %s\n' "$observed" >&2
  exit 1
fi
printf '%s\n' "$observed"
"""

[tasks."verify:formal:apportionment"]
description = "Lean kernel proof of all-asset Portfolio quotient/remainder conservation"
run = """
set -euo pipefail
cd ../../tools/formal
mise exec -- lean ../../domains/capital/formal/PortfolioApportionmentGeneral.lean
"""

[tasks."verify:formal:passive-benchmark"]
description = "Native Z3 proof of Portfolio cashflow-matched benchmark transitions"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/PortfolioPassiveBenchmarkR1.smt2)"
expected="$(printf 'unsat\nunsat\nunsat\nunsat\nunsat\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Unexpected model result (unknown/timeout/SAT obligation is not verified): %s\n' "$observed" >&2
  exit 1
fi
printf '%s\n' "$observed"
"""

[tasks."verify:formal:passive-general"]
description = "Lean arbitrary-finite-period passive benchmark algebra and conditional admission"
run = """
set -euo pipefail
cd ../../tools/formal
mise exec -- lean ../../domains/capital/formal/PortfolioPassiveBenchmarkGeneral.lean
"""
