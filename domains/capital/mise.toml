[tools]
python = "3.15.1"
uv = "0.13.5"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[tasks.verify]
run = """
set -euo pipefail
mise run verify:formal:risk-exposure
mise run verify:formal:passive-general
mise run verify:formal:unit-r-margin
mise run verify:formal:unit-r-rebalance
mise run verify:formal:algebraic-capital
mise run verify:formal:multistage-one-r
mise run verify:formal:broker-liquidation
uv lock --check
uv sync --locked --group test
uv run --group test ruff check .
uv run --group test python -m pytest -m "not provider_qualification"
mise run formal:paper
mise run formal:paper:source
"""

[tasks."formal:paper"]
description = "Prove Paper cash/settlement Presburger invariants using pinned upstream Z3 PyPI wheel"
run = """
set -euo pipefail
# Reuse the existing pinned uv tool rather than the older GitHub mise
# backend, which cannot resolve this upstream Z3 Release tag.
uvx --python 3.15 --from z3-solver==5.3.3.0 python - <<'PYZ3'
from pathlib import Path

import z3

raw = Path("formal/paper_cash_settlement_r1.smt2").read_bytes()
observed = z3.z3core.Z3_eval_smtlib2_string(z3.main_ctx().ref(), raw).splitlines()
expected = ["unsat", "unsat", "unsat", "sat", "sat"]
if observed != expected:
    raise SystemExit(f"Paper formal proof mismatch: {observed!r} != {expected!r}")
print("paper_cash_settlement_r1: 3 universal QF_LIA checks UNSAT; 2 wrong-model witnesses SAT")
PYZ3
"""

[tasks."formal:paper:source"]
description = "Qualify scoped real Python Paper settlement implementation with upstream CrossHair"
run = """
set -euo pipefail
export PYTHONPATH="$PWD/src:$PWD"
report="$(uvx --python 3.15 --from crosshair-tool==0.0.113 --with z3-solver==5.3.3.0 crosshair check     --report_all --analysis_kind=PEP316     --per_condition_timeout=25 --per_path_timeout=5     formal.paper_settlement_source_contract.settled_cash_and_liabilities_match_model)"
printf '%s\\n' "$report"
# CrossHair can exit zero without proving a postcondition. This source check
# admits only its explicit scoped proof report, never silence or a timeout.
if [[ "$(printf '%s\\n' "$report" | grep -F -c 'info: Confirmed over all paths.' || true)" != 1 ]]; then
  echo "CrossHair Paper source contract not confirmed" >&2
  exit 1
fi
"""

[tasks."verify:formal:broker-liquidation"]
description = "Formalize declared sale cashflow invariants and residual-debt counterexample with existing Z3"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/BrokerLiquidationCashflowR1.smt2)"
expected="$(printf 'unsat\\nunsat\\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Broker liquidation proof disagrees with its exact obligations: %s\\n' "$observed" >&2
  exit 1
fi
printf '%s\\n' "$observed"
"""

[tasks."verify:formal:unit-r-margin"]
description = "Z3 static real-valued margin headroom identity and counterexample (not broker refinement)"
run = """
set -euo pipefail
observed="$(cd ../../tools/formal && mise exec -- z3 -smt2 ../../domains/capital/formal/UnitRMarginBoundR1.smt2)"
expected="$(printf 'unsat\\nunsat\\nsat')"
if [ "$observed" != "$expected" ]; then
  printf 'Unexpected Z3 margin proof result: %s\\n' "$observed" >&2
  exit 1
fi
printf '%s\\n' "$observed"
"""

