name: Verify Station Zero

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Shared GitHub runners may vary slightly; the report still records the 1500 ms product target.
      ORDIVON_REPLAY_REPORT_P50_MAX_MS: "1600"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm receipt
      - run: pnpm measure
      - run: pnpm measure:replay
      - run: pnpm release:inputs -- --out /tmp/m5-inputs.json > /dev/null
