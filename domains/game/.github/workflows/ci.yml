name: Verify Station Zero

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm receipt
      - run: pnpm measure
