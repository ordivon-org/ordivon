[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }


[tasks.rules]
description = "Fast GPU-free deterministic game-rule contracts"
run = "cargo test --locked --no-default-features --lib"

[tasks.verify]
description = "Format, strict lint, Golden Path, replay and failure injection"
run = "cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --all-targets"

[tasks.play]
description = "Native Bevy interactive consumer (requires usable graphics)"
run = "cargo run --locked --bin room-action"
