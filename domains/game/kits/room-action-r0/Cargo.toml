[package]
name = "ordivon-room-action"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Minimal room-action game-type LEGO consumer"
license = "Apache-2.0"

[features]
default = ["playable"]
playable = ["dep:bevy"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["2d"], optional = true }
rand = "=0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "room-action"
path = "src/main.rs"
required-features = ["playable"]

[profile.dev]
debug = 0
