[tools]
node = "26.12.1"
pnpm = "12.16.1"
godot = "4.7.2-stable"

[tasks.verify]
run = "pnpm install --frozen-lockfile && pnpm check && mise run verify:orbit-smt && mise run verify:room-smt && mise run test:native && mise run test:native-receipt-selftest && mise run test:beacon && mise run test:encounter && mise run test:agent-episode && mise run test:visual-native && mise run test:dialogue-native && mise run test:bevy && mise run test:autonomous-study"


[tasks."test:native"]
description = "Run source-bound native Godot composition acceptance (requires installed Godot)"
run = "godot --headless --path examples/native-composition --script res://assert.gd && godot --headless --path examples/native-composition --script res://assert_audio.gd"

[tasks."test:encounter"]
description = "Fail-closed native Godot battle and process-restart acceptance; script errors fail even if Godot exits 0"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite encounter"

[tasks."test:native-receipt-selftest"]
description = "Falsify deceptive Godot exit-0+PASS receipts containing SCRIPT ERROR"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite selftest"

[tasks."test:visual-native"]
description = "Import a real CC0 sprite pack and verify Godot PackedScene appearance substitution"
run = "godot --headless --path examples/kenney-visual-composition --editor --import && godot --headless --path examples/kenney-visual-composition --script res://acceptance.gd && godot --headless --path examples/kenney-visual-composition --quit-after 2"

[tasks."test:dialogue-native"]
description = "Fail-closed real Dialogue Manager integration and native project launch"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite dialogue"


[tasks."test:autonomous-study"]
description = "Native R7 study evaluator/selftest from Game owner"
run = "uv run --with check-jsonschema==0.38.0 python research/autonomous-interest-r7/protocol_selftest.py"

[tasks."test:agent-episode"]
description = "Import then exercise the native Godot room scene and bounded Agent action/observation JSON, including clean checkouts"
run = "godot --headless --path examples/room-encounter --editor --import && python3 examples/room-encounter/agent_episode_acceptance.py"


[tasks."test:bevy"]
description = "Exercise the exact native Rust/Bevy rules and ECS consumer with Cargo.lock"
run = "cargo test --locked --manifest-path examples/orbit-collector/Cargo.toml && cargo check --locked --all-targets --manifest-path examples/orbit-collector/Cargo.toml"

[tasks."build:bevy"]
description = "Build the native Bevy game example; not a distributed package"
run = "cargo build --locked --manifest-path examples/orbit-collector/Cargo.toml"


[tasks."export:room-linux"]
description = "Use official matching Godot export templates to export, smoke and package the actual Linux room game"
run = """
set -eu
export_dir="${GAME_EXPORT_DIR:-$PWD/dist/room-encounter/linux-x86_64}"
mkdir -p "$export_dir"
godot --headless --path examples/room-encounter --editor --import
godot --headless --path examples/room-encounter --export-release "Linux x86_64" "$export_dir/room-encounter.x86_64"
test -s "$export_dir/room-encounter.x86_64"
chmod +x "$export_dir/room-encounter.x86_64"
cp examples/room-encounter/addons/dialogue_manager/LICENSE "$export_dir/DIALOGUE_MANAGER_LICENSE.txt"
cp examples/room-encounter/assets/LICENSE.txt "$export_dir/KENNEY_ASSETS_LICENSE.txt"
"$export_dir/room-encounter.x86_64" --headless --quit-after 3
tar -czf "$export_dir/../room-encounter-linux-x86_64.tar.gz" -C "$export_dir" room-encounter.x86_64 DIALOGUE_MANAGER_LICENSE.txt KENNEY_ASSETS_LICENSE.txt
sha256sum "$export_dir/room-encounter.x86_64" "$export_dir/../room-encounter-linux-x86_64.tar.gz"
"""


[tasks."export:room-windows"]
description = "Use official version-matched Godot native templates to export and package Windows x86_64 Room Encounter"
run = """
set -eu
export_dir="${GAME_EXPORT_DIR:-$PWD/dist/room-encounter/windows-x86_64}"
mkdir -p "$export_dir"
godot --headless --path examples/room-encounter --editor --import
godot --headless --path examples/room-encounter --export-release "Windows x86_64" "$export_dir/room-encounter.exe"
test -s "$export_dir/room-encounter.exe"
cp examples/room-encounter/addons/dialogue_manager/LICENSE "$export_dir/DIALOGUE_MANAGER_LICENSE.txt"
cp examples/room-encounter/assets/LICENSE.txt "$export_dir/KENNEY_ASSETS_LICENSE.txt"
(cd "$export_dir" && python3 -m zipfile -c "../room-encounter-windows-x86_64.zip" room-encounter.exe DIALOGUE_MANAGER_LICENSE.txt KENNEY_ASSETS_LICENSE.txt)
sha256sum "$export_dir/room-encounter.exe" "$export_dir/../room-encounter-windows-x86_64.zip"
"""


[tasks."verify:orbit-smt"]
description = "Full-width Orbit Collector invariant proof with upstream Z3"
run = "uv run --no-project --with z3-solver==4.15.4.0 python3 formal/verify_orbit_rules.py"

[tasks."verify:orbit-kani"]
description = "Rust rule implementation proof with upstream Kani 0.68.0"
run = "kani examples/orbit-collector/src/rules.rs"


[tasks."verify:room-smt"]
description = "Prove signed i64 Godot Room arithmetic model with upstream Z3; native source acceptance is separate"
run = "uv run --no-project --with z3-solver==4.15.4.0 python3 formal/verify_room_arithmetic.py"

# Thin compositions of existing native tasks, not a second execution engine.
[tasks."factory:validate:godot"]
description = "Factory gate: source readers, real Godot scenes, dialogue, Agent and math model"
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm check
mise run test:native
mise run test:native-receipt-selftest
mise run test:encounter
mise run test:agent-episode
mise run test:visual-native
mise run test:dialogue-native
mise run verify:room-smt
echo GAME_FACTORY_GODOT_VALIDATED
"""

[tasks."factory:package:room"]
description = "Factory preview: actual Godot acceptance, Linux/Windows export and source/package digests"
run = """
set -euo pipefail
mise run factory:validate:godot
mise run export:room-linux
mise run export:room-windows
test -s dist/room-encounter/room-encounter-linux-x86_64.tar.gz
test -s dist/room-encounter/room-encounter-windows-x86_64.zip
printf 'GAME_FACTORY_SOURCE_SHA='
git rev-parse HEAD
sha256sum dist/room-encounter/room-encounter-linux-x86_64.tar.gz dist/room-encounter/room-encounter-windows-x86_64.zip
echo GAME_FACTORY_ROOM_PACKAGES_READY_NATIVE_PREVIEW_NOT_STORE_RELEASE
"""

[tasks."factory:validate:bevy"]
description = "Factory gate: locked Rust ECS consumer and upstream Z3 model"
run = """
set -euo pipefail
mise run verify:orbit-smt
mise run test:bevy
echo GAME_FACTORY_BEVY_VALIDATED
"""

[tasks."factory:build:bevy"]
description = "Factory build: native Bevy executable, no installer claim"
run = """
set -euo pipefail
mise run factory:validate:bevy
mise run build:bevy
test -s examples/orbit-collector/target/debug/ordivon-orbit-collector
printf 'GAME_FACTORY_SOURCE_SHA='
git rev-parse HEAD
sha256sum examples/orbit-collector/target/debug/ordivon-orbit-collector
echo GAME_FACTORY_BEVY_NATIVE_BUILD_READY_NOT_PACKAGED
"""

[tasks."test:beacon"]
description = "Fail-closed native Godot game with keyboard movement, four deliveries and upstream collision loss"
run = """
set -euo pipefail
godot --headless --path examples/beacon-relay --editor --import > /tmp/ordivon-game-beacon-import.log 2>&1
output="$(godot --headless --path examples/beacon-relay --script res://acceptance.gd 2>&1)"
printf '%s\\n' "$output"
grep -q '^GAME_BEACON_RELAY_PASS assertions=' <<< "$output"
if grep -Eq 'SCRIPT ERROR|Parser Error|GAME_BEACON_RELAY_FAIL' <<< "$output"; then
  echo "GAME_BEACON_NATIVE_REJECTED_SCRIPT_ERROR" >&2
  exit 1
fi
"""

[tasks."factory:package:beacon"]
description = "Game Factory second product: test Beacon Relay, export Linux/Windows, smoke and retain upstream licenses"
run = """
set -euo pipefail
mise run test:beacon
target="${GAME_EXPORT_DIR:-$PWD/dist/beacon-relay}"
mkdir -p "$target/linux-x86_64" "$target/windows-x86_64"
godot --headless --path examples/beacon-relay --export-release "Linux x86_64" "$target/linux-x86_64/beacon-relay.x86_64"
godot --headless --path examples/beacon-relay --export-release "Windows x86_64" "$target/windows-x86_64/beacon-relay.exe"
test -s "$target/linux-x86_64/beacon-relay.x86_64"
test -s "$target/windows-x86_64/beacon-relay.exe"
chmod +x "$target/linux-x86_64/beacon-relay.x86_64"
cp examples/beacon-relay/LICENSE "$target/linux-x86_64/UPSTREAM_MIT_LICENSE.txt"
cp examples/beacon-relay/fonts/LICENSE.txt "$target/linux-x86_64/FONT_OFL_LICENSE.txt"
cp examples/beacon-relay/CREDITS.txt "$target/linux-x86_64/CREDITS.txt"
cp "$target/linux-x86_64/"*.txt "$target/windows-x86_64/"
"$target/linux-x86_64/beacon-relay.x86_64" --headless --quit-after 4
tar -czf "$target/beacon-relay-linux-x86_64.tar.gz" -C "$target/linux-x86_64" beacon-relay.x86_64 UPSTREAM_MIT_LICENSE.txt FONT_OFL_LICENSE.txt CREDITS.txt
(cd "$target/windows-x86_64" && python3 -m zipfile -c ../beacon-relay-windows-x86_64.zip beacon-relay.exe UPSTREAM_MIT_LICENSE.txt FONT_OFL_LICENSE.txt CREDITS.txt)
test -s "$target/beacon-relay-linux-x86_64.tar.gz"
test -s "$target/beacon-relay-windows-x86_64.zip"
printf 'GAME_FACTORY_SOURCE_SHA='
git rev-parse HEAD
sha256sum "$target/beacon-relay-linux-x86_64.tar.gz" "$target/beacon-relay-windows-x86_64.zip"
echo GAME_FACTORY_BEACON_PACKAGES_READY
"""

# The native Bevy product is packaged without inventing another game build engine.
[tasks."factory:package:orbit-linux"]
description = "Test, build and distribute the actual locked Bevy Orbit Collector Linux product"
run = """
set -euo pipefail
mise run factory:build:bevy
destination="${GAME_EXPORT_DIR:-$PWD/dist/orbit-collector}"
mkdir -p "$destination/linux-x86_64"
install -m 0755 examples/orbit-collector/target/debug/ordivon-orbit-collector "$destination/linux-x86_64/ordivon-orbit-collector"
cp LICENSE "$destination/linux-x86_64/PROJECT_APACHE_2_LICENSE.txt"
cat > "$destination/linux-x86_64/HOW_TO_PLAY.txt" <<'ORBIT_README'
Orbit Collector (Bevy 0.20.1, Rust 1.99.1) - Linux x86-64 native preview
Extract this archive and run ./ordivon-orbit-collector on an X11 graphical desktop.
WASD / arrow keys move. Collect five yellow beacons; avoid the red moving
hazard. Three hits lose. R restarts. This is an unsigned prototype preview.
The game has no third-party art/audio; Bevy dependency licenses are determined
by the pinned Cargo.lock and upstream dependency source.
ORBIT_README
printf '%s\n' "SOURCE_COMMIT=$(git rev-parse HEAD)" "ENGINE=Bevy 0.20.1" "RUST=$(rustc --version)" > "$destination/linux-x86_64/BUILD_SOURCE.txt"
if command -v xvfb-run >/dev/null 2>&1 && command -v timeout >/dev/null 2>&1; then
  set +e
  timeout 14s xvfb-run -a -s "-screen 0 1280x720x24" "$destination/linux-x86_64/ordivon-orbit-collector" > "$destination/linux-x86_64/launch.log" 2>&1
  rc=$?
  set -e
  if [ "$rc" -ne 124 ]; then
    echo "ORBIT_WINDOWED_SMOKE_FAILED exit=$rc"
    tail -60 "$destination/linux-x86_64/launch.log"
    exit 1
  fi
  if grep -Eq 'thread .+ panicked|[[:space:]]ERROR[[:space:]]|FATAL|Failed to create (a |the )?surface' "$destination/linux-x86_64/launch.log"; then
    echo "ORBIT_WINDOWED_SMOKE_FAILED_LOG"
    tail -60 "$destination/linux-x86_64/launch.log"
    exit 1
  fi
  if ! grep -q 'Creating new window ' "$destination/linux-x86_64/launch.log" || ! grep -q 'AdapterInfo' "$destination/linux-x86_64/launch.log"; then
    echo ORBIT_WINDOWED_SMOKE_MISSING_NATIVE_RENDERER_OR_WINDOW
    tail -60 "$destination/linux-x86_64/launch.log"
    exit 1
  fi
  echo ORBIT_WINDOWED_SMOKE_PASS_14S_NATIVE_APPLICATION_ALIVE
else
  echo ORBIT_WINDOWED_SMOKE_NOT_RUN_NO_XVFB
fi
tar -czf "$destination/orbit-collector-linux-x86_64.tar.gz" -C "$destination/linux-x86_64"   ordivon-orbit-collector PROJECT_APACHE_2_LICENSE.txt HOW_TO_PLAY.txt BUILD_SOURCE.txt
test -s "$destination/orbit-collector-linux-x86_64.tar.gz"
sha256sum "$destination/orbit-collector-linux-x86_64.tar.gz"
echo ORBIT_FACTORY_LINUX_PREVIEW_READY
"""
