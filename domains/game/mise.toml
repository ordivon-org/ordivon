[tools]
node = "26.12.1"
pnpm = "12.16.1"

[tasks.verify]
run = "pnpm install --frozen-lockfile && pnpm check"


[tasks."test:native"]
description = "Run source-bound native Godot composition acceptance (requires installed Godot)"
run = "godot --headless --path test/fixtures/native-godot-assembly --script res://assert.gd"
