[tools]
godot = "4.7.2-stable"
node = "26.12.1"
pnpm = "12.15.0"

[tasks.verify]
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm check
if command -v apt-get >/dev/null 2>&1; then
  pnpm exec playwright install --with-deps chromium
else
  pnpm exec playwright install chromium
fi
pnpm e2e
"""
