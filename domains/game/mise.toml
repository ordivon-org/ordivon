[tools]
node = "26.12.1"
pnpm = "12.16.1"
godot = "4.7.2-stable"

[tasks.verify]
run = "pnpm install --frozen-lockfile && pnpm check && mise run verify:orbit-smt && mise run verify:room-smt && mise run test:native && mise run test:native-receipt-selftest && mise run test:human-playtest-protocol && mise run test:encounter && mise run test:agent-episode && mise run test:visual-native && mise run test:dialogue-native && mise run test:bevy && mise run test:autonomous-study"


[tasks."test:native"]
description = "Run source-bound native Godot composition acceptance (requires installed Godot)"
run = "godot --headless --path examples/native-composition --script res://assert.gd && godot --headless --path examples/native-composition --script res://assert_audio.gd"

[tasks."test:encounter"]
description = "Fail-closed native Godot battle and process-restart acceptance; script errors fail even if Godot exits 0"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite encounter"

[tasks."test:native-receipt-selftest"]
description = "Falsify deceptive Godot exit-0+PASS receipts containing SCRIPT ERROR"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite selftest"

[tasks."test:visual-native"]
description = "Import a real CC0 sprite pack and verify Godot PackedScene appearance substitution"
run = "godot --headless --path examples/kenney-visual-composition --editor --import && godot --headless --path examples/kenney-visual-composition --script res://acceptance.gd && godot --headless --path examples/kenney-visual-composition --quit-after 2"

[tasks."test:dialogue-native"]
description = "Fail-closed real Dialogue Manager integration and native project launch"
run = "python3 examples/room-encounter/native_scene_acceptance.py --suite dialogue"


[tasks."test:autonomous-study"]
description = "Native R7 study evaluator/selftest from Game owner"
run = "uv run --with check-jsonschema==0.38.0 python research/autonomous-interest-r7/protocol_selftest.py"

[tasks."test:human-playtest-protocol"]
description = "Falsify human-study CSV consent, digest, planned order and UNKNOWN/NO confusion via synthetic temporary fixtures"
run = "python3 -m unittest discover -s research -p 'test_room_encounter_playtest.py' -v"


[tasks."test:agent-episode"]
description = "Exercise a real Godot room scene through bounded Agent action/observation JSON after editor import"
run = "python3 examples/room-encounter/agent_episode_acceptance.py"


[tasks."test:bevy"]
description = "Exercise the exact native Rust/Bevy rules and ECS consumer with Cargo.lock"
run = "cargo test --locked --manifest-path examples/orbit-collector/Cargo.toml && cargo check --locked --all-targets --manifest-path examples/orbit-collector/Cargo.toml"

[tasks."build:bevy"]
description = "Build the native Bevy game example; not a distributed package"
run = "cargo build --locked --manifest-path examples/orbit-collector/Cargo.toml"


[tasks."export:room-linux"]
description = "Use official matching Godot export templates to export, smoke and package the actual Linux room game"
run = """
set -eu
export_dir="${GAME_EXPORT_DIR:-$PWD/dist/room-encounter/linux-x86_64}"
mkdir -p "$export_dir"
godot --headless --path examples/room-encounter --editor --import
godot --headless --path examples/room-encounter --export-release "Linux x86_64" "$export_dir/room-encounter.x86_64"
test -s "$export_dir/room-encounter.x86_64"
chmod +x "$export_dir/room-encounter.x86_64"
cp examples/room-encounter/addons/dialogue_manager/LICENSE "$export_dir/DIALOGUE_MANAGER_LICENSE.txt"
cp examples/room-encounter/assets/LICENSE.txt "$export_dir/KENNEY_ASSETS_LICENSE.txt"
"$export_dir/room-encounter.x86_64" --headless --quit-after 3
tar -czf "$export_dir/../room-encounter-linux-x86_64.tar.gz" -C "$export_dir" room-encounter.x86_64 DIALOGUE_MANAGER_LICENSE.txt KENNEY_ASSETS_LICENSE.txt
sha256sum "$export_dir/room-encounter.x86_64" "$export_dir/../room-encounter-linux-x86_64.tar.gz"
"""


[tasks."export:room-windows"]
description = "Use official version-matched Godot native templates to export and package Windows x86_64 Room Encounter"
run = """
set -eu
export_dir="${GAME_EXPORT_DIR:-$PWD/dist/room-encounter/windows-x86_64}"
mkdir -p "$export_dir"
godot --headless --path examples/room-encounter --editor --import
godot --headless --path examples/room-encounter --export-release "Windows x86_64" "$export_dir/room-encounter.exe"
test -s "$export_dir/room-encounter.exe"
cp examples/room-encounter/addons/dialogue_manager/LICENSE "$export_dir/DIALOGUE_MANAGER_LICENSE.txt"
cp examples/room-encounter/assets/LICENSE.txt "$export_dir/KENNEY_ASSETS_LICENSE.txt"
(cd "$export_dir" && python3 -m zipfile -c "../room-encounter-windows-x86_64.zip" room-encounter.exe DIALOGUE_MANAGER_LICENSE.txt KENNEY_ASSETS_LICENSE.txt)
sha256sum "$export_dir/room-encounter.exe" "$export_dir/../room-encounter-windows-x86_64.zip"
"""


[tasks."verify:orbit-smt"]
description = "Full-width Orbit Collector invariant proof with upstream Z3"
run = "uv run --no-project --with z3-solver==4.15.4.0 python3 formal/verify_orbit_rules.py"

[tasks."verify:orbit-kani"]
description = "Rust rule implementation proof with upstream Kani 0.68.0"
run = "kani examples/orbit-collector/src/rules.rs"


[tasks."verify:room-smt"]
description = "Prove signed i64 Godot Room arithmetic model with upstream Z3; native source acceptance is separate"
run = "uv run --no-project --with z3-solver==4.15.4.0 python3 formal/verify_room_arithmetic.py"
