<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Station Zero — M1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ORDIVON GAME · M1</p>
          <h1>Station Zero</h1>
          <p class="lede">Stabilize the station, preserve the crew, and transmit a verified rescue signal.</p>
        </div>
        <span id="mission-status" class="status">LOADING</span>
      </header>

      <section id="resources" class="metrics" aria-label="Critical resources"></section>

      <section class="layout">
        <div>
          <section class="panel">
            <div class="panel-heading"><div><p class="eyebrow">STATION</p><h2>Room graph</h2></div><span id="location" class="chip"></span></div>
            <div id="rooms" class="rooms"></div>
          </section>

          <section class="panel">
            <p class="eyebrow">SYSTEMS</p>
            <h2>Critical infrastructure</h2>
            <div id="systems" class="systems"></div>
          </section>
        </div>

        <aside>
          <section class="panel">
            <p class="eyebrow">ENGINEER</p>
            <h2 id="agent-name">Engineer</h2>
            <div id="agent"></div>
          </section>

          <section class="panel">
            <div class="panel-heading"><div><p class="eyebrow">COMMAND</p><h2>Available actions</h2></div><button id="suggest" class="secondary">Suggest</button></div>
            <div id="actions" class="actions"></div>
          </section>

          <section class="panel">
            <div class="panel-heading"><div><p class="eyebrow">EVIDENCE</p><h2>Latest event</h2></div><button id="replay" class="secondary">Replay</button></div>
            <pre id="output">Loading persisted world…</pre>
          </section>
        </aside>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
