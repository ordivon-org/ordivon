<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E03 Commitment Lag</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#10151d;color:#e9eef7}.panel{border:1px solid #3b4657;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{color:#9fb0c7;font-size:.85rem}.value{font:600 1.05rem ui-monospace,monospace}button,select{margin:6px;padding:10px 14px}</style></head><body><h1>E03 · Commitment Lag</h1><p>Your guard command commits against a future target lane. With lag, reacting only to the current lane becomes stale.</p><label>Lag <select data-lag><option value="0">0</option><option value="1" selected>1</option></select></label><div class="panel grid"><div><div class="label">Tick</div><div class="value" data-tick></div></div><div><div class="label">Observed lane</div><div class="value" data-observed></div></div><div><div class="label">Direction</div><div class="value" data-direction></div></div><div><div class="label">Recovery cost</div><div class="value" data-cost></div></div></div><div><button data-lane="0">Guard lane 0</button><button data-lane="1">Guard lane 1</button><button data-lane="2">Guard lane 2</button><button data-reset>Reset</button></div><div class="panel"><div class="label">Last commitment</div><div class="value" data-execution></div><div class="label">State</div><div class="value" data-result></div></div><script type="module" src="./app.js"></script></body></html>
