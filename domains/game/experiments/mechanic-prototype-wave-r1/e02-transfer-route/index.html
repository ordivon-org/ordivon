<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E02 Transfer Route</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#10151d;color:#e9eef7}.panel{border:1px solid #3b4657;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{color:#9fb0c7;font-size:.85rem}.value{font:600 1.05rem ui-monospace,monospace}button{margin:6px;padding:10px 14px}</style></head><body><h1>E02 · Transfer Route</h1><p>The route geometry changes. The useful rule is relational: jump only at the launch marker while the pulse is green.</p><div class="panel grid"><div><div class="label">Route</div><div class="value" data-route></div></div><div><div class="label">Position</div><div class="value" data-position></div></div><div><div class="label">At launch marker</div><div class="value" data-marker></div></div><div><div class="label">Pulse</div><div class="value" data-pulse></div></div></div><div><button data-action="advance">Advance</button><button data-action="wait">Wait</button><button data-action="jump">Jump</button><button data-reset>Reset</button><button data-switch>Switch route</button></div><div class="panel"><div class="label">Consequence</div><div class="value" data-consequence></div><div class="label">Result</div><div class="value" data-result></div></div><script type="module" src="./app.js"></script></body></html>
