rule = "This profile maps the current Pre-G0 work to external human-centred, usability, accessibility and provider authorities. It is not a universal game-development standard and does not make Player Value, accessibility-compliance, store-readiness or product-selection claims."

[[authority]]
id = "iso-9241-210-2019"
name = "ISO 9241-210:2019 Human-centred design for interactive systems"
role = "APPLICABLE_HCD_PROCESS_REFERENCE"
source = "https://www.iso.org/standard/77520.html"
currentness_checked = "2026-09-14"
rationale = "Current Pre-G0 work forms and tests player-facing interaction hypotheses, so human-centred design activities and iterative evaluation are directly relevant."

[[authority]]
id = "iso-9241-11-2018"
name = "ISO 9241-11:2018 Usability: Definitions and concepts"
role = "APPLICABLE_USABILITY_REFERENCE"
source = "https://www.iso.org/standard/63500.html"
currentness_checked = "2026-09-14"
rationale = "Mechanical completion is separated from human effectiveness, efficiency and satisfaction in context of use."

[[authority]]
id = "xbox-accessibility-guidelines-3.2"
name = "Xbox Accessibility Guidelines v3.2"
role = "ADVISORY_GAME_ACCESSIBILITY_GUIDANCE"
source = "https://learn.microsoft.com/gaming/accessibility/xbox-accessibility-guidelines/"
currentness_checked = "2026-09-14"
rationale = "Use as current game-specific accessibility design/test guidance. No legal or certification claim is inferred."

[[authority]]
id = "wcag-2.2"
name = "W3C Web Content Accessibility Guidelines 2.2"
role = "APPLICABLE_TO_WEB_PLAYTEST_CARRIER_ONLY"
source = "https://www.w3.org/TR/WCAG22/"
currentness_checked = "2026-09-14"
rationale = "The current Pre-G0 apparatus is a web interface. Selected WCAG criteria can evaluate that carrier, but this does not make the future game or even the whole apparatus WCAG-conformant."

[[authority]]
id = "games-user-research-practice"
name = "Games User Research method selection guidance"
role = "PROFESSIONAL_PRACTICE_GUIDANCE"
source = "https://gamesuserresearch.com/choose-the-right-playtest-method/"
currentness_checked = "2026-09-14"
rationale = "Method choice should follow the player-facing question; professional guidance complements, rather than replaces, ISO HCD/usability concepts and real participant evidence."

[[authority]]
id = "godot-provider"
name = "Godot official engine documentation and release archive"
role = "IMPLEMENTATION_PROVIDER_AUTHORITY"
source = "https://godotengine.org/download/archive/"
currentness_checked = "2026-09-14"
local_pin = "4.7.1"
current_stable_observed = "4.7.2"
rationale = "The accepted local build/export chain is deliberately pinned to 4.7.1. Upstream 4.7.2 stable currentness is tracked as provider drift, not automatically treated as a defect or forced upgrade."

[[deferred_authority]]
id = "store-rating-and-release-rules"
examples = ["IARC", "ESRB", "PEGI", "Steamworks release requirements", "App Store review", "Google Play policy"]
role = "DEFERRED_UNTIL_TARGET_PRODUCT_AND_DISTRIBUTION_CARRIER_EXIST"
rationale = "No product or target distribution platform has been committed in Pre-G0. Activating release certification/rating rules now would be premature."

