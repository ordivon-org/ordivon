[project]
name = "ordivon-distribution-v2-control-plane"
version = "0.2.0"
description = "Thin semantic control plane for Distribution v2"
requires-python = "==3.14.7"
dependencies = [
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff==0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "UP"]
