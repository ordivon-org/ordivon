[tools]
python = "3.15.1"
uv = "0.13.5"

[tasks.verify]
run = """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel)"
export ORDIVON_AGENT_AUTOMATION_SOURCE_ROOT="${ORDIVON_AGENT_AUTOMATION_SOURCE_ROOT:-$repo_root/services/harness}"
uv lock --check
uv sync --locked
PYTHONPATH="$repo_root" uv run --locked python -m pytest ../../catalogs/authorities/tests ../../catalogs/capabilities/tests
uv run --locked --group quality ruff check scripts tests ../../catalogs/authorities/scripts ../../catalogs/authorities/tests ../../catalogs/capabilities/routing ../../catalogs/capabilities/tests
uv run --locked --group quality ruff format --check scripts tests ../../catalogs/authorities/scripts ../../catalogs/authorities/tests ../../catalogs/capabilities/routing ../../catalogs/capabilities/tests
uv run --locked --group authority python ../../catalogs/authorities/scripts/check_authority_catalog_r1.py
uv run --locked --group authority python scripts/check_standard_native_enterprise_r2.py
uv run --locked --group reasoning python scripts/check_reasoning_waist_r1.py
uv run --locked --group security bandit -r scripts -q -s B404,B603
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
uv export --locked --all-groups --no-group security --format pylock.toml --output-file "$tmp/pylock.audit.toml"
uv run --locked --group security pip-audit --locked "$tmp" --progress-spinner off
"""
