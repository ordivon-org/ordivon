[project]
name = "ordivon-next"
version = "0.0.0"
description = "Repository environment for Ordivon Next."
requires-python = "==3.15.1"
dependencies = [
  "ordivon-composition",
]

[dependency-groups]
test = [
  "jsonschema>=4.26,<5",
  "playwright>=1,<2",
  "pytest==9.1.1",
  "z3-solver>=4,<5",
]
quality = [
  "ruff==0.17.2",
]
security = [
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
]
test-analysis = [
  "coverage",
]
authority = [
  "check-jsonschema",
  "jsonschema>=4.26,<5",
]
reasoning = [
  "scipy>=1.18.1,<2",
  "pyshacl",
  "rdflib",
  "unified-planning",
  "up-pyperplan",
  "z3-solver>=4,<5",
]

[tool.uv.sources]
ordivon-composition = { path = "../../packages/composition" }

[tool.uv]
package = false
default-groups = ["test"]
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py315"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
