[package]
name = "ordivon-host-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Rust Host semantic continuity MCP candidate (not installed)"

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tokio-postgres = { version = "=0.7.18" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
