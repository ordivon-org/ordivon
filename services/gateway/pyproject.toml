[project]
name = "ordivon-gateway"
version = "0.1.0"
description = "Stable non-authoritative northbound MCP adapter for Ordivon natural owners."
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
  "mcp==2.2.0",
  "opentelemetry-distro==0.65b0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "pydantic==2.13.4",
  "pyjwt[crypto]==2.14.0",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[project.scripts]
ordivon-gateway = "ordivon_gateway.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
