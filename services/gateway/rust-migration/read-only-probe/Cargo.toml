[package]
name = "ordivon-gateway-read-only-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7", features = ["limit"] }

[profile.dev]
debug = 0
incremental = false
