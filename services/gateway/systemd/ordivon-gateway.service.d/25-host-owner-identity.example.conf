# Install as /etc/systemd/system/ordivon-gateway.service.d/25-host-owner-identity.conf
# after provisioning the same workload secret encrypted for this machine.
[Service]
LoadCredentialEncrypted=host-mcp-bearer:/etc/ordivon/credentials/host-mcp-bearer.cred
Environment=ORDIVON_GATEWAY_HOST_BEARER_TOKEN_FILE=%d/host-mcp-bearer
