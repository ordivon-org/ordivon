# Installed only after the Gateway Access application exists and its exact AUD is known.
# Values in angle brackets are non-secret deployment outputs and must be replaced before installation.
[Service]
Environment=ORDIVON_GATEWAY_PUBLIC_ORIGIN=https://gateway-mcp.ordivon.com
Environment=ORDIVON_GATEWAY_TRUST_CF_ACCESS=true
Environment=ORDIVON_GATEWAY_CF_ACCESS_ISSUER=https://<team-name>.cloudflareaccess.com
Environment=ORDIVON_GATEWAY_CF_ACCESS_AUDIENCE=<gateway-access-application-aud>
