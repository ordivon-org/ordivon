[Service]
# Optional observability profile: MCP owns W3C trace propagation, OpenTelemetry
# owns trace export. Keep the base Gateway correct when the local OTLP receiver
# is intentionally cold.
Environment=OTEL_TRACES_EXPORTER=otlp_proto_http
Environment=OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces
