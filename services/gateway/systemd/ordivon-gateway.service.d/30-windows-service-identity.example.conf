# Installed only after the Windows Runtime Access application has a Service Auth policy
# for the dedicated Ordivon Gateway service token.
[Service]
LoadCredential=windows-access-client-id:/etc/ordivon/gateway/windows-access-client-id
LoadCredential=windows-access-client-secret:/etc/ordivon/gateway/windows-access-client-secret
Environment=ORDIVON_GATEWAY_WINDOWS_RUNTIME_URL=https://canary-mcp.ordivon.com/mcp
Environment=ORDIVON_GATEWAY_WINDOWS_ACCESS_CLIENT_ID_FILE=%d/windows-access-client-id
Environment=ORDIVON_GATEWAY_WINDOWS_ACCESS_CLIENT_SECRET_FILE=%d/windows-access-client-secret
