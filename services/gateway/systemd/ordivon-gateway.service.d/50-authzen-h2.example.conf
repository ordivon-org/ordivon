[Service]
# H2 remains disabled unless this drop-in is explicitly installed with a qualified PDP/credential owner.
LoadCredential=authzen-bearer:/etc/ordivon/gateway/authzen-bearer
Environment=ORDIVON_GATEWAY_AUTHZEN_EVALUATION_ENDPOINT=https://pdp.example.invalid/access/v1/evaluation
Environment=ORDIVON_GATEWAY_AUTHZEN_BEARER_TOKEN_FILE=%d/authzen-bearer
