[tools]
powershell = "7.6.8"
python = "3.15.1"
uv = "latest"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

# Upstream prebuilt Nextest, fetched directly from its official GitHub release.
# Do not make root CI depend on an extra third-party release proxy.
# Keep the official release SHA-256 and byte-size verification.
# Admit only the verified official Linux and Windows x64 release assets.
[tools."http:cargo-nextest"]
version = "0.9.152"

[tools."http:cargo-nextest".platforms]
linux-x64 = { url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz", checksum = "sha256:d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a", size = 12393262 }
windows-x64 = { url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-pc-windows-msvc.zip", checksum = "sha256:cc6bf4b6a7ac18e462cd6c9bae67e26921b888249c2988c6acabf3df387ed9d6", size = 7966280 }

[tasks."formal:kani:verify"]
description = "Verify actual Rust PostgreSQL terminal and Attempt lifecycle properties with upstream Kani"
run = """
set -euo pipefail
# mise resolves the newest upstream kani-verifier for this optional task.
# KANI_HOME MUST be established before any Kani command: even --version
# initializes the installer and would otherwise touch the shared ~/.kani.
export KANI_HOME="${KANI_HOME:-$HOME/.cache/ordivon/kani}"
mkdir -p "$KANI_HOME"

# Respect the existing VPN/egress selection supplied by Network, not a new
# independent proxy daemon or changed system routing.
if [[ -z "${HTTPS_PROXY:-}${https_proxy:-}${ALL_PROXY:-}${all_proxy:-}" && -n "${ORDIVON_VPN_HTTP_PROXY:-}" ]]; then
  export HTTPS_PROXY="$ORDIVON_VPN_HTTP_PROXY" HTTP_PROXY="$ORDIVON_VPN_HTTP_PROXY"
fi

# Serialize setup across Agents and delete only demonstrably incomplete
# official compression archives; next setup fetches the current release.
(
  flock -x 9
  shopt -s nullglob
  for archive in "$KANI_HOME"/kani-*.tar.gz; do
    if ! gzip -t "$archive" 2>/dev/null; then
      rm -- "$archive"
    fi
  done
  cargo kani setup
) 9>"$KANI_HOME/.setup.lock"
cargo kani --version
cargo kani -p ordivon-runtime-core --lib --no-default-features --features postgres-registry-admission --harness proof_pg_terminal_transition_matches_contract --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_attempt_terminal_absorbing_and_resolution_equivalence --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_attempt_cancel_is_transition_or_stopping_replay --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_terminal_reservation_target_preserves_held_orphan_fence --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_terminal_reservation_target_fails_closed_on_incomplete_evidence --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_terminal_reservation_target_rejects_mismatched_job_resolution --default-unwind 32
"""

# Kani is opt-in so regular Rust checks do not download a large verifier.
[tasks."formal:kani:verify".tools]
"cargo:kani-verifier" = { version = "latest", os = ["linux"], locked = true }

[tasks.verify]
run = """
set -euo pipefail
cargo fmt --check
scripts/owner-environment test
cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
# Match the deployed Linux feature boundary, separately from all-features and legacy.
cargo test --locked -p ordivon-runtime-core --no-default-features --features postgres-registry-admission --lib
cargo test --locked -p ordivon-runtime-core --no-default-features --features transactional-runtime -- --skip request_identity_and_terminal_winner_match_reference_model
python3 scripts/tests/test_focused_verification_contract.py -v
python3 scripts/tests/test_pg_physical_verification_contract.py -v
python3 scripts/tests/test_pg_disposable_physical.py -v
scripts/owner-environment extended
python scripts/check_docs.py
mise run formal:verify
"""

[tasks."test:focused"]
description = "Focused cargo-nextest, PG by default; explicit legacy and archive profiles (RUNTIME_TEST_EXPR)"
run = """
set -euo pipefail
case "${RUNTIME_TEST_PROFILE:-pg}" in
  pg)
    feature=postgres-registry-admission
    target=(--lib)
    default_selector='test(nonterminal_native_transition_requires_reconciliation)'
    ;;
  legacy)
    feature=transactional-runtime
    target=(--lib)
    default_selector='test(public_requests_reject_unknown_fields_and_path_escape)'
    ;;
  archive)
    feature=operator-tools
    target=(--test archive_migration_properties)
    default_selector='all()'
    ;;
  *)
    echo "Invalid RUNTIME_TEST_PROFILE: expected pg, legacy or archive" >&2
    exit 2
    ;;
esac
echo "Runtime focused feature: $feature"
# A declared pin alone is not execution evidence: missing mise once
# resolved an older PATH cargo-nextest while a focused test still passed.
mise install http:cargo-nextest
expected_nextest=$(python3 - <<'PY_NEXTTEST_VERSION'
import tomllib
from pathlib import Path
with Path("mise.toml").open("rb") as source:
    print(tomllib.load(source)["tools"]["http:cargo-nextest"]["version"])
PY_NEXTTEST_VERSION
)
actual_nextest=$(mise exec -- cargo nextest --version | awk 'NR==1 { print $2 }')
if [[ "$actual_nextest" != "$expected_nextest" ]]; then
  echo "Nextest tool identity drift: required=$expected_nextest observed=$actual_nextest" >&2
  exit 1
fi
echo "qualified cargo-nextest $actual_nextest"
# Native Nextest owns both discovery and execution. Use a fresh per-run store,
# not the shared ci/junit.xml, and list ignored tests without executing them.
evidence=$(mktemp -d)
trap 'rm -rf "$evidence"' EXIT
python3 - "$evidence" <<'PY_NEXTTEST_STORE'
import json
from pathlib import Path
import sys
root = Path(sys.argv[1]).resolve()
(root / "store.toml").write_text("[store]\\ndir = " + json.dumps((root / "store").as_posix()) + "\\n", encoding="utf-8")
PY_NEXTTEST_STORE
build=(--locked "${target[@]}" -p ordivon-runtime-core --no-default-features --features "$feature")
configuration=(-P ci --user-config-file none --tool-config-file "ordivon-evidence:$evidence/store.toml")
# Archive once using Nextest itself. Discovery and execution consume the
# same private build carrier even if a later Cargo build replaces a binary.
archive="$evidence/tests.tar.zst"
mise exec -- cargo nextest archive "${build[@]}" "${configuration[@]}" --archive-file "$archive" --zstd-level -3
archive_sha=$(python3 scripts/qualify_focused_evidence.py --digest "$archive")
selection=(--archive-file "$archive" "${configuration[@]}" -E "${RUNTIME_TEST_EXPR:-$default_selector}")
mise exec -- cargo nextest list "${selection[@]}" --message-format json --run-ignored all > "$evidence/list.json"
python3 scripts/qualify_focused_evidence.py "$evidence/list.json"
mise exec -- cargo nextest run "${selection[@]}" --no-tests fail --retries 0 --status-level pass
python3 scripts/qualify_focused_evidence.py "$evidence/list.json" "$evidence/store/ci/junit.xml" "$archive" "$archive_sha"
"""


# One Runtime-native Formal verification LEGO: source/consumer trace and
# actual upstream TLC model checking. Reuse the pinned toolchain owner; do not
# install a second verifier. CI cold starts bootstrap only the locked cache.
[tasks."formal:verify"]
description = "Validate Runtime dispatch contract trace and model-check pinned TLA+"
run = """
set -euo pipefail
python scripts/verify_formal_trace.py
python scripts/verify_formal_trace.py --native-profile pg
# Read the cache path from the existing upstream-locked toolchain contract.
local_jar=$(python -c 'import json; print(json.load(open("formal/toolchain.lock.json", encoding="utf-8"))["cacheRelativePath"])')
if [[ "${ORDIVON_TLA_TOOLS_JAR+x}" != x && ! -f "$local_jar" ]]; then
  scripts/tla-formal bootstrap
fi
scripts/tla-formal check
# An intentionally unsafe abstract retry MUST produce the named TLC violation.
scripts/tla-formal falsify
"""


[tasks."test:postgres-registry:physical"]
description = "Run ignored native PG18 challengers; require explicit test DSN and exact nonempty test evidence"
run = "python3 scripts/pg_disposable_physical.py --physical"


[tasks."test:postgres-registry:disposable"]
description = "Run native PG18 challenger tests in an isolated PostgreSQL instance; never inherit production DSN"
run = "python scripts/pg_disposable_physical.py"


[tasks."test:postgres-registry:stage"]
description = "Verify historical stage remains non-authoritative; require explicit stage DSN and exact witness"
run = "python3 scripts/pg_disposable_physical.py --stage"
