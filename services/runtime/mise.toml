[tools]
powershell = "7.6.8"
python = "3.15.1"
uv = "0.13.5"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

# Upstream prebuilt Nextest, fetched directly from its official GitHub release.
# Do not make root CI depend on an extra third-party release proxy.
# Keep the official release SHA-256 and byte-size verification.
# Only linux-x64 is admitted until the other platforms' exact assets are qualified.
[tools."http:cargo-nextest"]
version = "0.9.149"

[tools."http:cargo-nextest".platforms]
linux-x64 = { url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-x86_64-unknown-linux-gnu.tar.gz", checksum = "sha256:32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770", size = 12121096 }

[tasks."formal:kani:verify"]
description = "Verify actual Rust PostgreSQL terminal and Attempt lifecycle properties with upstream Kani"
run = """
set -euo pipefail
# mise resolves the newest upstream kani-verifier for this optional task.
# KANI_HOME MUST be established before any Kani command: even --version
# initializes the installer and would otherwise touch the shared ~/.kani.
export KANI_HOME="${KANI_HOME:-$HOME/.cache/ordivon/kani}"
mkdir -p "$KANI_HOME"

# Respect the existing VPN/egress selection supplied by Network, not a new
# independent proxy daemon or changed system routing.
if [[ -z "${HTTPS_PROXY:-}${https_proxy:-}${ALL_PROXY:-}${all_proxy:-}" && -n "${ORDIVON_VPN_HTTP_PROXY:-}" ]]; then
  export HTTPS_PROXY="$ORDIVON_VPN_HTTP_PROXY" HTTP_PROXY="$ORDIVON_VPN_HTTP_PROXY"
fi

# Serialize setup across Agents and delete only demonstrably incomplete
# official compression archives; next setup fetches the current release.
(
  flock -x 9
  shopt -s nullglob
  for archive in "$KANI_HOME"/kani-*.tar.gz; do
    if ! gzip -t "$archive" 2>/dev/null; then
      rm -- "$archive"
    fi
  done
  cargo kani setup
) 9>"$KANI_HOME/.setup.lock"
cargo kani --version
cargo kani -p ordivon-runtime-core --lib --no-default-features --features postgres-registry-admission --harness proof_pg_terminal_transition_matches_contract --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_attempt_terminal_absorbing_and_resolution_equivalence --default-unwind 32
cargo kani -p ordivon-runtime-core --lib --no-default-features --features transactional-runtime --harness proof_actual_attempt_cancel_is_transition_or_stopping_replay --default-unwind 32
"""

# Kani is opt-in so regular Rust checks do not download a large verifier.
[tasks."formal:kani:verify".tools]
"cargo:kani-verifier" = { version = "latest", os = ["linux"], locked = true }

[tasks.verify]
run = """
set -euo pipefail
cargo fmt --check
scripts/owner-environment test
cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
cargo test --locked -p ordivon-runtime-core --no-default-features --features transactional-runtime -- --skip request_identity_and_terminal_winner_match_reference_model
python3 scripts/tests/test_focused_verification_contract.py -v
python3 scripts/tests/test_pg_physical_verification_contract.py -v
scripts/owner-environment extended
python scripts/check_docs.py
mise run formal:verify
"""

[tasks."test:focused"]
description = "Optional upstream cargo-nextest focused suite with native JUnit (RUNTIME_TEST_EXPR)"
run = """
set -euo pipefail
# A declared pin alone is not execution evidence: missing mise once
# resolved an older PATH cargo-nextest while a focused test still passed.
mise install http:cargo-nextest
expected_nextest=$(python3 - <<'PY_NEXTTEST_VERSION'
import tomllib
from pathlib import Path
with Path("mise.toml").open("rb") as source:
    print(tomllib.load(source)["tools"]["http:cargo-nextest"]["version"])
PY_NEXTTEST_VERSION
)
actual_nextest=$(mise exec -- cargo nextest --version | awk 'NR==1 { print $2 }')
if [[ "$actual_nextest" != "$expected_nextest" ]]; then
  echo "Nextest tool identity drift: required=$expected_nextest observed=$actual_nextest" >&2
  exit 1
fi
echo "qualified cargo-nextest $actual_nextest"
mise exec -- cargo nextest run --locked --lib -p ordivon-runtime-core --no-default-features --features transactional-runtime --status-level pass -P ci -E "${RUNTIME_TEST_EXPR:-test(public_requests_reject_unknown_fields_and_path_escape)}"
"""


# One Runtime-native Formal verification LEGO: source/consumer trace and
# actual upstream TLC model checking. Reuse the pinned toolchain owner; do not
# install a second verifier. CI cold starts bootstrap only the locked cache.
[tasks."formal:verify"]
description = "Validate Runtime dispatch contract trace and model-check pinned TLA+"
run = """
set -euo pipefail
python scripts/verify_formal_trace.py
# Read the cache path from the existing upstream-locked toolchain contract.
local_jar=$(python -c 'import json; print(json.load(open("formal/toolchain.lock.json", encoding="utf-8"))["cacheRelativePath"])')
if [[ "${ORDIVON_TLA_TOOLS_JAR+x}" != x && ! -f "$local_jar" ]]; then
  scripts/tla-formal bootstrap
fi
scripts/tla-formal check
# An intentionally unsafe abstract retry MUST produce the named TLC violation.
scripts/tla-formal falsify
"""


[tasks."test:postgres-registry:physical"]
description = "Run explicitly ignored native PostgreSQL 18 Registry challenger tests; missing DSN is a failure, never PASS"
run = """
set -euo pipefail
if ! printenv ORDIVON_PG_TEST_DSN >/dev/null; then
  echo "ORDIVON_PG_TEST_DSN is required for physical PostgreSQL qualification" >&2
  exit 2
fi
cargo test --locked -p ordivon-runtime-core --no-default-features \
  --features postgres-registry-admission pg18_ -- --ignored --nocapture --test-threads=1
"""

[tasks."test:postgres-registry:stage"]
description = "Verify the historical PostgreSQL stage remains non-authoritative; separate from fresh scratch PG tests"
run = """
set -euo pipefail
if ! printenv ORDIVON_PG_STAGE_TEST_DSN >/dev/null; then
  echo "ORDIVON_PG_STAGE_TEST_DSN is required for historical-stage qualification" >&2
  exit 2
fi
cargo test --locked -p ordivon-runtime-core --no-default-features \
  --features postgres-registry-admission historical_pg_stage_is_not_an_admission_authority \
  -- --ignored --nocapture --test-threads=1
"""
