[package]
name = "ordivon-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Trusted-local Workspace execution, durable Job state, evidence, reconciliation, and recovery core for Ordivon."
publish = false

[features]
default = ["transactional-runtime"]
systemd-supervisor = ["dep:libc"]
universal-executor = ["dep:libc"]
transactional-runtime = ["universal-executor", "dep:rusqlite", "dep:uuid"]
operator-tools = ["transactional-runtime"]

[[bin]]
name = "ordivon-runtime-job-fixture"
path = "src/bin/ordivon-runtime-job-fixture.rs"
required-features = ["systemd-supervisor"]

[[bin]]
name = "ordivon-runtime-runner"
path = "src/bin/ordivon-runtime-runner.rs"
required-features = ["universal-executor"]

[[bin]]
name = "ordivon-runtime-doctor"
path = "src/bin/ordivon-runtime-doctor.rs"
required-features = ["operator-tools"]

[[bin]]
name = "ordivon-runtime-repair"
path = "src/bin/ordivon-runtime-repair.rs"
required-features = ["operator-tools"]

[[bin]]
name = "ordivon-runtime-inspect"
path = "src/bin/ordivon-runtime-inspect.rs"
required-features = ["operator-tools"]

[[bin]]
name = "ordivon-runtime-windows-deploy"
path = "src/bin/ordivon-runtime-windows-deploy.rs"
required-features = ["operator-tools"]

[dependencies]
hex.workspace = true
libc = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
uuid = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Services",
  "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1.7"
