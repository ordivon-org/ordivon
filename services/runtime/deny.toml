[advisories]
version = 2
# RUSTSEC-2023-0071 (Marvin Attack) is a timing sidechannel in RSA PKCS#1 v1.5
# decryption. Runtime pulls the `rsa` crate only through jsonwebtoken's
# rust_crypto feature for RS256 signature verification and never performs
# PKCS#1 v1.5 decryption, so the attack path is unreachable. Upstream offers no
# safe upgrade: PKCS#1 v1.5 decryption is inherently vulnerable and the
# mitigation is OAEP, which Runtime does not use.
# A newly issued INFO/Unmaintained notice (2026-11-17), NOT a known
# exploitable vulnerability. No patched chrono exists. Current users are
# transitive through the pinned MCP SDK and schema generator only; do not
# disable the other advisory checks or accept new chrono dependents.
# Pinned cargo-deny 0.20.2 only accepts id/reason here (not expiry/allow).
# Remove this single advisory ignore by 2026-12-31 after upstream review.
# This is a deliberately bounded manual review debt, NOT an enforced expiry.
ignore = [
  "RUSTSEC-2023-0071",
  { id = "RUSTSEC-2026-0543", reason = "2026-11-18: chrono is transitively required by rmcp 3.9.0 and schemars 1.2.3 with no fixed version; review upstream migration before 2026-12-31" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # webpki-roots: root-CA certificate DATA (not code), Mozilla-derived
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  # foldhash: permissive zlib license, same family as MIT/BSD
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
