[package]
name = "ordivon-host-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Rust Host semantic continuity MCP candidate (not installed)"

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = "=0.4.45"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.1"
hmac = "=0.13.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
axum = "=0.8.9"
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1"] }

[dev-dependencies]
getrandom = "=0.4.3"
