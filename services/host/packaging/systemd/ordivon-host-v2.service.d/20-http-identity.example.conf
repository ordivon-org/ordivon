# Install as /etc/systemd/system/ordivon-host-v2.service.d/20-http-identity.conf
# only after the operator provisions this encrypted credential.
# The same *plaintext secret bytes* must be available to Gateway via its
# independently loaded host-mcp-bearer credential.
[Service]
Environment=ORDIVON_HOST_V2_TRANSPORT=streamable-http
LoadCredentialEncrypted=host-mcp-bearer:/etc/ordivon/credentials/host-mcp-bearer.cred
Environment=ORDIVON_HOST_V2_BEARER_TOKEN_FILE=%d/host-mcp-bearer
