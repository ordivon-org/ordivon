# R27 protected reader: only this parallel Host loads the dedicated
# PostgreSQL SELECT-only identity. Never change or restart Legacy Host,
# Gateway or Peer as part of this separate role admission.
# Existing PostgreSQL GRANT/REVOKE is the permission authority.
# This does NOT harden legacy localhost pg_hba trust for other roles.
[Service]
EnvironmentFile=/etc/ordivon/host-v2-protected-reader.env
