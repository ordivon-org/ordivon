[project]
name = "ordivon-host-v2"
version = "0.10.0"
description = "External-first durable semantic continuity for Ordivon."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
  "alembic>=1.18.5,<2",
  "mcp>=2.3.0,<3",
  "psycopg[binary,pool]>=3.3.6,<4",
  "pydantic>=2,<3",
  "rfc8785>=0.1.4,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pytest>=9.2,<10",
  "ruff>=0.15,<1",
  "testcontainers[postgres]>=4,<5",
]
formal = [
    "crosshair-tool>=0.0.112,<0.1",
    "z3-solver>=5.3.2.0,<6",
]

[project.scripts]
ordivon-host-v2-mcp = "ordivon_host_v2.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "UP"]
