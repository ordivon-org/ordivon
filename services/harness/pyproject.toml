[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-harness"
version = "0.6.0"
description = "Caller-neutral Agent Run execution, durable Tool/Provider continuity, and Runtime bridging for Ordivon."
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx==0.28.1",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[dependency-groups]
dev = ["ruff==0.15.17"]
test = [
  "mcp==2.2.0",
  "uvicorn==0.52.1",
  "playwright==1.63.0",
  "rfc8785==0.1.4",
  "pytest==9.1.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[project.scripts]
ordivon-harness = "ordivon_harness.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-harness"
Issues = "https://github.com/zycxfyh/ordivon-harness/issues"
Documentation = "https://github.com/zycxfyh/ordivon-harness#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
