[package]
name = "ordivon-harness-loop-b-probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Reuse A's sealed canonical representation; no B-owned codec or Store.
ordivon-harness-core = { path = "../../crates/harness-core" }
# Consume the only A-owned read-only PG Reader; no B-owned SQL or Writer.
ordivon-harness-pg = { path = "../../crates/harness-pg" }
postgres = "0.19.14"
