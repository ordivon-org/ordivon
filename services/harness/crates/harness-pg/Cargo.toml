[package]
name = "ordivon-harness-pg"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Read-only PostgreSQL v1 Journal qualification for the Rust Ordivon Harness"

[dependencies]
ordivon-harness-core = { path = "../harness-core" }
postgres = "0.19.14"
# Mature offline Draft 2020-12 meta-schema validation; no HTTP/file retrievers.
jsonschema = { version = "0.61.1", default-features = false, features = ["arbitrary-precision"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
