[package]
name = "ordivon-harness-loop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Reuse A's sealed canonical representation; no B-owned codec or Store.
ordivon-harness-core = { path = "../harness-core" }
# Consume the only A-owned read-only PG Reader; no B-owned SQL or Writer.
ordivon-harness-pg = { path = "../harness-pg" }
postgres = "0.19.14"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Reuse the exact PG owner's offline Draft 2020-12 validator, no remote fetch.
jsonschema = { version = "0.61.1", default-features = false, features = ["arbitrary-precision"] }
