schema_version = 1
role = "ordivon-harness-agent-automation"

[agent_automation]
state_root = "/root/.local/state/ordivon-workstation/agent-automation/state"
mcp_config = "/etc/ordivon/agent-automation-browserless.json"
mcp_token_file = "/etc/ordivon/agent-automation-mcp.token"
mcp_bind = "127.0.0.1"
mcp_port = 8896
mcp_runtime_python = "/root/.local/share/ordivon-workstation/agent-automation-mcp-v1/.venv/bin/python"
mcp_python_version = "3.14.7"
mcp_requirements = "config/agent-automation-mcp-requirements.txt"
mcp_unit = "ordivon-agent-automation-mcp.service"
materialization_carrier = "windows-user-browser"

[agent_automation.browserless_network]
kind = "network-v2"
name = "browserless-prod"
namespace = "nv2-browserless-prod"
service_unit = "network-v2-browserless.target"
receipt = "/var/lib/network-v2/browserless-cutover/production-cutover.json"

[agent_automation.windows_user_browser]
gateway_url = "http://127.0.0.1:8899/mcp"
workspace_id = "ws-user-browser-prod-r1-20260922"
powershell_path = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
driver_path = "C:\\ProgramData\\Ordivon\\chat-ingress\\windows_user_browser_chatgpt.ps1"
proxy_url = "http://127.0.0.1:19081"
linux_stage_root = "/mnt/c/ProgramData/Ordivon/chat-ingress"
windows_stage_root = "C:\\ProgramData\\Ordivon\\chat-ingress"
timeout_ms = 150000
