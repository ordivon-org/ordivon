[tools]
powershell = "7.6.8"
python = "3.15.1"
uv = "0.13.5"

[tasks.verify]
run = """
set -euo pipefail
test -x /bin/bash
test -x /usr/bin/awk
test -x /usr/bin/rg
uv sync --locked
uv run python scripts/check_runtime_search_profile.py
uv lock --check
uv run python -m compileall -q src tests scripts evals
uv run --locked ruff check src tests scripts
mise run formal:verify
# Provider transports reject ambient non-loopback proxies; hermetic
# unit/queue tests must not inherit the host network proxy.
env -u HTTPS_PROXY -u https_proxy -u HTTP_PROXY -u http_proxy \
    -u ALL_PROXY -u all_proxy -u NO_PROXY -u no_proxy \
    uv run python -W error::ResourceWarning -m pytest -q tests
uv run python scripts/check_dependencies.py
# uv.lock is the single dependency authority. Export its runtime-only hashed
# closure for official pip-audit; do not hand-maintain a second snapshot.
tmp=$(mktemp -d -t ordivon-harness-verify-XXXXXX)
trap 'rm -rf "$tmp"' EXIT
uv export --locked --no-default-groups --no-emit-project --format requirements-txt > "$tmp/runtime-requirements.txt"
uvx pip-audit --disable-pip --require-hashes -r "$tmp/runtime-requirements.txt" --strict --progress-spinner off
uv run python scripts/check_docs.py
uv run python scripts/check_evidence.py
uv run python scripts/demo_deterministic_run.py
rm -rf build
uv build --wheel --out-dir "$tmp"
wheel=$(find "$tmp" -maxdepth 1 -type f -name '*.whl' -print -quit)
test -n "$wheel"
uv run python scripts/check_wheel.py "$wheel"
"""

# GitHub merge-group gate. Node-local provider/equipment realization remains
# outside queue admission; queue keeps the complete hermetic/source-level suite.
[tasks.queue]
run = """
set -euo pipefail
uv sync --locked
uv lock --check
uv run python -m compileall -q src tests scripts evals
uv run --locked ruff check src tests scripts
mise run formal:verify
# Provider transports reject ambient non-loopback proxies; hermetic
# unit/queue tests must not inherit the host network proxy.
env -u HTTPS_PROXY -u https_proxy -u HTTP_PROXY -u http_proxy \
    -u ALL_PROXY -u all_proxy -u NO_PROXY -u no_proxy \
    uv run python -W error::ResourceWarning -m pytest -q -m "not node_qualification" tests
uv run python scripts/check_dependencies.py
# uv.lock is the single dependency authority. Export its runtime-only hashed
# closure for official pip-audit; do not hand-maintain a second snapshot.
tmp=$(mktemp -d -t ordivon-harness-verify-XXXXXX)
trap 'rm -rf "$tmp"' EXIT
uv export --locked --no-default-groups --no-emit-project --format requirements-txt > "$tmp/runtime-requirements.txt"
uvx pip-audit --disable-pip --require-hashes -r "$tmp/runtime-requirements.txt" --strict --progress-spinner off
uv run python scripts/check_docs.py
uv run python scripts/check_evidence.py
uv run python scripts/demo_deterministic_run.py
rm -rf build
uv build --wheel --out-dir "$tmp"
wheel=$(find "$tmp" -maxdepth 1 -type f -name '*.whl' -print -quit)
test -n "$wheel"
uv run python scripts/check_wheel.py "$wheel"
"""

# Exact local-node qualification. This is intentionally not a GitHub merge-group
# prerequisite because it consumes materialized machine/provider authority.
[tasks.node-qualification]
run = """
set -euo pipefail
test -x /bin/bash
test -x /usr/bin/awk
test -x /usr/bin/rg
uv sync --locked
uv run python scripts/check_runtime_search_profile.py
uv run python -W error::ResourceWarning -m pytest -q -m node_qualification tests
"""

[tasks."formal:verify"]
description = "Native bounded Provider Call TLC via upstream digest-verified tool"
run = """
set -euo pipefail
runtime_root="$(realpath ../../services/runtime)"
cached_jar="$(python3 - "$runtime_root" <<'PY_JAR'
import json
from pathlib import Path
import sys
root = Path(sys.argv[1])
lock = json.loads((root / "formal/toolchain.lock.json").read_text())
print((root / lock["cacheRelativePath"]).resolve())
PY_JAR
)"
if ! printenv ORDIVON_TLA_TOOLS_JAR >/dev/null; then
  if [[ ! -f "$cached_jar" ]]; then
    "$runtime_root/scripts/tla-formal" bootstrap
  fi
  export ORDIVON_TLA_TOOLS_JAR="$cached_jar"
fi
"$runtime_root/scripts/tla-formal" verify
(
  cd formal
  java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tla2sany.SANY ProviderClaimR1.tla
  java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config ProviderClaimR1.cfg ProviderClaimR1.tla
  probe_output="$(mktemp)"
  trap 'rm -f "$probe_output"' EXIT
  for spec in "ack:UnacknowledgedPhysicalCallIsUnreachable" "expiry:ClaimReplacementIsUnreachable" "delivery:DeliveryIsUnreachable"; do
    IFS=: read -r label predicate <<< "$spec"
    if java -XX:+UseParallelGC -cp "$ORDIVON_TLA_TOOLS_JAR" tlc2.TLC -workers 1 -config "ProviderClaimR1.$label-probe.cfg" ProviderClaimR1.tla >"$probe_output" 2>&1; then
      echo "Harness $label counterexample probe unexpectedly passed" >&2
      exit 1
    fi
    if ! grep -Fq "Error: Invariant $predicate is violated." "$probe_output"; then
      cat "$probe_output" >&2
      echo "Harness $label probe produced no exact counterexample" >&2
      exit 1
    fi
    echo "Harness $label counterexample: PASS"
  done
)
"""
