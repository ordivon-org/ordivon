<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AX Generalization R1</title>
<style>
body{font-family:system-ui;margin:20px;line-height:1.35}
section,article,form,[role="group"]{border:1px solid #bbb;padding:12px;margin:10px 0}
button,input,select,a,[role]{margin:4px;padding:4px}
.hidden{display:none}
#shadow-host{display:block;border:1px dashed #888;padding:8px;margin-top:8px}
iframe{width:100%;height:180px;border:1px solid #999}
</style>
</head>
<body>
<h1>AX Generalization R1</h1>
<section aria-label="Native controls">
  <button id="native-button">Submit application</button>
  <a id="native-link" href="#grant">Open grant guide</a>
  <label><input id="check" type="checkbox" checked> Email updates</label>
  <label><input id="radio" type="radio" name="mode"> Remote participation</label>
  <label>Opportunity search <input id="search" type="search" value="AI internship"></label>
  <label>Applicant name <input id="text" type="text" value="Ada"></label>
  <label>Team size <input id="number" type="number" value="3"></label>
  <label>Readonly profile <input id="readonly" type="text" value="locked" readonly></label>
  <label>Password secret <input id="password" type="password" value="secret"></label>
  <label>Upload CV <input id="file" type="file"></label>
  <select id="track" aria-label="Track">
    <option selected>General</option>
    <option>Research</option>
    <option>Industry</option>
    <option disabled>Hidden track</option>
  </select>
  <button id="disabled" disabled>Disabled submit</button>
  <button id="hidden" class="hidden">Hidden submit</button>
  <details><summary id="summary">Advanced options</summary><p>More controls</p></details>
  <div contenteditable="true" id="editable" aria-label="Personal statement">Draft statement</div>
</section>
<section aria-label="ARIA widgets">
  <div role="switch" tabindex="0" aria-checked="false" aria-label="Enable alerts"></div>
  <div role="tablist" aria-label="Views">
    <button role="tab" aria-selected="true">Overview</button>
    <button role="tab" aria-selected="false">Deadlines</button>
  </div>
  <div role="menu" aria-label="Actions">
    <div role="menuitem" tabindex="0">Save draft</div>
    <div role="menuitemradio" tabindex="0" aria-checked="true">Private</div>
  </div>
  <div role="grid" aria-label="Opportunities">
    <div role="row">
      <div role="gridcell" tabindex="0">Scholarship cell</div>
      <div role="gridcell"><button>Nested cell button</button></div>
    </div>
  </div>
  <input role="combobox" aria-label="Keyword combobox" aria-expanded="false" value="agent">
  <div aria-disabled="true"><button id="aria-disabled-child">Blocked by ancestor</button></div>
</section>
<article aria-label="Context card">
  <p>HOUSTON · RESEARCH</p>
  <h2>Systems Fellowship</h2>
  <p>Deadline October 31 · fully funded</p>
  <button id="context-button">Apply to fellowship</button>
</article>

<dialog id="eligibility-dialog" open>
  <p>Eligibility confirmation required</p>
  <button id="dialog-confirm">Confirm eligibility</button>
</dialog>

<div inert>
  <button id="inert-action">Inert action</button>
</div>
<section aria-label="Shadow DOM">
  <div id="shadow-host"></div>
</section>
<section aria-label="Iframe">
  <iframe id="inner-frame" title="Embedded application"></iframe>
</section>
<script>
const host=document.getElementById('shadow-host');
const root=host.attachShadow({mode:'open'});
root.innerHTML='<article aria-label="Shadow opportunity"><p>REMOTE · SECURITY</p><h2>Shadow Internship</h2><button id="shadow-button">Apply in shadow</button><label>Shadow search <input type="search" value="sandbox"></label></article>';
const frame=document.getElementById('inner-frame');
frame.srcdoc='<!doctype html><html><body><article><p>FRAME · AI</p><h2>Frame Grant</h2><button id="frame-button">Apply in frame</button><label>Frame query <input type="text" value="vision"></label></article></body></html>';
</script>
</body>
</html>
