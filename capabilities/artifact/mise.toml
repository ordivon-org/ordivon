[tools]
powershell = "7.6.8"
python = "3.15"
uv = "latest"

[tasks.verify]
run = """
set -euo pipefail
export UV_PYTHON="$(command -v python)"
export ARTIFACT_OPENXML_VALIDATOR=/nonexistent/validate-openxml
export ARTIFACT_DOTNET=/nonexistent/dotnet
uv lock --check
uv sync --locked
uv run ruff check   artifact_core artifact_capabilities artifact_evidence artifact_operations   artifact_trust artifact_verification artifact_verifiers   scripts/artifact_agent_surface.py   scripts/artifact_deliver_html.py   scripts/artifact_delivery_toolchain_doctor.py scripts/artifact_verify.py   scripts/artifact_python_environment.py scripts/artifact_python_wrapper.py   scripts/artifact_oci_package.py scripts/artifact_temporal_support.py   scripts/artifact_temporal_workflow.py scripts/artifact_temporal_launch.py   scripts/artifact_temporal_worker.py scripts/artifact_temporal_deploy.py   scripts/publication_carrier_verify.py scripts/publication_perceptual_probe.py scripts/publication_perceptual_verify.py scripts/publication_perceptual_provider_exec.py   tests
uv run python artifact_verification/formal/verify_claim_coverage.py
uv run python artifact_verification/formal/verify_native_identity.py
uv run python artifact_verification/formal/verify_profile_refinement.py
uv run python -m pytest -m "not integration"
"""

# Portable merge gate and workstation-native lane use the same pytest suite.
# Integration tests are selected by their actual external prerequisites.
[tasks.queue]
run = "mise run verify"

[tasks.native]
run = """
set -euo pipefail
export UV_PYTHON="$(command -v python)"
uv lock --check
uv sync --locked
uv run python -m pytest -m "integration" "$@"
"""
