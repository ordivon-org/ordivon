[tools]
powershell = "7.6.8"
python = "3.15"
uv = "latest"

[tasks.verify]
run = """
set -euo pipefail
export UV_PYTHON="$(command -v python)"
export ARTIFACT_OPENXML_VALIDATOR=/nonexistent/validate-openxml
export ARTIFACT_DOTNET=/nonexistent/dotnet
uv lock --check
uv sync --locked
uv run ruff check   artifact_core artifact_capabilities artifact_evidence artifact_operations   artifact_trust artifact_verification artifact_verifiers   scripts/artifact_test_qualification.py   scripts/artifact_agent_surface.py   scripts/artifact_deliver_html.py   scripts/artifact_delivery_toolchain_doctor.py scripts/artifact_verify.py   scripts/artifact_python_environment.py scripts/artifact_python_wrapper.py   scripts/artifact_oci_package.py scripts/artifact_temporal_support.py   scripts/artifact_temporal_workflow.py scripts/artifact_temporal_launch.py   scripts/artifact_temporal_worker.py scripts/artifact_temporal_deploy.py   scripts/publication_carrier_verify.py scripts/publication_perceptual_probe.py scripts/publication_perceptual_verify.py scripts/publication_perceptual_provider_exec.py   tests
uv run python artifact_verification/formal/verify_claim_coverage.py
uv run python artifact_verification/formal/verify_native_identity.py
uv run python artifact_verification/formal/verify_profile_refinement.py
unset PYTEST_ADDOPTS PYTEST_PLUGINS
export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
uv run python -m pytest -m "not integration" -p hypothesis.extra.pytestplugin -p scripts.artifact_test_qualification --artifact-qualification=portable
"""

# Portable merge gate and workstation-native lane use the same pytest suite.
# Integration tests are selected by their actual external prerequisites.
[tasks.queue]
run = "mise run verify"

[tasks.native]
run = """
set -euo pipefail
export UV_PYTHON="$(command -v python)"
# Bind existing workstation-owned native carriers; preserve explicit caller selection.
export PLAYWRIGHT_BROWSERS_PATH="${PLAYWRIGHT_BROWSERS_PATH:-${ARTIFACT_PLAYWRIGHT_BROWSERS_PATH:-/opt/ordivon/external/artifact-toolchain/playwright-browsers/1.63.0}}"
if [ -z "${ARTIFACT_TEMPORAL_CLI:-}" ]; then
  ARTIFACT_TEMPORAL_CLI="$(command -v temporal || true)"
  export ARTIFACT_TEMPORAL_CLI="${ARTIFACT_TEMPORAL_CLI:-/opt/ordivon/external/temporal-cli/1.8.3/temporal}"
fi
uv lock --check
uv sync --locked
unset PYTEST_ADDOPTS PYTEST_PLUGINS
export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
uv run python -m pytest -m "integration and not historical" -p hypothesis.extra.pytestplugin -p scripts.artifact_test_qualification --artifact-qualification=native
"""


[tasks.historical]
run = """
set -euo pipefail
export UV_PYTHON="$(command -v python)"
uv lock --check
uv sync --locked
unset PYTEST_ADDOPTS PYTEST_PLUGINS
export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
uv run python -m pytest -m "historical" -p hypothesis.extra.pytestplugin -p scripts.artifact_test_qualification --artifact-qualification=historical
"""
