<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="82%" cy="20%" r="62%">
      <stop offset="0" stop-color="#9187ff" stop-opacity="0.20"/>
      <stop offset="0.48" stop-color="#9187ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9187ff"/>
      <stop offset="1" stop-color="#70cba2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0e14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 78 H1200 M0 552 H1200" stroke="#e2e7ef" stroke-opacity="0.10"/>
  <path d="M790 0 V630" stroke="#e2e7ef" stroke-opacity="0.08"/>

  <!-- brand -->
  <g transform="translate(72 72)">
    <rect width="36" height="36" fill="none" stroke="#9187ff" stroke-width="2"/>
    <rect x="8" y="8" width="9" height="9" fill="#9187ff"/>
    <rect x="19" y="8" width="9" height="9" fill="#70cba2"/>
    <rect x="8" y="19" width="9" height="9" fill="#e2e7ef" fill-opacity="0.82"/>
    <text x="52" y="25" fill="#e2e7ef" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" letter-spacing="2.2">ORDIVON</text>
  </g>

  <!-- headline -->
  <text x="72" y="215" fill="#e2e7ef" font-family="DejaVu Sans, sans-serif" font-size="80" font-weight="700" letter-spacing="-3.2">
    <tspan x="72" dy="0">DURABLE WORK</tspan>
    <tspan x="72" dy="86">FOR AI AGENTS</tspan>
  </text>

  <!-- statement -->
  <text x="74" y="406" fill="#bdc6d3" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400">
    <tspan x="74" dy="0">Durable work, replaceable intelligence,</tspan>
    <tspan x="74" dy="37">evidence that survives interruption.</tspan>
  </text>

  <!-- continuity motif -->
  <g transform="translate(836 142)">
    <text x="0" y="0" fill="#7f8a9a" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2">TASK CONTINUES ACROSS</text>
    <line x1="2" y1="94" x2="286" y2="94" stroke="url(#rail)" stroke-width="5"/>
    <circle cx="2" cy="94" r="8" fill="#9187ff"/>
    <circle cx="286" cy="94" r="8" fill="#70cba2"/>

    <g fill="#111620" stroke="#e2e7ef" stroke-opacity="0.22">
      <rect x="32" y="56" width="68" height="76" rx="4"/>
      <rect x="112" y="56" width="76" height="76" rx="4"/>
      <rect x="200" y="56" width="84" height="76" rx="4"/>
    </g>
    <g fill="#bdc6d3" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle" letter-spacing="1.1">
      <text x="66" y="84">MODEL</text>
      <text x="150" y="84">PROCESS</text>
      <text x="242" y="84">PROVIDER</text>
    </g>
    <g fill="#7f8a9a" font-family="DejaVu Sans, sans-serif" font-size="15">
      <text x="0" y="164">The carrier may change.</text>
      <text x="0" y="189" fill="#e2e7ef">The work does not lose its meaning.</text>
    </g>
  </g>

  <!-- footer -->
  <text x="72" y="586" fill="#7f8a9a" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="1.2">TASK CONTINUITY · RECOVERABLE EVIDENCE</text>
  <text x="1128" y="586" text-anchor="end" fill="#b2abff" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="1.2">ORDIVON.COM</text>
</svg>
