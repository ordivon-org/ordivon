[tools]
powershell = "7.6.7"
node = "26.12.1"
python = "3.15.1"
uv = "0.13.5"
pnpm = "12.15.0"
shellcheck = "0.11.0"

[tasks.verify]
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm bootstrap:python
.venv/bin/ruff check .
pnpm check
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""
