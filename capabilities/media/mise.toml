[tools]
powershell = "7.6.8"
node = "26.12.1"
python = "3.15.1"
uv = "0.13.5"
pnpm = "12.16.1"
shellcheck = "0.11.0"

[tasks.verify]
run = """
set -euo pipefail
pnpm install --frozen-lockfile
pnpm bootstrap:python
.venv/bin/ruff check .
pnpm check
python -m unittest discover -s media-v2/tests -p 'test_media_v2_owner_tool_resolution.py'
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
"""

[tasks."pg:verify"]
run = """
set -euo pipefail
test -n "${ORDIVON_MEDIA_TRIAL_TEST_DSN:-}" || { echo 'PG test DSN required; skipped tests do not qualify' >&2; exit 2; }
.venv/bin/python -m unittest discover -s tests -p 'test_research_validity.py' -v
"""
