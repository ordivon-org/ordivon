# Archivematica local operational overlay R11

# R11 host-port authority: keep WSL/Docker published ports below the default Windows dynamic TCP range.
# Docker Compose !override is required so provider-base 620xx mappings are replaced, not appended.
services:
  mysql:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:42001:3306"
  archivematica-storage-service:
    restart: unless-stopped
    volumes:
      - "/var/lib/ordivon/creative-preservation/r7-secondary-store:/mnt/r7-secondary"
      - "/opt/ordivon/external/unar/1.10.8/bin/unar:/usr/local/bin/unar:ro"
      - "/opt/ordivon/external/unar/1.10.8/bin/lsar:/usr/local/bin/lsar:ro"
  clamavd:
    image: "clamav/clamav-debian:1.4.6@sha256:9806fde5ff2fa1499a39f8570a86f5011233dcb74627d7d9d9b859d74b0a4b66"
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:42006:3310"
  gearmand:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:42004:4730"
  elasticsearch:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:42002:9200"
  archivematica-dashboard:
    restart: unless-stopped
  archivematica-mcp-client:
    restart: unless-stopped
  archivematica-mcp-server:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
    ports: !override
      - "42080:80"
      - "42081:8000"
