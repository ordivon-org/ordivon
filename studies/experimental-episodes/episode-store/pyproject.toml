[project]
name = "ordivon-experimental-episode-store"
version = "0.1.0"
description = "Task-local PostgreSQL analytical consumer for Experimental Episode projections."
requires-python = "==3.15.1"
dependencies = [
  "alembic==1.18.5",
  "psycopg[binary]==3.3.6",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
test = ["pytest==9.1.1"]
quality = ["ruff==0.17.2"]

[project.scripts]
ordivon-episode-store = "ordivon_experimental_episode_store.ingest:main"
ordivon-episode-analyze = "ordivon_experimental_episode_store.analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordivon_experimental_episode_store"]

[tool.uv]
default-groups = ["test", "quality"]
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
