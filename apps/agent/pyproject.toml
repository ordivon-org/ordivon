[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-agent-app"
version = "0.1.0"
description = "Non-authoritative product composition and lowering for bounded Ordivon Agent Runs."
requires-python = "==3.14.7"
dependencies = [
  "ordivon-composition",
  "ordivon-harness",
]

[tool.uv.sources]
ordivon-composition = { path = "../../packages/composition", editable = true }
ordivon-harness = { path = "../../services/harness", editable = true }

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
