[package]
name = "ordivon-web-note-pg"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "Native async PostgreSQL Human Note domain slice; not an authentication entrypoint"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "process", "sync"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.22"
thiserror = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "original-uri"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
