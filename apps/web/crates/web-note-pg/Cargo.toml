[package]
name = "ordivon-web-note-pg"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "Native async PostgreSQL Human Note domain slice; not an authentication entrypoint"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
