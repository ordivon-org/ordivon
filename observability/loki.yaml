auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Grafana's production baseline is 10 MB/s with a 20 MB burst. This single-node
  # Operations slice must absorb bounded local backlog flushes after Loki downtime
  # without turning healthy buffered logs into 429 retry storms.
  ingestion_rate_strategy: global
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  unordered_writes: true
  shard_streams:
    enabled: true
    time_sharding_enabled: true
    time_sharding_ignore_recent: 40m

analytics:
  reporting_enabled: false
