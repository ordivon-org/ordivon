# Exactly one source-navigation class for every non-owner Git path; these
# classifications are NOT new verification owners, formal proof, LEGO identity,
# dynamic dependency closure, or permission to move/delete the source.
# Source revision consumers must read the manifest from THAT exact Git commit.
[[source_regions]]
name = "lego-specification-and-calculus"
description = "Recursive LEGO R2.1 normative mathematics and method source; source is not its installation or proof."
paths = [".agents/skills/recursive-lego-calculus/"]

[[source_regions]]
name = "agent-method-content"
description = "Method and domain Skill content, not the platform Skills discovery and binding service."
paths = [".agents/skills/"]
exclude = [".agents/skills/recursive-lego-calculus/"]

[[source_regions]]
name = "formal-methods-and-proof-adapters"
description = "Formal proof definitions, model-checker integrations and theorem toolchain adapters; not a universal math authority."
paths = ["tools/formal/"]

[[source_regions]]
name = "repository-source-engineering"
description = "Git and CI source mechanics, change impact, ownership projections and reproducible repository checks."
paths = ["tools/repo/"]

[[source_regions]]
name = "research-profiles-and-source-contracts"
description = "Research publication and qualification profiles; not the scientific truth or deployed execution service."
paths = ["meta/research/", "profiles/research/", "tests/catalogs/"]

[[source_regions]]
name = "architecture-contract-and-evidence-records"
description = "Architecture descriptions, contracts and historical evidence; source membership does not establish currency."
paths = ["docs/architecture/"]

[[source_regions]]
name = "migration-history-and-retirement-records"
description = "Historical migrations, recorded retirement and retrospectives; not current implementation authority."
paths = ["docs/migration/", "docs/retro/"]

[[source_regions]]
name = "repository-configuration-and-automation"
description = "Repository-wide build entrypoints, CI, governance, maintenance and top-level human/agent navigation."
paths = [".github/", ".gitignore", ".gitleaksignore", "AGENTS.md", "README.md", "mise.toml", "renovate.json"]
