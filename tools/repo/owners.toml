schema_version = 1
kind = "ordivon.repo-owner-manifest"
truth_role = "repository-mechanics-only-not-domain-authority"

[[owners]]
name = "next"
root = "meta/next/"
verify_task = "next:verify"

[[owners]]
name = "composition"
root = "packages/composition/"
verify_task = "composition:verify"

[[owners]]
name = "control-plugin"
root = "extensions/ordivon-control-plane/"
verify_task = "control-plugin:verify"

[[owners]]
name = "runtime"
root = "services/runtime/"
verify_task = "runtime:verify"

[[owners]]
name = "host"
root = "services/host/"
verify_task = "host:verify"
queue_verify_task = "host:queue"

[[owners]]
name = "harness"
root = "services/harness/"
verify_task = "harness:verify"
queue_verify_task = "harness:queue"

[[owners]]
name = "gateway"
root = "services/gateway/"
verify_task = "gateway:verify"

[[owners]]
name = "skills"
root = "platform/skills/"
verify_task = "skills:verify"

[[owners]]
name = "security"
root = "platform/security/"
verify_task = "security:verify"

[[owners]]
name = "workstation"
root = "platform/workstation/"
verify_task = "workstation:ci"

[[owners]]
name = "network"
root = "platform/network/"
verify_task = "network:ci"

[[owners]]
name = "artifact"
root = "capabilities/artifact/"
verify_task = "artifact:verify"
queue_verify_task = "artifact:queue"

[[owners]]
name = "distribution"
root = "capabilities/distribution/"
verify_task = "distribution:verify"

[[owners]]
name = "media"
root = "capabilities/media/"
verify_task = "media:verify"

[[owners]]
name = "preservation"
root = "capabilities/preservation/"
verify_task = "preservation:verify"

[[owners]]
name = "game"
root = "domains/game/"
verify_task = "game:verify"

[[owners]]
name = "capital"
root = "domains/capital/"
verify_task = "capital:verify"

[[owners]]
name = "web"
root = "apps/web/"
verify_task = "web:verify"


# Git source layout facets, NOT Repo Owners, LEGO identities or a Registry.
# Longest-prefix match only expresses location and carrier role.
# No new physical path or source is silently classified.
[[source_areas]]
name = "lego-calculus-core"
root = ".agents/skills/recursive-lego-calculus/"
role = "NORMATIVE_METHOD_SPEC"

[[source_areas]]
name = "portable-agent-skills"
root = ".agents/skills/"
role = "PORTABLE_SKILL_SOURCE"

[[source_areas]]
name = "repository-mechanics"
root = "tools/repo/"
role = "REPOSITORY_MECHANICS"

[[source_areas]]
name = "formal-tool-adapters"
root = "tools/formal/"
role = "MATURE_FORMAL_VERIFIER_ADAPTERS"

[[source_areas]]
name = "research-publication-seams"
root = "meta/research/"
role = "RESEARCH_PUBLICATION_CONTRACT"

[[source_areas]]
name = "research-tool-profiles"
root = "profiles/research/"
role = "RESEARCH_TOOL_QUALIFICATION_PROFILE"

[[source_areas]]
name = "cross-domain-catalog-tests"
root = "tests/"
role = "CROSS_DOMAIN_CONTRACT_TEST"

[[source_areas]]
name = "architecture-documents"
root = "docs/"
role = "SHARED_DOC_EVIDENCE_NOT_FORMAL"

[[source_areas]]
name = "repository-ci"
root = ".github/"
role = "REPOSITORY_CI_CONFIGURATION"

[[source_areas]]
name = "repository-root-config"
files = [".gitignore", ".gitleaksignore", "AGENTS.md", "README.md", "mise.toml", "renovate.json"]
role = "REPOSITORY_ROOT_CONFIGURATION"
