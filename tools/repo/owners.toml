schema_version = 1
kind = "ordivon.repo-owner-manifest"
truth_role = "repository-mechanics-only-not-domain-authority"

# Recursive LEGO R2.1: independent method/contract *source* already consumed
# by the existing project Skill resolver. This is NOT a second math kernel,
# proof authority, execution service, or human Agent approver.
# Repo and formal engines already have independent source interfaces and
# native consumer verification; declare their existing physical boundaries.
[[owners]]
name = "next"
source_subregions = [
  { name = "next-authority-catalog", path = "authorities/", description = "Source-side authority data, not installed provider truth." },
  { name = "next-authority-observation-records", path = "authorities/observations/", description = "Observations and captures, not authoritative issuer state." },
  { name = "next-authority-source-records", path = "authorities/records/", description = "Source records and declared identity bindings." },
  { name = "next-evidence-corpus", path = "evidence/", description = "Historical evidence carriers, not automatic current acceptance." },
  { name = "next-acceptance-records", path = "evidence/acceptance/", description = "Declared acceptance evidence and scopes." },
  { name = "next-data-lifecycle-receipts", path = "evidence/data-lifecycle/", description = "Lifecycle receipts and historical data state." },
  { name = "next-knowledge-source", path = "knowledge/", description = "Methods and knowledge source material." },
  { name = "next-knowledge-lessons", path = "knowledge/lessons/", description = "Recorded lessons, not executable skills by default." },
  { name = "next-knowledge-graph-records", path = "knowledge/graphs/", description = "Knowledge graph source and relationship declarations." },
  { name = "next-capability-metadata", path = "capabilities/", description = "Described capabilities and provider selection data." },
  { name = "next-provider-catalog", path = "capabilities/providers/", description = "Provider capability records, not installed availability." },
  { name = "next-domain-profiles", path = "domains/", description = "Domain profile declarations and legacy plans." },
  { name = "next-experiment-workspaces", path = "experiments/", description = "Experimental source, not production execution." },
  { name = "next-experimental-corpora", path = "experimental/", description = "Experimental prototype sources and fixtures." },
  { name = "next-migration-history", path = "migrations/", description = "Migration records and source rewrite history." },
  { name = "next-conformance-tests", path = "tests/", description = "Tests and negative acceptance fixtures." },
  { name = "next-source-operations", path = "scripts/", description = "Repository scripts, effects only on explicit execution." },
  { name = "next-reference-docs", path = "docs/", description = "Descriptive project reference documents." },
  { name = "next-historical-plans", path = "planning/", description = "Planning carriers, not current deployed capabilities." },
  { name = "next-declarative-policies", path = "policies/", description = "Task-local declarative policy source." },
  { name = "next-schema-contracts", path = "schemas/", description = "Schema source, separate from implementation and execution." },
  { name = "next-data-product-source", path = "data-products/", description = "Data product source declarations and receipts." },
  { name = "next-next-repository-ci", paths = [".github/"], description = "Next repository workflow source." },
  { name = "next-root-reference-instructions", paths = ["AGENTS.md", "README.md"], description = "Root package documentation, license and agent instructions; not installed effects." },
  { name = "next-root-build-and-toolchain-config", paths = [".gitignore", ".gitleaksignore", ".python-version", "mise.toml", "pyproject.toml", "uv.lock"], description = "Root toolchain, lockfile, package and repository configuration sources." },
]
semantic_label = "knowledge-and-method-integration"
semantic_scope = "Problem-solving methods and cross-domain composition research; no global execution, approval or verification authority."
root = "meta/next/"
verify_task = "next:verify"

# Semantic foundation is independently verified at its EXISTING source,
# rather than copying R2.1 mathematics into Repo, Composition or Gateway.
# Physical .agents/skills packaging is not a proof that methods execute effects.
# Native theorem provers and proof-oracle binaries are a different owner
# from the R2.1 logical specification and from product-specific proofs.
[[owners]]
name = "formal-toolchain"
source_subregions = [
  { name = "formal-lean-core-calculus", path = "RecursiveLegoRefinement.lean", description = "Lean mechanized mathematical statements, not implementation refinement." },
  { name = "formal-lean-change-frame", path = "RecursiveLegoVariationFrame.lean", description = "Lean checked change-frame model and counterexamples." },
  { name = "formal-toolchain-root-reference-instructions", paths = ["README.md"], description = "Root package documentation, license and agent instructions; not installed effects." },
  { name = "formal-toolchain-root-build-and-toolchain-config", paths = ["mise.toml"], description = "Root toolchain, lockfile, package and repository configuration sources." },
  { name = "formal-alloy-source", paths = ["Proof.als"], description = "Alloy relational model source." },
  { name = "formal-dafny-source", paths = ["Proof.dfy"], description = "Dafny verification model source." },
  { name = "formal-quint-source", paths = ["Proof.qnt"], description = "Quint state/temporal model source." },
  { name = "formal-rust-source", paths = ["Proof.rs"], description = "Rust model source, not automatically verified." },
  { name = "formal-kani-model-source", paths = ["ProofKani.rs"], description = "Kani symbolic Rust test harness source." },
  { name = "formal-native-verifier-driver", paths = ["verify.py"], description = "Existing native prover invocation and source digest checker." },
]
semantic_label = "native-formal-verification-toolchain"
semantic_scope = "Existing Lean SMT Kani Verus Dafny Alloy and TLA-adjacent verification adapters; not the R2.1 mathematics itself or an Agent approver."
root = "tools/formal/"
verify_task = "formal:verify"
queue_verify_task = "formal:source:verify"

[[owners]]
name = "lego-foundation"
source_subregions = [
  { name = "lego-mathematical-references", path = "references/", description = "Canonical R2.1 mathematical explanation source." },
  { name = "lego-core-skill-source", paths = ["SKILL.md"], description = "Canonical LEGO R2.1 procedural Skill source, not a proof or registry." },
]
semantic_label = "recursive-lego-r21-method-source"
semantic_scope = "Canonical R2.1 semantic Skill and formal reference source; not a separate execution engine, universal registry or verification approval authority."
root = ".agents/skills/recursive-lego-calculus/"
verify_task = "lego-foundation:verify"

