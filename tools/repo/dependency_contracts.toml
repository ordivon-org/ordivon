schema_version = 1
kind = "ordivon.repo-owner-dependency-contracts"
truth_role = "repository-boundary-policy-not-domain-authority"
scan_mode = "active-source-literal-seams"
# The existing Owner boundary checker also parses active Python AST imports
# against Owner-owned src/<package>/__init__.py roots. Public Python import
# exceptions require this same exact source_glob + full module + contract_ref;
# a comment or longer module prefix cannot qualify a private import.

# Source globs match complete, slash-delimited path segments; '*' cannot cross directories.
# These declarations authorize only the named literal seam in the named source files.
# They do not transfer truth ownership and do not authorize arbitrary access to the target owner.

[[seams]]
from_owner = "harness"
to_owner = "security"
source_glob = "services/harness/scripts/agent_automation_release.py"
allowed_fragment = "platform/security"
kind = "PUBLIC_OWNER_LOCATOR"
contract_ref = "docs/migration/acceptance/HARNESS_SECURITY_OWNER_CONSUMER_CUTOVER_ACCEPTANCE_20260921.md"

