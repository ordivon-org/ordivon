# Harness consumes only Runtime's SHA-verified public upstream checker.
[[seams]]
from_owner = "harness"
to_owner = "runtime"
source_glob = "services/harness/mise.toml"
allowed_fragment = "../../services/runtime"
kind = "PUBLIC_PINNED_FORMAL_TOOLCHAIN"
contract_ref = "services/runtime/formal/README.md"

# Public digest-verified upstream Formal toolchain; not Runtime Job/Attempt state.
[[seams]]
from_owner = "composition"
to_owner = "runtime"
source_glob = "packages/composition/mise.toml"
allowed_fragment = "../../services/runtime"
kind = "PUBLIC_PINNED_FORMAL_TOOLCHAIN"
contract_ref = "services/runtime/formal/README.md"


# P0 bounded source contract: Composition tests derive owner source paths from
