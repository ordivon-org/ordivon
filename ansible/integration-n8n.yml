---
- name: Operations v2 n8n integration edge
  hosts: operations_local
  become: true
  gather_facts: false
  vars:
    operations_postgres_port: 55434
    operations_postgres_socket: /var/lib/postgres/ordivon-data-r5-pg-14550-v4
    n8n_db_name: n8n
    n8n_db_user: n8n
    n8n_config_dir: /etc/n8n
    n8n_env_file: /etc/n8n/n8n.env
    n8n_secret_file: /etc/n8n/n8n-secrets.env
    n8n_package_link: /root/tools/bin/n8n
  tasks:
    - name: Verify Workstation-owned n8n materialization exists
      ansible.builtin.stat:
        path: "{{ n8n_package_link }}"
        follow: true
      register: n8n_package

    - name: Refuse to invent an n8n binary authority
      ansible.builtin.assert:
        that:
          - n8n_package.stat.exists
          - n8n_package.stat.executable
        fail_msg: Workstation must materialize /root/tools/bin/n8n before Operations may own its service lifecycle.

    - name: Resolve immutable n8n executable selected by Workstation
      ansible.builtin.command:
        argv: [/usr/bin/readlink, -f, "{{ n8n_package_link }}"]
      register: n8n_realpath
      changed_when: false

    - name: Bind exact n8n executable for the systemd unit
      ansible.builtin.set_fact:
        n8n_binary_realpath: "{{ n8n_realpath.stdout }}"

    - name: Keep dedicated n8n service account
      ansible.builtin.user:
        name: n8n
        system: true
        shell: /usr/bin/nologin
        home: /var/lib/n8n
        create_home: false

    - name: Keep n8n state directory private
      ansible.builtin.file:
        path: /var/lib/n8n
        state: directory
        owner: n8n
        group: n8n
        mode: "0700"

    - name: Keep n8n configuration directory root-owned
      ansible.builtin.file:
        path: "{{ n8n_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Check local n8n secret material
      ansible.builtin.stat:
        path: "{{ n8n_secret_file }}"
      register: n8n_secret_state

    - name: Generate n8n database and credential secrets once when absent
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        db_password="$(/usr/bin/openssl rand -hex 32)"
        encryption_key="$(/usr/bin/openssl rand -hex 32)"
        printf 'DB_POSTGRESDB_PASSWORD=%s\nN8N_ENCRYPTION_KEY=%s\n' "$db_password" "$encryption_key" > "{{ n8n_secret_file }}"
      args:
        executable: /usr/bin/bash
        creates: "{{ n8n_secret_file }}"
      no_log: true

    - name: Preserve root-only n8n secret permissions
      ansible.builtin.file:
        path: "{{ n8n_secret_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Read n8n secret material for PostgreSQL role reconciliation
      ansible.builtin.slurp:
        src: "{{ n8n_secret_file }}"
      register: n8n_secret_blob
      no_log: true

    - name: Extract n8n PostgreSQL password without publishing it
      ansible.builtin.set_fact:
        n8n_db_password: "{{ (n8n_secret_blob.content | b64decode | regex_search('DB_POSTGRESDB_PASSWORD=([^\\n]+)', '\\1'))[0] }}"
      no_log: true

    - name: Keep dedicated n8n PostgreSQL role
      community.postgresql.postgresql_user:
        name: "{{ n8n_db_user }}"
        password: "{{ n8n_db_password }}"
        login_user: postgres
        login_port: "{{ operations_postgres_port }}"
        login_unix_socket: "{{ operations_postgres_socket }}"
      become_user: postgres
      no_log: true

    - name: Keep dedicated n8n PostgreSQL database
      community.postgresql.postgresql_db:
        name: "{{ n8n_db_name }}"
        owner: "{{ n8n_db_user }}"
        login_user: postgres
        login_port: "{{ operations_postgres_port }}"
        login_unix_socket: "{{ operations_postgres_socket }}"
      become_user: postgres

    - name: Install canonical non-secret n8n configuration
      ansible.builtin.copy:
        src: ../integration/n8n.env
        dest: "{{ n8n_env_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart n8n

    - name: Install canonical n8n systemd unit bound to exact Nix store executable
      ansible.builtin.template:
        src: ../integration/n8n.service.j2
        dest: /etc/systemd/system/n8n.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart n8n

    - name: Converge systemd definitions before lifecycle checks
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the single canonical n8n integration edge
      ansible.builtin.systemd_service:
        name: n8n.service
        enabled: true
        state: started

    - name: Wait for loopback n8n health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:5678/healthz
        method: GET
        status_code: 200
      register: n8n_health
      retries: 30
      delay: 1
      until: n8n_health.status == 200
      changed_when: false

    - name: Verify n8n database is initialized
      ansible.builtin.command:
        argv:
          - /usr/bin/psql
          - -p
          - "{{ operations_postgres_port | string }}"
          - -h
          - "{{ operations_postgres_socket }}"
          - -d
          - "{{ n8n_db_name }}"
          - -Atqc
          - "select count(*) from pg_catalog.pg_tables where schemaname='public';"
      become_user: postgres
      register: n8n_table_count
      changed_when: false

    - name: Refuse n8n false-green before schema initialization
      ansible.builtin.assert:
        that:
          - n8n_table_count.stdout | int > 0
        fail_msg: n8n HTTP health is insufficient; PostgreSQL schema has not initialized.

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart n8n
      ansible.builtin.systemd_service:
        name: n8n.service
        state: restarted
