name: network-v2-smoke
topology:
  nodes:
    client:
      kind: linux
      image: alpine:3.22
    router:
      kind: linux
      image: alpine:3.22
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    target:
      kind: linux
      image: alpine:3.22
  links:
    - endpoints: ["client:eth1", "router:eth1"]
    - endpoints: ["router:eth2", "target:eth1"]
