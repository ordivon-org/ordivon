version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directories:
      - "/capabilities/artifact"
      - "/capabilities/artifact/artifact-delivery/python-uv"
      - "/capabilities/distribution"
      - "/capabilities/media"
      - "/domains/capital"
      - "/meta/next"
      - "/platform/security"
      - "/platform/skills"
      - "/platform/workstation"
      - "/services/gateway"
      - "/services/harness"
      - "/services/host"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - "/capabilities/artifact/artifact-delivery/node"
      - "/capabilities/media"
      - "/domains/game"
      - "/platform/security/labs/agent-admission-rs"
      - "/platform/workstation/providers/cloudflare"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/services/runtime"
    schedule:
      interval: weekly
