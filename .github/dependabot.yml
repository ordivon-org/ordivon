version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directories:
      - "/capabilities/artifact"
      - "/capabilities/artifact/artifact-delivery/python-uv"
      - "/capabilities/distribution"
      - "/capabilities/media"
      - "/domains/capital"
      - "/meta/next"
      - "/meta/next/experimental/episode-store-r1"
      - "/packages/composition"
      - "/platform/security"
      - "/platform/skills"
      - "/platform/workstation"
      - "/services/gateway"
      - "/services/harness"
      - "/services/host"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - "/apps/web"
      - "/capabilities/artifact/artifact-delivery/node"
      - "/capabilities/media"
      - "/domains/game"
      - "/platform/security/contracts/agent-request-verifier-v1"
      - "/platform/security/labs/agent-admission-rs"
      - "/platform/workstation/providers/cloudflare"
      - "/platform/workstation/workstation/nix/codex-cli"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/services/runtime"
    schedule:
      interval: weekly

  # Official Dependabot Nix flake version updates; installation remains gated.
  - package-ecosystem: nix
    directories:
      - "/platform/workstation/workstation/nix"
      - "/capabilities/artifact/artifact-delivery/openxml-nix"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
