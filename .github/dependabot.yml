version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Python PEP 621 and uv.lock are updated by Renovate; avoid competing bots.

  - package-ecosystem: npm
    directories:
      - "/apps/web"
      - "/capabilities/artifact/artifact-delivery/node"
      - "/capabilities/media"
      - "/domains/game"
      - "/platform/security/contracts/agent-request-verifier-v1"
      - "/platform/security/labs/agent-admission-rs"
      - "/platform/workstation/providers/cloudflare"
      - "/platform/workstation/workstation/nix/codex-cli"
    schedule:
      interval: weekly
    groups:
      same-dependency:
        group-by: dependency-name

  - package-ecosystem: cargo
    directory: "/services/runtime"
    schedule:
      interval: weekly

  # Official Dependabot Nix flake version updates; installation remains gated.
  - package-ecosystem: nix
    directories:
      - "/platform/workstation/workstation/nix"
      - "/capabilities/artifact/artifact-delivery/openxml-nix"
    schedule:
      interval: weekly
    groups:
      same-dependency:
        group-by: dependency-name
    open-pull-requests-limit: 5
