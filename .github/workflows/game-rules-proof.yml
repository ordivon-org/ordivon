name: Game rule implementation proof

on:
  pull_request:
    paths:
      - "domains/game/examples/orbit-collector/src/rules.rs"
      - "domains/game/formal/**"
      - "domains/game/mise.toml"
      - ".github/workflows/game-rules-proof.yml"
  push:
    branches: [main]
    paths:
      - "domains/game/examples/orbit-collector/src/rules.rs"
      - "domains/game/formal/**"
      - "domains/game/mise.toml"
      - ".github/workflows/game-rules-proof.yml"

permissions:
  contents: read

jobs:
  orbit-kani:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Verify real Rust rules with upstream Kani 0.68.0
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          command: 'kani'
          working-directory: './domains/game'
          args: 'examples/orbit-collector/src/rules.rs'
