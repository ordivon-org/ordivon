name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv python install 3.14.7
      - run: uv lock --check
      - run: uv sync --locked
      - run: bash scripts/test-structure.sh
      - run: uv run python scripts/test-temporal-integration-boundary.py
      - run: uv run python scripts/test-approval-request.py
      - run: uv run python scripts/test-effect-authority-producer.py
      - run: bash scripts/test-effect-authority-entrypoint.sh
      - run: bash scripts/test-bound-entrypoint.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          version: v0.11.0
