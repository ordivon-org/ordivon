name: Monorepo Required

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 0"

permissions:
  contents: read

concurrency:
  group: monorepo-required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  root-verification:
    name: root-verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install monorepo toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.12
          install: true
          cache: true

      - name: Repository bounded secret scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            ORDIVON_SECRET_SCAN_CURRENT_TREE_ONLY=true ORDIVON_SECRET_SCAN_HEAD="$EVENT_HEAD" mise run repo:secrets:verify
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_GROUP_BASE"
          else
            base="$PUSH_BEFORE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "Secret-scan base revision is unavailable for event $EVENT_NAME." >&2
            exit 2
          fi

          ORDIVON_SECRET_SCAN_BASE="$base" ORDIVON_SECRET_SCAN_HEAD="$EVENT_HEAD" mise run repo:secrets:verify

      - name: Repository full-history secret assurance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: mise run repo:secrets:verify-full-history

      - name: Build Living Recursive LEGO View
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_GROUP_BASE"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
          fi
          living="$RUNNER_TEMP/ordivon-living-view.json"
          living_args=(--revision HEAD --output "$living")
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            living_args+=(--base "$base")
          fi
          python3 tools/repo/living_view.py "${living_args[@]}"
          {
            echo "### Living Recursive LEGO View"
            python3 - "$living" <<'PYVIEW'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          source = value["sourceView"]
          delta = value.get("deltaView")
          print(f"- view digest: {value['viewDigest']}")
          print(f"- source revision: {source['sourceRevision']}")
          print(f"- source tree: {source['sourceTree']}")
          information = source["informationCoverage"]
          info_coverage = information["coverage"]
          info_refs = information["referenceProjection"]["sourcePathStandingCounts"]
          print(f"- information tracked files: {info_coverage['trackedFiles']}")
          print(f"- information top-level kinds: {info_coverage['uniqueTopLevelKinds']}")
          print(f"- source refs exact: {info_refs.get('EXACT_UNIQUE', 0)}")
          print(f"- source refs ambiguous: {info_refs.get('AMBIGUOUS_EXACT', 0)}")
          print(f"- source refs unresolved: {info_refs.get('UNRESOLVED_IN_SOURCE_CUT', 0)}")
          if delta is None:
              print("- delta: source-only")
          else:
              invalidation = delta["sourceInvalidation"]
              requal = delta["verificationRequalification"]
              print(f"- delta standing: {invalidation['standing']}")
              print(f"- source invalidation owners: {', '.join(invalidation['ownerRefs']) or 'none'}")
              print(f"- verification requalification owners: {', '.join(requal['ownerRefs']) or 'none'}")
              print(f"- unclassified changed-path count: {len(delta['unclassifiedChangedPaths'])}")
          PYVIEW
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain Living Recursive LEGO View
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordivon-living-view-${{ github.sha }}
          path: ${{ runner.temp }}/ordivon-living-view.json
          if-no-files-found: error
          retention-days: 30

      - name: Repository mechanics
        run: mise run repo:ci

      - name: Select affected owners
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            mapfile -t owners < <(python3 tools/repo/affected_owners.py --all --format names)
            mapfile -t tasks < <(python3 tools/repo/affected_owners.py --all --format queue-tasks)
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE"
              head="$PR_HEAD"
            elif [[ "$EVENT_NAME" == "merge_group" ]]; then
              base="$MERGE_GROUP_BASE"
              head="$MERGE_GROUP_HEAD"
            else
              base="$PUSH_BEFORE"
              head="$EVENT_HEAD"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              mapfile -t owners < <(python3 tools/repo/affected_owners.py --all --format names)
              mapfile -t tasks < <(python3 tools/repo/affected_owners.py --all --format queue-tasks)
            else
              plan="$RUNNER_TEMP/ordivon-convergence-plan.json"
              python3 tools/repo/convergence_plan.py --base "$base" --head "$head" > "$plan"
              mapfile -t owners < <(
                python3 -c 'import json,sys; print(*json.load(open(sys.argv[1], encoding="utf-8"))["verificationOwners"], sep="\n")' "$plan"
              )
              mapfile -t tasks < <(
                python3 -c 'import json,sys; print(*json.load(open(sys.argv[1], encoding="utf-8"))["queueVerifyTasks"], sep="\n")' "$plan"
              )
            fi
          fi
          printf 'owners=%s\n' "$(IFS=,; echo "${owners[*]-}")" >> "$GITHUB_OUTPUT"
          runtime=false
          for selected in "${owners[@]-}"; do
            [[ "$selected" == "runtime" ]] && runtime=true
          done
          printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${tasks[@]-}" > "$RUNNER_TEMP/ordivon-affected-tasks.txt"
          {
            echo "### Affected owners"
            if (("${#owners[@]}" == 0)); then
              echo "Repository-only change; no owner verify task selected."
            else
              printf -- '- %s\n' "${owners[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/ordivon-convergence-plan.json" ]]; then
            {
              echo
              echo "### Convergence projection"
              echo '~~~json'
              cat "$RUNNER_TEMP/ordivon-convergence-plan.json"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify affected owners
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r task; do
            [[ -z "$task" ]] && continue
            echo "::group::mise run $task"
            mise run "$task"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/ordivon-affected-tasks.txt"

      - name: Runtime supply-chain policy
        if: steps.affected.outputs.runtime == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.95.0"
          manifest-path: services/runtime/Cargo.toml
          command: check
          arguments: --config services/runtime/deny.toml
