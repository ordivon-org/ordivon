name: Monorepo Required

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 0"

permissions:
  contents: read

concurrency:
  group: monorepo-required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  root-verification:
    name: root-verification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install monorepo toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.12
          # Avoid eager --monorepo tool installation: Owner queue tasks already
          # install their own toolchain only when the consumer selects them.
          install: false
          cache: true

      - name: Install root verification tools
        shell: bash
        run: |
          set -euo pipefail
          mise install

      - name: Install verified GNU Bash 5.3.20
        shell: bash
        run: |
          set -euo pipefail
          tools/repo/install_latest_stable_bash.sh "$RUNNER_TEMP/ordivon-bash-5.3.20"
          echo "$RUNNER_TEMP/ordivon-bash-5.3.20/bin" >> "$GITHUB_PATH"

      - name: Install pinned SQL validation CLIs
        shell: bash
        run: |
          set -euo pipefail
          tools/repo/install_sql_verifiers.sh "$RUNNER_TEMP/ordivon-sql-verifiers"
          echo "$RUNNER_TEMP/ordivon-sql-verifiers/bin" >> "$GITHUB_PATH"

      - name: Repository mechanics
        run: |
          "$RUNNER_TEMP/ordivon-bash-5.3.20/bin/bash" -c 'set -euo pipefail; mise run repo:ci'

      - name: Select affected owners
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          owners_file="$RUNNER_TEMP/ordivon-affected-owners.txt"
          tasks_file="$RUNNER_TEMP/ordivon-affected-tasks.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            python3 tools/repo/affected_owners.py --all --format names > "$owners_file"
            python3 tools/repo/affected_owners.py --all --format queue-tasks > "$tasks_file"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE"
              head="$PR_HEAD"
            elif [[ "$EVENT_NAME" == "merge_group" ]]; then
              base="$MERGE_GROUP_BASE"
              head="$MERGE_GROUP_HEAD"
            else
              base="$PUSH_BEFORE"
              head="$EVENT_HEAD"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              python3 tools/repo/affected_owners.py --all --format names > "$owners_file"
              python3 tools/repo/affected_owners.py --all --format queue-tasks > "$tasks_file"
            else
              plan="$RUNNER_TEMP/ordivon-convergence-plan.json"
              python3 tools/repo/convergence_plan.py --base "$base" --head "$head" > "$plan"
              python3 -c 'import json,sys; print(*json.load(open(sys.argv[1], encoding="utf-8"))["verificationOwners"], sep="\n")' "$plan" > "$owners_file"
              python3 -c 'import json,sys; print(*json.load(open(sys.argv[1], encoding="utf-8"))["queueVerifyTasks"], sep="\n")' "$plan" > "$tasks_file"
            fi
          fi
          mapfile -t owners < "$owners_file"
          mapfile -t tasks < "$tasks_file"
          # Empty JSON arrays are printed as one blank line by the CLI.
          # Only a truly empty scope may contain no executable tasks.
          if (( ${#owners[@]} == 1 )) && [[ -z "${owners[0]}" ]]; then owners=(); fi
          if (( ${#tasks[@]} == 1 )) && [[ -z "${tasks[0]}" ]]; then tasks=(); fi
          if (( ${#owners[@]} != ${#tasks[@]} )); then
            echo "Selected verification owners and executable tasks disagree." >&2
            exit 2
          fi
          # Consumer-selected tasks must match the provider-owned canonical
          # queue contract exactly. A same-namespace task can still skip the
          # queue's intended checks and cannot silently replace it.
          python3 - "$owners_file" "$tasks_file" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/repo")
          from affected_owners import OWNERS

          def read_selection(path):
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              return [] if lines == [""] else lines

          selected = read_selection(sys.argv[1])
          requested = read_selection(sys.argv[2])
          canonical = {owner.name: owner.queue_task for owner in OWNERS}
          if len(selected) != len(requested) or len(selected) != len(set(selected)):
              raise SystemExit("Selected owner/task identities are inconsistent")
          for owner, task in zip(selected, requested):
              if canonical.get(owner) != task:
                  raise SystemExit(
                      f"Selected task {task!r} violates consumer queue contract "
                      f"for {owner!r}: {canonical.get(owner)!r}"
                  )
          PY
          printf 'owners=%s\n' "$(IFS=,; echo "${owners[*]-}")" >> "$GITHUB_OUTPUT"
          runtime=false
          for selected in "${owners[@]-}"; do
            [[ "$selected" == "runtime" ]] && runtime=true
          done
          printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"
          {
            echo "### Affected owners"
            if (("${#owners[@]}" == 0)); then
              echo "Repository-only change; no owner verify task selected."
            else
              printf -- '- %s\n' "${owners[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/ordivon-convergence-plan.json" ]]; then
            {
              echo
              echo "### Convergence projection"
              echo '~~~json'
              cat "$RUNNER_TEMP/ordivon-convergence-plan.json"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify affected owners
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r task || [[ -n "$task" ]]; do
            [[ -z "$task" ]] && continue
            echo "::group::mise run $task"
            # The selected task must not consume the following queue entries.
            mise run "$task" </dev/null
            echo "::endgroup::"
          done < "$RUNNER_TEMP/ordivon-affected-tasks.txt"

      # Mathematically checked definitions are NOT repository Owners. They
      # still need their actual native verifier on every admitted source change;
      # CI success for repository mechanics never establishes a Lean theorem.
      - name: Verify native formal proof sources
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/ordivon-convergence-plan.json"
          # Empty/unavailable base cut (including schedule/manual dispatch)
          # conservatively verifies the complete native formal toolchain.
          if [[ -f "$plan" ]]; then
            selection="$(python3 - "$plan" <<'PY_FORMAL_SCOPE'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          paths = report.get("changedPaths")
          if not isinstance(paths, list) or not all(isinstance(p, str) for p in paths):
              raise SystemExit("invalid exact-cut formal change selection")
          native = [p for p in paths if p.startswith("tools/formal/")]
          if any(path != "tools/formal/RecursiveLegoRefinement.lean" for path in native):
              # The native bundle/toolchain changed; do not guess the proof scope.
              selection = "FULL"
          elif native or ".github/workflows/ci.yml" in set(paths):
              selection = "LEAN"
          else:
              selection = "SKIP"
          print(selection)
          PY_FORMAL_SCOPE
            )"
          else
            selection="FULL"
          fi
          case "$selection" in
            SKIP)
              echo "No native formal proof source changed; no proof checked."
              ;;
            LEAN)
              (
                cd tools/formal
                mise install github:leanprover/lean4@4.35.0
                mise exec -- lean RecursiveLegoRefinement.lean
              )
              ;;
            FULL)
              (
                cd tools/formal
                mise install
              )
              mise run formal:verify
              ;;
            *)
              echo "Unknown exact-cut formal verification scope" >&2
              exit 1
              ;;
          esac

      - name: Runtime supply-chain policy
        if: steps.affected.outputs.runtime == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.99.1"
          manifest-path: services/runtime/Cargo.toml
          command: check
          arguments: --config services/runtime/deny.toml

      - name: Repository-wide secret scan
        run: mise run repo:secrets:verify

      - name: Current committed-source secret scan
        shell: bash
        run: tools/repo/check_tracked_secrets.sh
