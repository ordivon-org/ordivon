name: Game Factory native previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Root mise config cascades into the Game toolchain and native tasks.
      - "mise.toml"
      - "domains/game/**"
      - "profiles/domains/game/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/game-factory.yml"
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "domains/game/examples/room-encounter/**"
      - "domains/game/examples/beacon-relay/**"
      - "domains/game/examples/native-composition/**"
      - "domains/game/examples/kenney-visual-composition/**"
      - "domains/game/mise.toml"
      - "domains/game/scripts/**"
      - "domains/game/formal/**"
      - "domains/game/test/**"
      - "domains/game/src/**"
      - "domains/game/package.json"
      - "domains/game/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/game-factory.yml"
permissions:
  contents: read

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-g11-contract:
    name: Godot clean-checkout native consumer acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install pinned Godot engine
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Verify full native Godot factory qualification and Beacon gameplay coverage
        working-directory: domains/game
        run: |
          set -euo pipefail
          test ! -d examples/room-encounter/.godot
          pnpm install --frozen-lockfile
          pnpm check
          mise run factory:validate:godot
          mise run test:beacon
          python3 scripts/test_godot_package_contract.py

  native-preview:
    if: github.event_name != 'pull_request'
    name: Godot ${{ matrix.game }} factory product
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: room
            task: factory:package:room
            product: room-encounter
          - game: beacon
            task: factory:package:beacon
            product: beacon-relay
    timeout-minutes: 75
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install native Game toolchain
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise install
          godot --version

      - name: Install matching upstream Godot export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          gh release download 4.7.2-stable --repo godotengine/godot             --pattern 'Godot_v4.7.2-stable_export_templates.tpz' --dir "$stage"
          target="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$target"
          unzip -q -j "$stage/Godot_v4.7.2-stable_export_templates.tpz" 'templates/*' -d "$target"
          test -s "$target/linux_release.x86_64"
          test -s "$target/windows_release_x86_64.exe"

      - name: Validate one complete source-bound native Linux/Windows bundle
        id: package
        working-directory: domains/game
        run: |
          set -euo pipefail
          mise run ${{ matrix.task }} | tee "$RUNNER_TEMP/game-${{ matrix.game }}-package.log"
          bundle="$(sed -n 's/^GAME_FACTORY_BUNDLE_PATH=//p' "$RUNNER_TEMP/game-${{ matrix.game }}-package.log" | tail -n 1)"
          test -n "$bundle" && test -s "$bundle/READY" && test -s "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "SOURCE_COMMIT=${{ github.sha }}" "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "SOURCE_WORKTREE=clean" "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "RELEASE_PUBLISHED=false" "$bundle/BUILD_SOURCE.txt"
          if grep -Fq "SHA256=UNKNOWN" "$bundle/BUILD_SOURCE.txt"; then
            echo "Missing exact matching export template identity" >&2
            exit 1
          fi
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          printf 'bundle_path=%s\n' "$bundle" >> "$GITHUB_OUTPUT"

      - name: Store validated short-lived technical preview bundle, not a GitHub Release
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordivon-game-${{ matrix.game }}-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.package.outputs.bundle_path }}/
