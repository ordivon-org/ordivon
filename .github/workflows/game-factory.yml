name: Game Factory native previews

on:
  workflow_dispatch:
    inputs:
      consumer_run_id:
        description: "Optional successful main Game factory run ID to consume (no rebuild)"
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      # Root mise config cascades into the Game toolchain and native tasks.
      - "mise.toml"
      - "domains/game/**"
      - "profiles/domains/game/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/game-factory.yml"
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "domains/game/examples/room-encounter/**"
      - "domains/game/examples/beacon-relay/**"
      - "domains/game/examples/native-composition/**"
      - "domains/game/examples/kenney-visual-composition/**"
      - "domains/game/mise.toml"
      - "domains/game/scripts/**"
      - "domains/game/formal/**"
      - "domains/game/test/**"
      - "domains/game/src/**"
      - "domains/game/package.json"
      - "domains/game/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/game-factory.yml"
permissions:
  contents: read

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-g11-contract:
    name: Godot clean-checkout native consumer acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install pinned Godot engine
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Verify full native Godot factory qualification and Beacon gameplay coverage
        working-directory: domains/game
        run: |
          set -euo pipefail
          test ! -d examples/room-encounter/.godot
          mise run test:consumer-contracts
          pnpm install --frozen-lockfile
          pnpm check
          mise run factory:validate:godot
          mise run test:beacon
          python3 scripts/test_godot_package_contract.py

  native-preview:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.consumer_run_id == '')
    name: Godot ${{ matrix.game }} factory product
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: room
            task: factory:package:room
            product: room-encounter
          - game: beacon
            task: factory:package:beacon
            product: beacon-relay
    timeout-minutes: 75
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install native Game toolchain
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise install
          godot --version

      - name: Install matching upstream Godot export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          gh release download 4.7.2-stable --repo godotengine/godot             --pattern 'Godot_v4.7.2-stable_export_templates.tpz' --dir "$stage"
          target="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$target"
          unzip -q -j "$stage/Godot_v4.7.2-stable_export_templates.tpz" 'templates/*' -d "$target"
          test -s "$target/linux_release.x86_64"
          test -s "$target/windows_release_x86_64.exe"

      - name: Validate one complete source-bound native Linux/Windows bundle
        id: package
        working-directory: domains/game
        run: |
          set -euo pipefail
          mise run ${{ matrix.task }} | tee "$RUNNER_TEMP/game-${{ matrix.game }}-package.log"
          bundle="$(sed -n 's/^GAME_FACTORY_BUNDLE_PATH=//p' "$RUNNER_TEMP/game-${{ matrix.game }}-package.log" | tail -n 1)"
          test -n "$bundle" && test -s "$bundle/READY" && test -s "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "SOURCE_COMMIT=${{ github.sha }}" "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "SOURCE_WORKTREE=clean" "$bundle/BUILD_SOURCE.txt"
          grep -Fxq "RELEASE_PUBLISHED=false" "$bundle/BUILD_SOURCE.txt"
          if grep -Fq "SHA256=UNKNOWN" "$bundle/BUILD_SOURCE.txt"; then
            echo "Missing exact matching export template identity" >&2
            exit 1
          fi
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          printf 'bundle_path=%s\n' "$bundle" >> "$GITHUB_OUTPUT"

      - name: Store validated short-lived technical preview bundle, not a GitHub Release
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordivon-game-${{ matrix.game }}-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ steps.package.outputs.bundle_path }}/

  hosted-consumer:
    name: Qualify hosted Linux consumer of existing previews
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      QUALIFY_RUN_ID: ${{ inputs.consumer_run_id }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify native runner capabilities
        run: |
          set -euo pipefail
          [[ "$QUALIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils libx11-6 libxtst6 libgl1-mesa-dri ffmpeg
          command -v xvfb-run xprop ffmpeg ffprobe
          python3 -c 'import ctypes, hashlib; ctypes.CDLL("libX11.so.6"); ctypes.CDLL("libXtst.so.6"); assert hasattr(hashlib, "file_digest")'
          xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" xdpyinfo >/dev/null
          ffmpeg -version
      - name: Fetch exact successful main preview artifacts
        working-directory: domains/game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/hosted_runner_acceptance.py fetch --repository "$GITHUB_REPOSITORY" --run-id "$QUALIFY_RUN_ID" --stage "$RUNNER_TEMP/game-hosted-consumer"
      - name: Consume original native previews without a rebuild
        working-directory: domains/game
        run: |
          set -euo pipefail
          python3 scripts/hosted_runner_acceptance.py qualify --repository "$GITHUB_REPOSITORY" --run-id "$QUALIFY_RUN_ID" --stage "$RUNNER_TEMP/game-hosted-consumer" | tee "$RUNNER_TEMP/game-hosted-consumer-receipt.json"
      - name: Store scoped consumer receipt
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-hosted-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/game-hosted-consumer-receipt.json
          if-no-files-found: error
          retention-days: 14
