name: Game Factory native previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "domains/game/mise.toml"
      - "domains/game/examples/room-encounter/**"
      - "domains/game/AGENTS.md"
      - "domains/game/docs/agent-execution-contract-spec.md"
      - "domains/game/docs/agent-execution-implementation-plan.md"
      - ".github/workflows/game-factory.yml"
  push:
    branches: [main]
    paths:
      - "domains/game/examples/room-encounter/**"
      - "domains/game/examples/beacon-relay/**"
      - "domains/game/examples/native-composition/**"
      - "domains/game/examples/kenney-visual-composition/**"
      - "domains/game/mise.toml"
      - ".github/workflows/game-factory.yml"

permissions:
  contents: read

concurrency:
  group: game-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-g11-contract:
    name: Godot G11 clean-checkout native acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install pinned Godot engine
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Run real G11 acceptance without prior import cache
        working-directory: domains/game
        run: |
          set -euo pipefail
          test ! -d examples/room-encounter/.godot
          mise run test:agent-episode

  native-preview:
    if: github.event_name != 'pull_request'
    name: Godot ${{ matrix.game }} factory product
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: room
            task: factory:package:room
            product: room-encounter
          - game: beacon
            task: factory:package:beacon
            product: beacon-relay
    timeout-minutes: 75
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install existing Mise task runner
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.12
          install: false
          cache: true

      - name: Install native Game toolchain
        working-directory: domains/game
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise install
          godot --version

      - name: Install matching upstream Godot export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          gh release download 4.7.2-stable --repo godotengine/godot             --pattern 'Godot_v4.7.2-stable_export_templates.tpz' --dir "$stage"
          target="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$target"
          unzip -q -j "$stage/Godot_v4.7.2-stable_export_templates.tpz" 'templates/*' -d "$target"
          test -s "$target/linux_release.x86_64"
          test -s "$target/windows_release_x86_64.exe"

      - name: Validate and export actual Linux and Windows previews
        working-directory: domains/game
        run: |
          set -euo pipefail
          mise run ${{ matrix.task }}

      - name: Publish source-bound technical previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordivon-game-${{ matrix.game }}-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            domains/game/dist/${{ matrix.product }}/*linux*x86_64.tar.gz
            domains/game/dist/${{ matrix.product }}/*windows*x86_64.zip
