name: security-v2-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-waist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate canonical threat model binding
        run: PYTHONPATH=src python scripts/validate_threat_model_binding.py threat-models/security-v2-r1.json --repo-root .
      - name: Validate TM-BOM schema
        run: ./scripts/validate_tmbom.sh threat-models/security-v2-r1.json
      - name: OPA policy tests
        run: |
          echo "OPA is an external runtime dependency; local Runtime acceptance pins and executes the installed binary."
