name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: input
    id: owner
    attributes:
      label: Owner directory
      description: The natural owner this belongs to, if known.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The real consumer and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Prefer deleting or reusing existing capability before adding new machinery.
    validations:
      required: true
