name: Bug report
description: Report a reproducible defect in one bounded owner.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use private reporting for vulnerabilities."
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and affected consumer
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected owner contract
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Exact source revision and safe reproduction
    validations:
      required: true
  - type: textarea
    id: unknown
    attributes:
      label: UNKNOWN states and additional consumer impact
